<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="50%" stop-color="#0a1322"/>
      <stop offset="100%" stop-color="#02050e"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="50" y="50" width="1100" height="530" rx="20" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Badge -->
  <rect x="90" y="85" width="410" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="110" cy="103" r="5" fill="#38bdf8"/>
  <text x="125" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">vLLM 0.33.0 · CHUNKED PREFILL BENCHMARK</text>

  <!-- Title -->
  <text x="90" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Chunked Prefill 与 PagedAttention 的吞吐博弈</text>
  <text x="90" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="url(#accent-cyan)">为什么生产级推理依然逃不过首字与吞吐的互斥诅咒？</text>

  <!-- Subtitle -->
  <text x="90" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8">双卡 NVIDIA Tesla T4 × 2 (TP=2) · Qwen2.5-7B-Instruct · 36 组全矩阵压测真实定性</text>

  <!-- Stat Cards Grid -->
  <g transform="translate(90, 315)">
    <!-- Card 1: 512 Sweet Spot -->
    <rect x="0" y="0" width="315" height="215" rx="12" fill="#0b1329" stroke="#10b981" stroke-width="1.5"/>
    <rect x="18" y="18" width="90" height="24" rx="4" fill="#064e3b"/>
    <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">黄金平衡点</text>
    <text x="18" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Chunk = 512 (最优解)</text>
    <text x="18" y="105" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="800" fill="#34d399">-91.6%</text>
    <text x="18" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">TTFT 首字延迟从 9.1s 削平至 770ms</text>
    <line x1="18" y1="145" x2="295" y2="145" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">长入吞吐：40.0 → 70.5 tok/s</text>
    <text x="18" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6ee7b7">吞吐反增 +76.1%，GPU利用率达 90.3%</text>

    <!-- Card 2: 256 Trap -->
    <rect x="345" y="0" width="315" height="215" rx="12" fill="#0b1329" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="363" y="18" width="90" height="24" rx="4" fill="#450a0a"/>
    <text x="373" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f87171">算力反噬陷阱</text>
    <text x="363" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Chunk = 256 (切得过细)</text>
    <text x="363" y="105" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="800" fill="#ef4444">7.92 s</text>
    <text x="363" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Token 间延迟抖动飙升 (ITL P99)</text>
    <line x1="363" y1="145" x2="640" y2="145" stroke="#1e293b" stroke-width="1"/>
    <text x="363" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">GEMM 碎片化 + 调度气泡</text>
    <text x="363" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fca5a5">并发8下吞吐跌20%，GPU跌至 44.2%</text>

    <!-- Card 3: 1024 Throughput Peak -->
    <rect x="690" y="0" width="330" height="215" rx="12" fill="#0b1329" stroke="#3b82f6" stroke-width="1"/>
    <rect x="708" y="18" width="90" height="24" rx="4" fill="#172554"/>
    <text x="718" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">吞吐峰值点</text>
    <text x="708" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Chunk = 1024 (高吞吐)</text>
    <text x="708" y="105" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="800" fill="#60a5fa">115.1 tok/s</text>
    <text x="708" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">全测试集综合平均吞吐之冠</text>
    <line x1="708" y1="145" x2="1000" y2="145" stroke="#1e293b" stroke-width="1"/>
    <text x="708" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">首字保持毫秒级 (TTFT ~850ms)</text>
    <text x="708" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#93c5fd">生产基建大并发吞吐与首字兼顾解</text>
  </g>
</svg>