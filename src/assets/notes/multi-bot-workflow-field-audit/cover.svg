<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030713"/>
      <stop offset="50%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#02040b"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      .title { font: 900 40px -apple-system,'Segoe UI','PingFang SC',Roboto,sans-serif; fill: url(#tg); }
      .sub   { font: 600 17px -apple-system,'Segoe UI','PingFang SC',Roboto,sans-serif; fill: #94a3b8; }
      .kpi   { font: 900 30px -apple-system,'Segoe UI',Roboto,sans-serif; }
      .klab  { font: 600 12.5px -apple-system,'Segoe UI',Roboto,sans-serif; fill: #cbd5e1; }
      .bot   { font: 700 11px -apple-system,'Segoe UI',Roboto,sans-serif; fill: #f1f5f9; }
      .edge  { font: 600 10px -apple-system,'Segoe UI',Roboto,sans-serif; fill: #7dd3fc; }
      .foot  { font: 500 12px -apple-system,'Segoe UI',Roboto,sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>

  <!-- deco grid -->
  <g stroke="#132036" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200 M0 480 H1200 M0 560 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <!-- headline -->
  <text x="70" y="120" class="title">1.28% 的人类在场</text>
  <text x="70" y="166" class="sub">5.2 万条台账实测 · 18 Bot 协同的真实工作模式</text>
  <text x="70" y="196" class="sub" fill="#475569" font-size="14">探针对象：本地协同台账 messages.db · 快照 2026-11-18</text>

  <!-- KPI band -->
  <g filter="url(#sh)">
    <rect x="70" y="230" width="252" height="110" rx="12" fill="#0b1526" stroke="#1e3a5f"/>
    <text x="196" y="282" text-anchor="middle" class="kpi" fill="#7dd3fc">52,183</text>
    <text x="196" y="310" text-anchor="middle" class="klab">条消息 · 168 线程</text>

    <rect x="342" y="230" width="252" height="110" rx="12" fill="#0b1526" stroke="#1e3a5f"/>
    <text x="468" y="282" text-anchor="middle" class="kpi" fill="#fbbf24">1.28%</text>
    <text x="468" y="310" text-anchor="middle" class="klab">人类消息 · 中位 16 字</text>

    <rect x="614" y="230" width="252" height="110" rx="12" fill="#0b1526" stroke="#1e3a5f"/>
    <text x="740" y="282" text-anchor="middle" class="kpi" fill="#34d399">330</text>
    <text x="740" y="310" text-anchor="middle" class="klab">次派活 · 失败 85.7% 是护栏</text>

    <rect x="886" y="230" width="244" height="110" rx="12" fill="#0b1526" stroke="#1e3a5f"/>
    <text x="1008" y="282" text-anchor="middle" class="kpi" fill="#f472b6">99.1%</text>
    <text x="1008" y="310" text-anchor="middle" class="klab">单点直派 · 无网状群聊</text>
  </g>

  <!-- right-side mini org graph -->
  <g>
    <line x1="920" y1="392" x2="790" y2="470" stroke="#334155" stroke-width="2.5"/>
    <line x1="920" y1="392" x2="905" y2="470" stroke="#334155" stroke-width="1.5"/>
    <line x1="920" y1="392" x2="1010" y2="470" stroke="#334155" stroke-width="2.5"/>
    <line x1="1010" y1="470" x2="1105" y2="470" stroke="#334155" stroke-width="0" />
    <line x1="860" y1="510" x2="790" y2="560" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="770" y="468" text-anchor="end" class="edge">×48</text>
    <text x="1022" y="468" class="edge">×48</text>
    <rect x="880" y="368" width="90" height="30" rx="8" fill="#134e4a" stroke="#34d399"/>
    <text x="925" y="388" text-anchor="middle" class="bot">总管</text>
    <rect x="740" y="470" width="100" height="30" rx="8" fill="#0b1526" stroke="#a78bfa"/>
    <text x="790" y="490" text-anchor="middle" class="bot">文史编剧</text>
    <rect x="860" y="470" width="90" height="30" rx="8" fill="#0b1526" stroke="#475569"/>
    <text x="905" y="490" text-anchor="middle" class="bot">制作人</text>
    <rect x="965" y="470" width="110" height="30" rx="8" fill="#0b1526" stroke="#f59e0b"/>
    <text x="1020" y="490" text-anchor="middle" class="bot">视听工程师</text>
    <rect x="730" y="560" width="120" height="26" rx="8" fill="#451a03" stroke="#f59e0b"/>
    <text x="790" y="578" text-anchor="middle" class="bot">loong（闸门）</text>
    <text x="1090" y="440" text-anchor="middle" class="sub" fill="#334155" font-size="30" opacity="0.9">…18 席</text>
  </g>

  <!-- left-bottom tagline -->
  <g>
    <rect x="70" y="390" width="560" height="200" rx="12" fill="#081120" stroke="#1e3a5f"/>
    <text x="95" y="424" class="klab" fill="#7dd3fc">本文回答的三个问题</text>
    <text x="95" y="456" class="klab">· 这套 18 Bot 系统实际怎么干活：99.1% 单点直派、30 条派活边、金字塔逐级承重</text>
    <text x="95" y="484" class="klab">· 25.45% 的派活失败率是什么：85.7% 是协议护栏的毫秒级拒绝，不是宕机</text>
    <text x="95" y="512" class="klab">· 人类 1.28% 在做什么：闸门、额度仲裁、方向选择 —— 中位 16 字</text>
    <text x="95" y="548" class="klab" fill="#475569">繁重的表达在机器侧（工单中位 1,483 字），极简的意志在人类侧</text>
    <text x="95" y="576" class="klab" fill="#475569">全部数字来自台账实测，SQL 与快照附文末</text>
  </g>

  <text x="600" y="618" text-anchor="middle" class="foot">git-novel · multi-bot-workflow-field-audit</text>
</svg>
