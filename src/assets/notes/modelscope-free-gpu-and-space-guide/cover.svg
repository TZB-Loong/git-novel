<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="50%" stop-color="#0E162B" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="msPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cardBgCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75" />
    </linearGradient>
    <filter id="glowCover" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradCover)" />

  <!-- Grid overlay -->
  <g opacity="0.12">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#818CF8" stroke-width="1" stroke-dasharray="4 8" />
    <path d="M100,0 V675 M200,0 V675 M300,0 V675 M400,0 V675 M500,0 V675 M600,0 V675 M700,0 V675 M800,0 V675 M900,0 V675 M1000,0 V675 M1100,0 V675" stroke="#818CF8" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="260" cy="220" r="180" fill="#6366F1" opacity="0.12" filter="url(#glowCover)" />
  <circle cx="980" cy="380" r="240" fill="#EC4899" opacity="0.08" filter="url(#glowCover)" />

  <!-- Category Badge -->
  <g transform="translate(80, 75)">
    <rect width="220" height="34" rx="17" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#10B981" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#C7D2FE" letter-spacing="0.5">MODELSCOPE HARDCORE</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    国产免费算力天花板：魔搭 ModelScope
  </text>
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="40" font-weight="800" fill="url(#msPurpleGrad)" letter-spacing="-0.5">
    36h GPU 额度、内网免流镜像与创空间部署
  </text>

  <!-- Subtitle -->
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
    免翻直连百兆拉取 · 36h/月额度机制 · Notebook vs 创空间双轨拓扑 · Qwen / DeepSeek 实战
  </text>

  <!-- Visual Panels (Bottom Half) -->

  <!-- Panel 1: Notebook vs Spaces Dual Architecture -->
  <g transform="translate(80, 330)">
    <rect width="500" height="270" rx="12" fill="url(#cardBgCover)" stroke="#312E81" stroke-width="1.5" />
    <!-- Header bar -->
    <path d="M0,12 Q0,0 12,0 H488 Q500,0 500,12 V38 H0 Z" fill="#1E1B4B" opacity="0.8" />
    <circle cx="20" cy="19" r="4.5" fill="#EF4444" />
    <circle cx="36" cy="19" r="4.5" fill="#F59E0B" />
    <circle cx="52" cy="19" r="4.5" fill="#10B981" />
    <text x="75" y="23" font-family="monospace" font-size="12" fill="#A5B4FC">modelscope::architecture_topology.rs</text>

    <!-- Branch A: Notebook -->
    <g transform="translate(25, 55)">
      <rect width="215" height="110" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2" />
      <text x="15" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC">交互式 Notebook (GPU)</text>
      <text x="15" y="48" font-family="monospace" font-size="10" fill="#C7D2FE">· 额度：36 小时 / 月</text>
      <text x="15" y="66" font-family="monospace" font-size="10" fill="#C7D2FE">· 硬件：T4 (16G) / A10 (24G)</text>
      <text x="15" y="84" font-family="monospace" font-size="10" fill="#FBBF24">· 特征：4h休眠 / 无公网入站</text>
      <text x="15" y="100" font-family="monospace" font-size="10" fill="#34D399">· 场景：模型微调 / 权重转换</text>
    </g>

    <!-- Branch B: Spaces -->
    <g transform="translate(260, 55)">
      <rect width="215" height="110" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.2" />
      <text x="15" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#6EE7B7">创空间 Spaces (Hosting)</text>
      <text x="15" y="48" font-family="monospace" font-size="10" fill="#D1FAE5">· 运行：7×24h 持续托管</text>
      <text x="15" y="66" font-family="monospace" font-size="10" fill="#D1FAE5">· 公网：分配二级域名访问</text>
      <text x="15" y="84" font-family="monospace" font-size="10" fill="#A7F3D0">· 框架：Gradio / Streamlit</text>
      <text x="15" y="100" font-family="monospace" font-size="10" fill="#34D399">· 场景：API 暴露 / WebUI 服务</text>
    </g>

    <!-- Bottom summary row -->
    <rect x="25" y="180" width="450" height="65" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="40" y="205" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">核心避坑边界：</text>
    <text x="40" y="226" font-family="-apple-system, sans-serif" font-size="11" fill="#F59E0B">Notebook 不能当服务器常驻！要对外发布服务必须走创空间部署。</text>
  </g>

  <!-- Panel 2: Bandwidth & Eco Showcase -->
  <g transform="translate(610, 330)">
    <rect width="510" height="270" rx="12" fill="url(#cardBgCover)" stroke="#312E81" stroke-width="1.5" />
    <!-- Header bar -->
    <path d="M0,12 Q0,0 12,0 H498 Q510,0 510,12 V38 H0 Z" fill="#1E1B4B" opacity="0.8" />
    <circle cx="20" cy="19" r="4.5" fill="#EF4444" />
    <circle cx="36" cy="19" r="4.5" fill="#F59E0B" />
    <circle cx="52" cy="19" r="4.5" fill="#10B981" />
    <text x="75" y="23" font-family="monospace" font-size="12" fill="#A5B4FC">network_pipeline::internal_mirror_speed.sh</text>

    <!-- Comparison 1: Overseas HF Hub -->
    <g transform="translate(25, 55)">
      <rect width="460" height="65" rx="6" fill="#201116" stroke="#831843" stroke-width="1" />
      <text x="15" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F472B6">海外 HuggingFace Hub（国内直连）</text>
      <rect x="15" y="32" width="430" height="12" rx="3" fill="#374151" />
      <rect x="15" y="32" width="22" height="12" rx="3" fill="#F43F5E" />
      <text x="45" y="42" font-family="monospace" font-size="10" fill="#FDA4AF">0.8 MB/s · 频繁连接重置 / 经常断流超时</text>
    </g>

    <!-- Comparison 2: Internal ModelScope Mirror -->
    <g transform="translate(25, 135)">
      <rect width="460" height="95" rx="6" fill="#042F2E" stroke="#0D9488" stroke-width="1" />
      <text x="15" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">阿里内网魔搭 ModelScope OSS 极速直连</text>
      <rect x="15" y="32" width="430" height="12" rx="3" fill="#374151" />
      <rect x="15" y="32" width="405" height="12" rx="3" fill="#14B8A6" />
      <text x="310" y="42" font-family="monospace" font-size="10" font-weight="700" fill="#CCFBF1">180+ MB/s (极速打满)</text>
      <text x="15" y="64" font-family="monospace" font-size="10" fill="#99F6E4">· Qwen2.5-7B (15GB): 仅需 1 分 20 秒拉取完成</text>
      <text x="15" y="80" font-family="monospace" font-size="10" fill="#99F6E4">· DeepSeek-R1-Distill: 百兆内网直达显存，零梯免流</text>
    </g>
  </g>

  <!-- Watermark -->
  <text x="1120" y="645" text-anchor="end" font-family="monospace" font-size="12" fill="#475569">
    git-novel · Tuli · 2026-11
  </text>
</svg>