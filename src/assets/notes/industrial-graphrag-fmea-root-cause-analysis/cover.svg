<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#080f1d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <style>
      .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #38bdf8; letter-spacing: 2px; }
      .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 40px; font-weight: 900; fill: #f8fafc; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; fill: #94a3b8; font-weight: 500; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .card-sub { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="250" height="32" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="5" fill="#38bdf8"/>
    <text x="34" y="21" class="badge">INDUSTRIAL GRAPHRAG</text>

    <text x="0" y="85" class="main-title">从向量检索到因果排障：</text>
    <text x="0" y="135" class="main-title" fill="url(#accent-grad)">制造业知识库终结“语义断层”实战</text>

    <text x="0" y="180" class="sub-title">PLC 报警多跳关联 · FMEA 物理因果图谱 · 知识驱动与车间 MTTR 压降</text>
  </g>

  <!-- Visual Architecture Cards in Hero -->
  <g transform="translate(80, 310)">
    <!-- Card 1: Vector RAG Trap -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="310" height="240" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="0" y="0" width="310" height="36" rx="12" fill="#2b1216"/>
      <text x="16" y="23" fill="#fca5a5" class="card-title">✘ 传统向量检索 (Naive Vector)</text>
      
      <g transform="translate(16, 52)">
        <text x="0" y="16" fill="#ef4444" class="card-sub" font-weight="700">语义相似 $
eq$ 物理因果</text>
        <text x="0" y="38" fill="#94a3b8" font-size="12px">• 检索仅匹配 "E-302 主轴过热" 字面定义</text>
        <text x="0" y="60" fill="#94a3b8" font-size="12px">• 无法穿透上游阀门/传感器故障链</text>
        <text x="0" y="82" fill="#94a3b8" font-size="12px">• 多跳因果推理准确率 &lt; 18%</text>
        <rect x="0" y="110" width="278" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="135" fill="#f87171" font-size="12px" font-family="monospace">故障定位耗时 (MTTR): 4.2h</text>
      </g>
    </g>

    <!-- Center Arrow -->
    <g transform="translate(325, 105)">
      <path d="M0,15 L40,15 M30,5 L40,15 L30,25" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Card 2: Dual Engine GraphRAG -->
    <g transform="translate(380, 0)" filter="url(#card-shadow)">
      <rect width="340" height="240" rx="12" fill="#0b1329" stroke="#06b6d4" stroke-width="2"/>
      <rect x="0" y="0" width="340" height="36" rx="12" fill="#083344"/>
      <text x="16" y="23" fill="#38bdf8" class="card-title">⚡ GraphRAG 双擎混合检索</text>
      
      <g transform="translate(16, 52)">
        <text x="0" y="16" fill="#38bdf8" class="card-sub" font-weight="700">连接主义 (LLM) + 符号主义 (KG)</text>
        <text x="0" y="38" fill="#94a3b8" font-size="12px">• 实体解析：自然语言口语 $ightarrow$ 标准设备位号</text>
        <text x="0" y="60" fill="#94a3b8" font-size="12px">• 动态剪枝：FMEA 本体因果拓扑多跳寻径</text>
        <text x="0" y="82" fill="#94a3b8" font-size="12px">• 结构化凭据上下文组装 $ightarrow$ 精确排障指南</text>
        <rect x="0" y="110" width="308" height="40" rx="6" fill="#082f49" stroke="#0284c7"/>
        <text x="12" y="135" fill="#38bdf8" font-size="12px" font-family="monospace">多跳因果召回率: 92.4% (↑5.1x)</text>
      </g>
    </g>

    <!-- Card 3: Production Impact -->
    <g transform="translate(735, 0)" filter="url(#card-shadow)">
      <rect width="305" height="240" rx="12" fill="#061a23" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="0" width="305" height="36" rx="12" fill="#064e3b"/>
      <text x="16" y="23" fill="#6ee7b7" class="card-title">✔ 工业现场闭环收益</text>
      
      <g transform="translate(16, 52)">
        <text x="0" y="16" fill="#34d399" class="card-sub" font-weight="700">车间级真实收益实测</text>
        <text x="0" y="38" fill="#cbd5e1" font-size="12px">• MTTR 故障修复时间: 4.2h $ightarrow$ 0.8h</text>
        <text x="0" y="60" fill="#cbd5e1" font-size="12px">• 停机损失压降: 78.6%</text>
        <text x="0" y="82" fill="#cbd5e1" font-size="12px">• 维保经验数字化留存率: 96%</text>
        <rect x="0" y="110" width="273" height="40" rx="6" fill="#064e3b" stroke="#059669"/>
        <text x="12" y="135" fill="#6ee7b7" font-size="12px" font-family="monospace">排产停滞风险下降 80%</text>
      </g>
    </g>
  </g>
</svg>