<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070f"/>
      <stop offset="50%" stop-color="#0d1122"/>
      <stop offset="100%" stop-color="#04050c"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="l1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="l2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="l3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="l4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="l5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="l6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#181f33" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="44" y="44" width="1112" height="542" rx="22" fill="none" stroke="#242e47" stroke-width="2" stroke-dasharray="10,7"/>

  <!-- badge -->
  <rect x="84" y="82" width="300" height="38" rx="8" fill="#12182a" stroke="#364363"/>
  <circle cx="106" cy="101" r="6" fill="#a78bfa"/>
  <text x="122" y="107" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#a3b1c9" letter-spacing="2">EVAL FRAMEWORKS · 2026</text>

  <!-- title -->
  <text x="84" y="200" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="76" font-weight="800" fill="url(#titleGrad)">16 WAYS</text>
  <text x="84" y="256" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#e8edf5">评测框架横评：先选层级，再选品牌</text>
  <text x="84" y="296" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#8fa0b8">Data · Target · Judgment · Run 四件套 / 判分器自身也要被评</text>

  <!-- six layer bars -->
  <g transform="translate(84, 330)">
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">
      <rect x="0" y="0" width="86" height="26" rx="5" fill="url(#l1)"/>
      <text x="96" y="18" fill="#9aa8bd">L1 共享形状</text>

      <rect x="0" y="32" width="150" height="26" rx="5" fill="url(#l2)"/>
      <text x="160" y="50" fill="#9aa8bd">L2 代码优先 · Inspect / DeepEval</text>

      <rect x="0" y="64" width="214" height="26" rx="5" fill="url(#l3)"/>
      <text x="224" y="82" fill="#9aa8bd">L3 配置优先 · lm-harness / Promptfoo</text>

      <rect x="0" y="96" width="278" height="26" rx="5" fill="url(#l4)"/>
      <text x="288" y="114" fill="#9aa8bd">L4 评测优先 · Braintrust / MLflow</text>

      <rect x="0" y="128" width="342" height="26" rx="5" fill="url(#l5)"/>
      <text x="352" y="146" fill="#9aa8bd">L5 可观测优先 · Langfuse / Phoenix</text>

      <rect x="0" y="160" width="406" height="26" rx="5" fill="url(#l6)"/>
      <text x="416" y="178" fill="#9aa8bd">L6 单一用途 · Ragas</text>
    </g>
  </g>

  <!-- right stat block -->
  <g transform="translate(700, 372)">
    <rect x="0" y="0" width="420" height="150" rx="14" fill="#0a1020" stroke="#26314b" stroke-width="1.5"/>
    <text x="24" y="32" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#7c8ca6" letter-spacing="1.5">THE ONE RULE</text>
    <text x="24" y="68" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="800" fill="#e8edf5">判分器不是中立的尺子</text>
    <text x="24" y="96" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8fa0b8">它是待测系统的一部分，必须自己被测。</text>
    <line x1="24" y1="110" x2="396" y2="110" stroke="#1e2740" stroke-width="1"/>
    <text x="24" y="134" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#67e8f9">每个评测要两个数字：产品多好 + 裁判与人的一致率</text>
  </g>

  <text x="84" y="566" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5c6b82">Source: Sergii Makarevych · 2026-11-22 · 星数与维护状态经 GitHub API 独立核验</text>
</svg>
