<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradMCP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0B1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanBlueGradMCP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="emeraldGradMCP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGradMCP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="amberGradMCP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cardBgGradMCP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glowMCP" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradMCP)" />

  <!-- Background Grid -->
  <g opacity="0.12" stroke="#64748B" stroke-width="1">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" />
    <path d="M100,0 V675 M200,0 V675 M300,0 V675 M400,0 V675 M500,0 V675 M600,0 V675 M700,0 V675 M800,0 V675 M900,0 V675 M1000,0 V675 M1100,0 V675" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="160" fill="#3B82F6" opacity="0.15" filter="url(#glowMCP)" />
  <circle cx="620" cy="340" r="220" fill="#06B6D4" opacity="0.12" filter="url(#glowMCP)" />
  <circle cx="1020" cy="480" r="180" fill="#10B981" opacity="0.14" filter="url(#glowMCP)" />
  <circle cx="850" cy="160" r="150" fill="#A855F7" opacity="0.12" filter="url(#glowMCP)" />

  <!-- Top Category Tag -->
  <g transform="translate(80, 56)">
    <rect width="360" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" opacity="0.95" />
    <circle cx="18" cy="17" r="5" fill="#38BDF8" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">OPEN SOURCE AGENT INFRA · MCP</text>
  </g>

  <!-- Main Title & Subtitle -->
  <text x="80" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">从玩具协议到企业中枢</text>
  <text x="80" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#38BDF8" letter-spacing="0.2">Model Context Protocol (MCP) 规模化落地与生产级架构</text>
  <text x="80" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94A3B8">动态工具路由 (Tool-RAG) · FastMCP 微服务解耦 · 权限防逃逸沙盒闭环</text>

  <!-- Central Architecture Showcase (Visual Cards) -->
  <g transform="translate(80, 270)">
    <!-- Card 1: Client Host & Gateway -->
    <g transform="translate(0, 0)">
      <rect width="290" height="250" rx="14" fill="url(#cardBgGradMCP)" stroke="#38BDF8" stroke-width="1.5" />
      <rect width="290" height="42" rx="14" fill="#0F172A" opacity="0.8" />
      <circle cx="24" cy="21" r="6" fill="#38BDF8" />
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">MCP Client &amp; Host Hub</text>
      
      <!-- Content -->
      <g transform="translate(18, 62)">
        <rect width="254" height="44" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text x="12" y="26" font-family="monospace" font-size="13" fill="#38BDF8">Claude Code / Cursor / Agent</text>
      </g>
      <g transform="translate(18, 120)">
        <rect width="254" height="50" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">两阶段意图路由器 (Semantic Gate)</text>
        <text x="12" y="38" font-family="monospace" font-size="11" fill="#94A3B8">Top-5 动态召回 · 剪枝 95% Schema</text>
      </g>
      <g transform="translate(18, 185)">
        <rect width="118" height="34" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1" />
        <text x="12" y="21" font-family="monospace" font-size="11" fill="#34D399">Token: 1.8k (-90%)</text>
        <rect x="130" width="124" height="34" rx="6" fill="#312E81" stroke="#818CF8" stroke-width="1" />
        <text x="142" y="21" font-family="monospace" font-size="11" fill="#C7D2FE">命中率: 98.4%</text>
      </g>
    </g>

    <!-- Connector Arrow 1 -->
    <g transform="translate(305, 125)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 3" />
      <polygon points="60,0 52,-5 52,5" fill="#38BDF8" />
      <text x="30" y="-10" text-anchor="middle" font-family="monospace" font-size="11" fill="#94A3B8">JSON-RPC / SSE</text>
    </g>

    <!-- Card 2: Enterprise Tool-RAG Center -->
    <g transform="translate(380, 0)">
      <rect width="320" height="250" rx="14" fill="url(#cardBgGradMCP)" stroke="#A855F7" stroke-width="1.5" />
      <rect width="320" height="42" rx="14" fill="#0F172A" opacity="0.8" />
      <circle cx="24" cy="21" r="6" fill="#A855F7" />
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Tool Registry &amp; RAG Index</text>
      
      <!-- Content -->
      <g transform="translate(18, 58)">
        <rect width="284" height="42" rx="7" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text x="12" y="24" font-family="monospace" font-size="12" fill="#E2E8F0">100+ 企业级 MCP 工具池 (Tools Pool)</text>
      </g>
      <g transform="translate(18, 110)">
        <rect width="284" height="60" rx="7" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#F3E8FF">混合检索 (Hybrid Semantic Search)</text>
        <text x="12" y="40" font-family="monospace" font-size="11" fill="#C084FC">BM25 关键词 + BGE 向量相似度重排</text>
      </g>
      <g transform="translate(18, 182)">
        <rect width="284" height="38" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
        <text x="14" y="23" font-family="monospace" font-size="11" fill="#A5B4FC">动态构建 Tools Schema Prompt</text>
      </g>
    </g>

    <!-- Connector Arrow 2 -->
    <g transform="translate(715, 125)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4 3" />
      <polygon points="60,0 52,-5 52,5" fill="#10B981" />
      <text x="30" y="-10" text-anchor="middle" font-family="monospace" font-size="11" fill="#34D399">mcp.run()</text>
    </g>

    <!-- Card 3: FastMCP & Sandboxed Services -->
    <g transform="translate(790, 0)">
      <rect width="250" height="250" rx="14" fill="url(#cardBgGradMCP)" stroke="#10B981" stroke-width="1.5" />
      <rect width="250" height="42" rx="14" fill="#0F172A" opacity="0.8" />
      <circle cx="24" cy="21" r="6" fill="#10B981" />
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">FastMCP 微服务节点</text>
      
      <!-- Content -->
      <g transform="translate(16, 56)">
        <rect width="218" height="38" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text x="12" y="23" font-family="monospace" font-size="11" fill="#38BDF8">Git / Jira / DB Server</text>
      </g>
      <g transform="translate(16, 102)">
        <rect width="218" height="50" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1" />
        <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#6EE7B7">三层安全防逃逸门禁</text>
        <text x="10" y="36" font-family="monospace" font-size="10" fill="#94A3B8">AST 语法检查 · 命令白名单</text>
      </g>
      <g transform="translate(16, 162)">
        <rect width="218" height="58" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1" />
        <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">只读沙盒 / 权限隔离</text>
        <text x="10" y="40" font-family="monospace" font-size="10" fill="#FCD34D">RBAC 鉴权 · 敏感调用二次确认</text>
      </g>
    </g>
  </g>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(80, 565)">
    <rect width="280" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94A3B8">工具 Schema 驻留：</text>
    <text x="135" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#38BDF8">28k $\rightarrow$ 1.8k Token (-93%)</text>
  </g>
  <g transform="translate(380, 565)">
    <rect width="320" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94A3B8">超百工具调用正确率：</text>
    <text x="165" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#10B981">41.5% $\rightarrow$ 98.4% (+56.9%)</text>
  </g>
  <g transform="translate(720, 565)">
    <rect width="320" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94A3B8">服务协议架构：</text>
    <text x="120" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#A855F7">FastMCP + SSE 微服务高并发</text>
  </g>
</svg>
