<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121324"/>
      <stop offset="100%" stop-color="#05050d"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="50" y="50" width="1100" height="530" rx="20" fill="none" stroke="#2e384d" stroke-width="2" stroke-dasharray="10,6"/>

  <!-- Badge -->
  <rect x="90" y="90" width="240" height="38" rx="8" fill="#1e2433" stroke="#475569" stroke-width="1"/>
  <circle cx="112" cy="109" r="6" fill="#f59e0b"/>
  <text x="128" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1">AGENT ARCHITECTURE</text>

  <!-- Main Title -->
  <text x="90" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#f8fafc">Prompt 调优已死，运行时约束当立</text>
  <text x="90" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="url(#flame)">顶级 Agent 团队为何放弃提示词玄学转向 Harness 架构？</text>

  <text x="90" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">
    从 AST 语法树守卫、PTY 虚拟终端、文件锁到双向阻断机制：工程确定性终结随机幻觉
  </text>

  <!-- Visual Blueprint -->
  <g transform="translate(90, 365)">
    <!-- Prompt Stack -->
    <rect x="0" y="0" width="310" height="135" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="24" y="36" font-family="monospace" font-size="13" font-weight="700" fill="#ef4444">OLD: PROMPT ENGINEERING</text>
    <text x="24" y="68" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#fca5a5">“请不要修改不可编辑的目录”</text>
    <text x="24" y="95" font-family="-apple-system, sans-serif" font-size="13" fill="#71717a">软性建议 · 随轮次稀释 · 概率性翻车</text>
    <text x="24" y="115" font-family="monospace" font-size="12" fill="#f87171">Status: Non-deterministic (死锁/越权)</text>

    <!-- Transition Arrow -->
    <text x="350" y="75" font-family="sans-serif" font-size="28" fill="#64748b">→</text>

    <!-- Harness Stack -->
    <rect x="400" y="0" width="560" height="135" rx="12" fill="#0f172a" stroke="url(#shield)" stroke-width="2"/>
    <text x="424" y="36" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8">NEW: RUNTIME HARNESS &amp; AST GUARDS</text>
    <text x="424" y="68" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">环境拦截层：PTY 拦截 + AST 解析 + 文件写锁</text>
    <text x="424" y="95" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">物理沙盒隔离 · 零越权可能 · 编译器级校验直接反馈错误栈</text>
    <text x="424" y="115" font-family="monospace" font-size="12" fill="#34d399">Status: Deterministic (形式化验证保真)</text>
  </g>
</svg>
