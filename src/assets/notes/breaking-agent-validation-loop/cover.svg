<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="danger" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Outer frame -->
  <rect x="50" y="50" width="1100" height="530" rx="20" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="10,6"/>

  <!-- Badge -->
  <rect x="90" y="90" width="220" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <circle cx="112" cy="109" r="6" fill="#38bdf8"/>
  <text x="128" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1">AI AGENT ENGINEERING</text>

  <!-- Main Title -->
  <text x="90" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc">打破自证闭环</text>
  <text x="90" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="url(#accent)">为什么 AI 软件工厂必须将“编码”与“验证”物理隔离？</text>

  <!-- Subtitle -->
  <text x="90" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">
    从“全绿测试但上线翻车”的循环自证陷阱，拆解对立验证代理（Adversarial Agent）与契约门禁
  </text>

  <!-- Architecture visual block -->
  <g transform="translate(90, 370)">
    <!-- Generator Box -->
    <rect x="0" y="0" width="280" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="24" y="38" font-family="monospace" font-size="14" font-weight="700" fill="#38bdf8">01. GENERATOR AGENT</text>
    <text x="24" y="70" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">业务代码生成器</text>
    <text x="24" y="98" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">上下文隔离 · 契约实现 · 原子提交</text>

    <!-- Wall / Barrier -->
    <g transform="translate(320, 0)">
      <line x1="20" y1="10" x2="20" y2="120" stroke="url(#danger)" stroke-width="4" stroke-dasharray="6,4"/>
      <rect x="0" y="45" width="40" height="40" rx="8" fill="#f43f5e" opacity="0.2"/>
      <text x="20" y="70" font-family="sans-serif" font-size="16" font-weight="900" fill="#f43f5e" text-anchor="middle">✕</text>
    </g>

    <!-- Verifier Box -->
    <rect x="380" y="0" width="280" height="130" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="404" y="38" font-family="monospace" font-size="14" font-weight="700" fill="#f43f5e">02. ADVERSARIAL AGENT</text>
    <text x="404" y="70" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">对抗式验证代理</text>
    <text x="404" y="98" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">独立沙盒 · 变异测试 · 盲测挑错</text>

    <!-- Gate Box -->
    <g transform="translate(700, 0)">
      <path d="M 0 65 L 40 65" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="60" y="0" width="260" height="130" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="84" y="38" font-family="monospace" font-size="14" font-weight="700" fill="#10b981">03. HARNESS GATE</text>
      <text x="84" y="70" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">形式化契约门禁</text>
      <text x="84" y="98" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">沙盒执行 · 属性测试 · 仲裁合入</text>
    </g>
  </g>
</svg>
