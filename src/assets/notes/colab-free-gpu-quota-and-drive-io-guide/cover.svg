<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="colabOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9AB00" />
      <stop offset="100%" stop-color="#EA4335" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162032" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.12">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8" />
    <path d="M100,0 V675 M200,0 V675 M300,0 V675 M400,0 V675 M500,0 V675 M600,0 V675 M700,0 V675 M800,0 V675 M900,0 V675 M1000,0 V675 M1100,0 V675" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="240" cy="220" r="180" fill="#F59E0B" opacity="0.08" filter="url(#glow)" />
  <circle cx="960" cy="380" r="220" fill="#3B82F6" opacity="0.09" filter="url(#glow)" />

  <!-- Header Category Badge -->
  <g transform="translate(80, 75)">
    <rect width="210" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="5" fill="#10B981" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">GOOGLE COLAB HARDCORE</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    告别黑盒封锁：Google Colab
  </text>
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="40" font-weight="800" fill="url(#colabOrangeGrad)" letter-spacing="-0.5">
    免费 T4 算力分配机制与 Drive I/O 避坑
  </text>

  <!-- Subtitle -->
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
    动态信誉评分解密 · 90min空闲与12h生命周期 · FUSE I/O吞吐压榨 · 断点容灾架构
  </text>

  <!-- Visual Architecture Showcase (Right & Lower Panels) -->

  <!-- Card 1: Dynamic Allocation & Decay State Machine -->
  <g transform="translate(80, 330)">
    <rect width="480" height="270" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <!-- Window Bar -->
    <path d="M0,12 Q0,0 12,0 H468 Q480,0 480,12 V38 H0 Z" fill="#1E293B" opacity="0.6" />
    <circle cx="20" cy="19" r="4.5" fill="#EF4444" />
    <circle cx="36" cy="19" r="4.5" fill="#F59E0B" />
    <circle cx="52" cy="19" r="4.5" fill="#10B981" />
    <text x="75" y="23" font-family="monospace" font-size="12" fill="#94A3B8">colab_scheduler::dynamic_allocation.rs</text>

    <!-- State diagram inside card -->
    <!-- Node 1: High Priority Tier -->
    <rect x="25" y="60" width="125" height="55" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.2" />
    <text x="40" y="83" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#60A5FA">高优先级池</text>
    <text x="40" y="101" font-family="monospace" font-size="10" fill="#93C5FD">T4 GPU 秒级分配</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M150,87 H180" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="3 3" />
    <polygon points="180,84 186,87 180,90" fill="#F59E0B" />
    <text x="153" y="78" font-family="monospace" font-size="9" fill="#FCD34D">长时间突发</text>

    <!-- Node 2: Throttled / Queue Tier -->
    <rect x="188" y="60" width="125" height="55" rx="8" fill="#451A03" stroke="#F59E0B" stroke-width="1.2" />
    <text x="203" y="83" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FBBF24">动态惩罚池</text>
    <text x="203" y="101" font-family="monospace" font-size="10" fill="#FDE68A">长时间排队 / CPU降级</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M313,87 H343" stroke="#EF4444" stroke-width="1.8" />
    <polygon points="343,84 349,87 343,90" fill="#EF4444" />
    <text x="315" y="78" font-family="monospace" font-size="9" fill="#F87171">JS模拟点击</text>

    <!-- Node 3: Ban / Blocked -->
    <rect x="350" y="60" width="105" height="55" rx="8" fill="#3B0764" stroke="#DC2626" stroke-width="1.2" />
    <text x="365" y="83" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F87171">GPU 熔断封锁</text>
    <text x="365" y="101" font-family="monospace" font-size="10" fill="#FECACA">TOS 违规警告</text>

    <!-- Recovery Arrow from Throttled back to High Priority -->
    <path d="M250,115 V145 H87 V123" fill="none" stroke="#10B981" stroke-width="1.8" />
    <polygon points="84,123 87,117 90,123" fill="#10B981" />
    <text x="110" y="140" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#34D399">12h~24h 静置自然冷却衰减恢复</text>

    <!-- Card bottom status summary -->
    <rect x="25" y="170" width="430" height="75" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="40" y="193" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">核心计费法则对比：</text>
    <text x="40" y="212" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">· Kaggle：透明仪表盘（30h/周，清零重置）</text>
    <text x="40" y="231" font-family="-apple-system, sans-serif" font-size="11" fill="#F59E0B">· Colab：完全黑盒动态信誉积分（用得多罚得狠，空闲恢复）</text>
  </g>

  <!-- Card 2: I/O Acceleration Architecture -->
  <g transform="translate(590, 330)">
    <rect width="530" height="270" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <!-- Window Bar -->
    <path d="M0,12 Q0,0 12,0 H518 Q530,0 530,12 V38 H0 Z" fill="#1E293B" opacity="0.6" />
    <circle cx="20" cy="19" r="4.5" fill="#EF4444" />
    <circle cx="36" cy="19" r="4.5" fill="#F59E0B" />
    <circle cx="52" cy="19" r="4.5" fill="#10B981" />
    <text x="75" y="23" font-family="monospace" font-size="12" fill="#94A3B8">storage_pipeline::drive_fuse_vs_nvme.sh</text>

    <!-- Comparison Row 1: Direct FUSE (Bad) -->
    <g transform="translate(25, 55)">
      <rect width="480" height="70" rx="8" fill="#1F1515" stroke="#7F1D1D" stroke-width="1" />
      <text x="15" y="23" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F87171">错误做法：直接在 /content/drive 读写碎小文件</text>
      <!-- Bar chart comparison -->
      <rect x="15" y="35" width="450" height="14" rx="3" fill="#374151" />
      <rect x="15" y="35" width="28" height="14" rx="3" fill="#EF4444" />
      <text x="50" y="46" font-family="monospace" font-size="11" fill="#FCA5A5">FUSE 协议栈开销 / 网络延迟 (3.8 MB/s · GPU 利用率 4%)</text>
      <text x="15" y="62" font-family="-apple-system, sans-serif" font-size="10" fill="#9CA3AF">数万小文件频繁 RPC 调用导致 I/O 阻塞，训练吞吐暴跌 90%+</text>
    </g>

    <!-- Comparison Row 2: Two-stage Pipeline (Good) -->
    <g transform="translate(25, 140)">
      <rect width="480" height="95" rx="8" fill="#062419" stroke="#065F46" stroke-width="1" />
      <text x="15" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34D399">硬核优化：本地 NVMe 虚拟盘暂存 + 异步打包回传</text>
      <!-- Bar chart comparison -->
      <rect x="15" y="33" width="450" height="14" rx="3" fill="#374151" />
      <rect x="15" y="33" width="410" height="14" rx="3" fill="#10B981" />
      <text x="430" y="44" font-family="monospace" font-size="11" fill="#A7F3D0">650+ MB/s</text>
      
      <!-- Flow steps inside row -->
      <text x="15" y="64" font-family="monospace" font-size="10" fill="#6EE7B7">1. dataset.tar.gz (单次大包拷贝) → /content/ (解压到本地高速盘)</text>
      <text x="15" y="80" font-family="monospace" font-size="10" fill="#6EE7B7">2. GPU 打满 98% 极速训练 → 定时生成 Checkpoint 压缩包归档回 Drive</text>
    </g>
  </g>

  <!-- Watermark / Footer -->
  <text x="1120" y="645" text-anchor="end" font-family="monospace" font-size="12" fill="#475569">
    git-novel · Tuli · 2026-11
  </text>
</svg>