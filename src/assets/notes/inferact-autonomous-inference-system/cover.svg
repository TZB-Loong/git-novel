  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="44" y="44" width="1112" height="542" rx="22" fill="none" stroke="#1f2b45" stroke-width="2" stroke-dasharray="10,7"/>

  <rect x="84" y="82" width="330" height="38" rx="8" fill="#0d1628" stroke="#2c3d5e"/>
  <circle cx="106" cy="101" r="6" fill="#22d3ee"/>
  <text x="122" y="107" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#93a8c4" letter-spacing="2">INFERENCE INFRASTRUCTURE</text>

  <text x="84" y="196" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="800" fill="url(#titleGrad)">AUTONOMOUS</text>
  <text x="84" y="248" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="800" fill="url(#titleGrad)">INFERENCE</text>
