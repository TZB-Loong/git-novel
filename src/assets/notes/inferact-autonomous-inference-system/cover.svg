    <text x="444" y="28" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#6b8299" letter-spacing="1">vLLM STARS</text>
    <text x="444" y="58" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="800" fill="#c4b5fd">97,452</text>
