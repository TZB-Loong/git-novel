  <text x="84" y="556" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5a6b82">Source: Simon Mo · Inferact · 2026-11-18　|　仓库数据经 GitHub API 核验</text>
