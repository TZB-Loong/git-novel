    <text x="20" y="28" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#6b8299" letter-spacing="1">TTFT (p50)</text>
    <text x="20" y="58" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="800" fill="#67e8f9">1.5s → 0.8s</text>

    <rect x="212" y="0" width="196" height="82" rx="12" fill="#0a1324" stroke="#1e3a4d" stroke-width="1.5"/>
