<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0b1727"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="50" y="50" width="1100" height="530" rx="20" fill="none" stroke="#2e384d" stroke-width="2" stroke-dasharray="10,6"/>

  <!-- Badge -->
  <rect x="90" y="90" width="250" height="38" rx="8" fill="#1e2433" stroke="#475569" stroke-width="1"/>
  <circle cx="112" cy="109" r="6" fill="#34d399"/>
  <text x="128" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1">HYBRID INFERENCE COST</text>

  <!-- Main Title -->
  <text x="90" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#f8fafc">端云协同与真实混合账本</text>
  <text x="90" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="url(#edge)">用本地 7B 小模型做“脏活过滤”的工程实战</text>

  <text x="90" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">
    告别 API 账单焦虑：本地 M4 跑静态扫描与脱敏 + 云端 SOTA 负责逻辑仲裁的高性价比解法
  </text>

  <!-- Visual Blueprint -->
  <g transform="translate(90, 365)">
    <!-- Local Edge Node -->
    <rect x="0" y="0" width="460" height="135" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="24" y="36" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">01. LOCAL EDGE: M4 / QWEN-7B (零成本)</text>
    <text x="24" y="68" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">脏活过滤 · 语法补全 · 敏感脱敏 · 格式化</text>
    <text x="24" y="95" font-family="-apple-system, sans-serif" font-size="13" fill="#a7f3d0">拦截 80% 高频平庸请求 · 0 API Token 成本 · 零数据泄露</text>
    <text x="24" y="115" font-family="monospace" font-size="12" fill="#6ee7b7">Latency: ~15ms (本地统一内存瞬发)</text>

    <!-- Connector -->
    <g transform="translate(480, 50)">
      <text x="10" y="25" font-family="sans-serif" font-size="24" fill="#64748b">→</text>
      <text x="0" y="45" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">仅升级难点</text>
    </g>

    <!-- Cloud SOTA -->
    <rect x="540" y="0" width="430" height="135" rx="12" fill="#1e1b4b" stroke="url(#cloud)" stroke-width="2"/>
    <text x="564" y="36" font-family="monospace" font-size="13" font-weight="700" fill="#c084fc">02. CLOUD SOTA: CLAUDE 3.5 / O1</text>
    <text x="564" y="68" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#f5f3ff">高阶跨文件架构仲裁 · 核心算法设计</text>
    <text x="564" y="95" font-family="-apple-system, sans-serif" font-size="13" fill="#ddd6fe">仅处理精炼后的干净输入 · Token 成本降 70%</text>
    <text x="564" y="115" font-family="monospace" font-size="12" fill="#a78bfa">ROI: 刀刃上的钱花在最关键决策上</text>
  </g>
</svg>
