<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#091322"/>
      <stop offset="100%" stop-color="#02050e"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 38px; fill: url(#title-grad); }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(70, 50)">
    <rect width="150" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="14" y="17" class="badge-text" fill="#a5b4fc">Aider 极简工程学</text>

    <rect x="160" width="160" height="26" rx="13" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
    <text x="174" y="17" class="badge-text" fill="#5eead4">Architect/Editor 双模型</text>

    <rect x="330" width="145" height="26" rx="13" fill="#311010" stroke="#ef4444" stroke-width="1"/>
    <text x="344" y="17" class="badge-text" fill="#fca5a5">去魅 Agent 委员会</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="70" y="125" class="title">极简脚手架何以吊打 Agent 委员会？</text>
  <text x="70" y="160" class="subtitle">从 Aider 架构看代码智能体的 Repo-Map、Git 差异块与去魅工程哲学</text>

  <!-- Visual Representation Area: Left (Multi-Agent Committee Chaos) vs Right (Aider Elegance) -->
  <g transform="translate(70, 200)" filter="url(#shadow)">
    <rect width="1060" height="340" rx="16" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>

    <!-- Left Box: Multi-Agent Committee Overhead -->
    <g transform="translate(25, 25)">
      <rect width="490" height="290" rx="12" fill="#070c1e" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6,4"/>
      
      <circle cx="25" cy="25" r="7" fill="#ef4444"/>
      <text x="42" y="30" class="card-title" fill="#fca5a5">复杂路线：多 Agent 评审委员会 (Multi-Agent Committee)</text>
      <text x="42" y="48" class="card-sub">Planner + Coder + Reviewer + Debugger | 审查员回退陷阱 | Token 暴涨</text>

      <!-- Tangled Council Graphic -->
      <g transform="translate(245, 155)">
        <!-- Council cycle -->
        <circle cx="-100" cy="-40" r="24" fill="#1e1015" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="-100" y="-36" text-anchor="middle" font-family="ui-monospace" font-size="10" font-weight="700" fill="#fca5a5">Planner</text>

        <circle cx="0" cy="-60" r="24" fill="#1e1015" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="0" y="-56" text-anchor="middle" font-family="ui-monospace" font-size="10" font-weight="700" fill="#fca5a5">Coder</text>

        <circle cx="100" cy="-40" r="24" fill="#1e1015" stroke="#ef4444" stroke-width="2"/>
        <text x="100" y="-36" text-anchor="middle" font-family="ui-monospace" font-size="10" font-weight="700" fill="#fecaca">Reviewer</text>

        <circle cx="0" cy="50" r="24" fill="#1e1015" stroke="#f97316" stroke-width="1.5"/>
        <text x="0" y="54" text-anchor="middle" font-family="ui-monospace" font-size="10" font-weight="700" fill="#fdba74">Debugger</text>

        <!-- Confusing loop lines -->
        <path d="M -76,-40 L -24,-60" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
        <path d="M 24,-60 L 76,-40" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
        <path d="M 85,-20 L 20,40" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
        <path d="M -20,40 L -85,-20" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3"/>

        <!-- Failure badge -->
        <rect x="-85" y="-12" width="170" height="24" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" font-family="ui-monospace" font-size="10" font-weight="700" fill="#fecaca">⚠️ 审查员抹杀正确修复</text>
      </g>

      <!-- Bottom Tag -->
      <rect x="15" y="248" width="460" height="28" rx="6" fill="#180c10"/>
      <text x="245" y="266" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="#fca5a5">实测代价：50,000 Token / 修复率反跌 18% / 陷入回退死循环</text>
    </g>

    <!-- Right Box: Aider Minimalist Architecture -->
    <g transform="translate(545, 25)">
      <rect width="490" height="290" rx="12" fill="#070c1e" stroke="#10b981" stroke-width="1.2"/>
      
      <circle cx="25" cy="25" r="7" fill="#10b981"/>
      <text x="42" y="30" class="card-title" fill="#a7f3d0">Aider 路线：双模型脚手架 + AST 代码地图 + Git Diff</text>
      <text x="42" y="48" class="card-sub">Architect 负责高密度推理 | Editor 负责精确落盘 | 编译器真实反馈</text>

      <!-- Clean Pipeline Graphic -->
      <g transform="translate(45, 80)">
        <!-- Step 1: Repo Map -->
        <rect x="0" y="20" width="115" height="60" rx="6" fill="#062118" stroke="#10b981" stroke-width="1"/>
        <text x="57" y="42" text-anchor="middle" font-family="ui-monospace" font-size="11" font-weight="700" fill="#6ee7b7">Repo-Map</text>
        <text x="57" y="62" text-anchor="middle" font-family="ui-monospace" font-size="9" fill="#34d399">Tree-sitter/Rank</text>

        <!-- Arrow -->
        <line x1="120" y1="50" x2="145" y2="50" stroke="#10b981" stroke-width="2"/>
        <polygon points="145,50 137,46 137,54" fill="#10b981"/>

        <!-- Step 2: Architect Model -->
        <rect x="150" y="10" width="125" height="80" rx="8" fill="#0c3227" stroke="#34d399" stroke-width="1.5"/>
        <text x="212" y="35" text-anchor="middle" font-family="ui-monospace" font-size="12" font-weight="700" fill="#a7f3d0">Architect</text>
        <text x="212" y="55" text-anchor="middle" font-family="ui-monospace" font-size="9" fill="#6ee7b7">o1 / Sonnet 3.7</text>
        <text x="212" y="73" text-anchor="middle" font-family="ui-monospace" font-size="9" fill="#d1fae5">[纯逻辑分析方案]</text>

        <!-- Arrow -->
        <line x1="280" y1="50" x2="305" y2="50" stroke="#10b981" stroke-width="2"/>
        <polygon points="305,50 297,46 297,54" fill="#10b981"/>

        <!-- Step 3: Editor Model -->
        <rect x="310" y="20" width="95" height="60" rx="6" fill="#062118" stroke="#10b981" stroke-width="1"/>
        <text x="357" y="42" text-anchor="middle" font-family="ui-monospace" font-size="11" font-weight="700" fill="#6ee7b7">Editor</text>
        <text x="357" y="62" text-anchor="middle" font-family="ui-monospace" font-size="9" fill="#34d399">Search/Replace</text>

        <!-- Down Feedback Loop -->
        <path d="M 357,85 L 357,125 L 212,125 L 212,95" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2"/>
        <rect x="235" y="115" width="100" height="20" rx="4" fill="#0f2b48" stroke="#38bdf8" stroke-width="1"/>
        <text x="285" y="129" text-anchor="middle" font-family="ui-monospace" font-size="9" fill="#bae6fd">单测/Linter 闭环</text>
      </g>

      <!-- Bottom Tag -->
      <rect x="15" y="248" width="460" height="28" rx="6" fill="#031e16"/>
      <text x="245" y="266" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="#6ee7b7">生产实证：SWE-bench 榜首表现 / 消耗仅 2,500 Token / 零死锁</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(70, 585)">
    <text x="0" y="0" class="tag">git-novel · 架构深思考系列 · Tuli 原创出品</text>
    <text x="1060" y="0" class="tag" text-anchor="end">Aider Minimalist Engineering Architecture</text>
  </g>
</svg>