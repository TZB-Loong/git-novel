<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="clean" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="50" y="50" width="1100" height="530" rx="20" fill="none" stroke="#2e384d" stroke-width="2" stroke-dasharray="10,6"/>

  <!-- Badge -->
  <rect x="90" y="90" width="220" height="38" rx="8" fill="#1e2433" stroke="#475569" stroke-width="1"/>
  <circle cx="112" cy="109" r="6" fill="#ec4899"/>
  <text x="128" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1">TOKENOPS ARCHITECTURE</text>

  <!-- Main Title -->
  <text x="90" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#f8fafc">长上下文的“智商断崖”</text>
  <text x="90" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="url(#cliff)">Router-Worker 架构如何终结单会话迷失与成本雪崩？</text>

  <text x="90" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">
    破除 1M Token 迷信：外置状态机（State Machine）调度短平快干净 Worker 的工程实战
  </text>

  <!-- Visual Architecture Blueprint -->
  <g transform="translate(90, 365)">
    <!-- Broken Single Session -->
    <rect x="0" y="0" width="310" height="135" rx="12" fill="#18181b" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="24" y="36" font-family="monospace" font-size="13" font-weight="700" fill="#f43f5e">单会话无限累加 (Single Context)</text>
    <text x="24" y="68" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#fda4af">100k+ Token 泥潭</text>
    <text x="24" y="95" font-family="-apple-system, sans-serif" font-size="13" fill="#71717a">注意力稀释 · 迷失中间 · 计费二次方膨胀</text>
    <text x="24" y="115" font-family="monospace" font-size="12" fill="#fb7185">Failure: 循环死锁 / 逻辑漂移</text>

    <!-- Transition Arrow -->
    <text x="350" y="75" font-family="sans-serif" font-size="28" fill="#64748b">→</text>

    <!-- Router-Worker Structure -->
    <rect x="400" y="0" width="560" height="135" rx="12" fill="#0f172a" stroke="url(#clean)" stroke-width="2"/>
    <text x="424" y="36" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">ROUTER-WORKER STATE MACHINE</text>
    <text x="424" y="68" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">极轻 Router 调度器 + 4k 短平快干净上下文 Worker</text>
    <text x="424" y="95" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">外部持久化 Checkpoint · 完成即销毁 · 上下文零污染</text>
    <text x="424" y="115" font-family="monospace" font-size="12" fill="#38bdf8">Result: 成本降 80% · 任务存活率 99%</text>
  </g>
</svg>
