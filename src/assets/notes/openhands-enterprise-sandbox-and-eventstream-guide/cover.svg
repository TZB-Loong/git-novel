    <rect x="365" y="0" width="310" height="325" rx="16" fill="url(#cardBgCoverOH)" stroke="#334155" stroke-width="1.5" />
    <rect x="385" y="20" width="56" height="56" rx="12" fill="#7C3AED" fill-opacity="0.2" stroke="#A855F7" stroke-width="1.5" />
    <text x="413" y="55" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">02</text>
    <text x="455" y="44" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">EventStream 状态总线</text>
    <text x="455" y="66" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">长任务记忆修剪与滑动窗口</text>

    <g transform="translate(385, 100)">
      <rect width="270" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="26" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">📦 全量历史事件回放日志</text>
    </g>
    <g transform="translate(385, 155)">
      <rect width="270" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="26" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">✂️ 上下文记忆压缩 (Compaction)</text>
    </g>
    <g transform="translate(385, 210)">
      <rect width="270" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="26" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">🚨 100k Token 防爆熔断自愈</text>
    </g>
    <g transform="translate(385, 268)">
      <text x="135" y="22" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">动态滑动窗口守护 →</text>
    </g>

    <!-- Column 3: Docker Execution Sandbox -->
    <rect x="730" y="0" width="310" height="325" rx="16" fill="url(#cardBgCoverOH)" stroke="#334155" stroke-width="1.5" />
    <rect x="750" y="20" width="56" height="56" rx="12" fill="#059669" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5" />
    <text x="778" y="55" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">03</text>
    <text x="820" y="44" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">Docker 执行沙盒</text>
    <text x="820" y="66" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">安全隔离与企业级 SWE 闭环</text>

    <g transform="translate(750, 100)">
      <rect width="270" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="26" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">🐳 cgroups 资源限额与隔离容器</text>
    </g>
    <g transform="translate(750, 155)">
      <rect width="270" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="26" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">🔒 只读挂载 + 临时 Workspace</text>
    </g>
    <g transform="translate(750, 210)">
      <rect width="270" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="26" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">✅ Git Pre-commit 与自动 PR 提交</text>
    </g>
    <g transform="translate(750, 268)">
      <text x="135" y="22" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">企业生产环境交付 🎯</text>
    </g>

    <!-- Connecting Arrows -->
    <path d="M 315 162 L 355 162" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="359,162 353,158 353,166" fill="#38BDF8" />

    <path d="M 680 162 L 720 162" stroke="#A855F7" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="724,162 718,158 718,166" fill="#A855F7" />
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(80, 620)">
    <text x="0" y="16" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">git-novel · Engineering Architecture Series</text>
    <text x="1040" y="16" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="end">Production Deep Dive</text>
  </g>
</svg>