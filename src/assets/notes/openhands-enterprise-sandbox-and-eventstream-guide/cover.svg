<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradCoverOH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueCyanGradOH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="purpleVioletGradOH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="emeraldGradOH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardBgCoverOH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.78" />
    </linearGradient>
    <filter id="glowCoverOH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradCoverOH)" />

  <!-- Subtle Tech Grid Lines -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" stroke-dasharray="6,6" />
    <line x1="0" y1="270" x2="1200" y2="270" stroke-dasharray="6,6" />
    <line x1="0" y1="405" x2="1200" y2="405" stroke-dasharray="6,6" />
    <line x1="0" y1="540" x2="1200" y2="540" stroke-dasharray="6,6" />
    <line x1="240" y1="0" x2="240" y2="675" stroke-dasharray="6,6" />
    <line x1="480" y1="0" x2="480" y2="675" stroke-dasharray="6,6" />
    <line x1="720" y1="0" x2="720" y2="675" stroke-dasharray="6,6" />
    <line x1="960" y1="0" x2="960" y2="675" stroke-dasharray="6,6" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="280" cy="180" r="140" fill="#38BDF8" opacity="0.1" filter="url(#glowCoverOH)" />
  <circle cx="920" cy="460" r="160" fill="#8B5CF6" opacity="0.12" filter="url(#glowCoverOH)" />

  <!-- Badge / Tag -->
  <g transform="translate(80, 75)">
    <rect width="320" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" opacity="0.9" />
    <circle cx="20" cy="18" r="6" fill="#10B981" />
    <text x="36" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">AUTONOMOUS SOFTWARE ENGINEER</text>
  </g>

  <!-- Main Titles -->
  <text x="80" y="170" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    让开源 Devin 进企业生产：OpenHands 深度架构
  </text>
  <text x="80" y="222" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Docker 双向沙盒隔离 · EventStream 状态总线 · 上下文记忆修剪 · SWE-bench 落地实战
  </text>

  <!-- 3 Pillars Architecture Visualization Panel -->
  <g transform="translate(80, 270)">
    <!-- Column 1: Controller & LLM Reasoning -->
    <rect x="0" y="0" width="310" height="325" rx="16" fill="url(#cardBgCoverOH)" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="20" width="56" height="56" rx="12" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5" />
    <text x="48" y="55" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">01</text>
    <text x="90" y="44" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">Controller 控制中枢</text>
    <text x="90" y="66" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Agent 状态机与规划推导</text>
    
    <g transform="translate(20, 100)">
      <rect width="270" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="26" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">🤖 LLM 意图解构与指令编排</text>
    </g>
    <g transform="translate(20, 155)">
      <rect width="270" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="26" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">⚡ 异步 Action-Observation 闭环</text>
    </g>
    <g transform="translate(20, 210)">
      <rect width="270" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="26" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">🛡️ 安全守门人与高危拦截</text>
    </g>
    <g transform="translate(20, 268)">
      <text x="135" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">FastAPI 核心调度引擎 →</text>
    </g>

