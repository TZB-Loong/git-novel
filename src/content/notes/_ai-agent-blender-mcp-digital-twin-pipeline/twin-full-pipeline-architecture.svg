  <text x="24" y="30" font-size="19" font-weight="600" fill="#EAF1FB">AI 3D 数字孪生全链路：参考图纸 → Agent + Blender MCP → GLB → three.js</text>
  <text x="24" y="52" font-size="10.5" fill="#8FA3C2">单台 1 次会话 · 7 个分段批次 · 150~180 对象 · GLB 500~700 KB · 整线 12+ 台设备</text>

  <path d="M831 74 C 831 58, 363 58, 363 74" fill="none" stroke="#FBBF24" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arwAmberTw1)" />
