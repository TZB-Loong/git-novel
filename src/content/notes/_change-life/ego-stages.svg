<text x="920.0" y="165" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="12" fill="#ddd" text-anchor="middle" font-weight="normal">所有框架都是有用的虚构·地图非疆域</text>
<rect x="765.0" y="210" width="310" height="82" rx="8" fill="#4d96ff" stroke="#ddd" stroke-width="1"/>
