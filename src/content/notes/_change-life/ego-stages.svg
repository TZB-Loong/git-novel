<text x="920.0" y="265" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="12" fill="#ddd" text-anchor="middle" font-weight="normal">工作·休息·娱乐成一体·无需再成为</text>
