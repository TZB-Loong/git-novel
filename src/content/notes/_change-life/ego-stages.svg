<text x="550.0" y="365" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">自己也是系统的一部分·反思盲区</text>
<line x1="725.0" y1="265" x2="745.0" y2="265" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="750.0" y="55" width="340" height="420" rx="12" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
