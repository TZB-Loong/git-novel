<text x="920.0" y="82" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">🧙 晚期—超越自我</text>
<rect x="765.0" y="110" width="310" height="82" rx="8" fill="#4d96ff" stroke="#ddd" stroke-width="1"/>
