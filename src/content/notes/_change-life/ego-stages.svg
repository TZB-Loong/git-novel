<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="100%" height="100%" fill="#fcfcfc"/>
<text x="550.0" y="32" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Ego 发展八阶段</text>
