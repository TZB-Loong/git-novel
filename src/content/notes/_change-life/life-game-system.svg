<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950">
<rect width="900" height="950" fill="transparent"/>
<text x="450" y="35" font-family="sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">六层人生游戏系统</text>
<text x="450" y="55" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle" font-weight="normal">Each layer is a concentric ring that focuses your mind</text>
<circle cx="450" cy="500" r="75" fill="none" stroke="#4d96ff" stroke-width="3" opacity="0.7"/>
<rect x="555" y="465" width="90" height="28" rx="14" ry="14" fill="#4d96ff" opacity="0.2"/>
<text x="560" y="484" font-family="sans-serif" font-size="11" fill="#4d96ff" text-anchor="start" font-weight="normal">L6</text>
<text x="585" y="484" font-family="sans-serif" font-size="13" fill="#4d96ff" text-anchor="start" font-weight="bold">约束条件</text>
<text x="555" y="515" font-family="sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal">🎮 游戏规则</text>
<text x="555" y="537" font-family="sans-serif" font-size="11" fill="#888" text-anchor="start" font-weight="normal">什么是不肯牺牲的</text>
<circle cx="450" cy="500" r="145" fill="none" stroke="#6bcb77" stroke-width="3" opacity="0.7"/>
<rect x="185" y="370" width="90" height="28" rx="14" ry="14" fill="#6bcb77" opacity="0.2"/>
<text x="190" y="389" font-family="sans-serif" font-size="11" fill="#6bcb77" text-anchor="start" font-weight="normal">L5</text>
<text x="215" y="389" font-family="sans-serif" font-size="13" fill="#6bcb77" text-anchor="start" font-weight="bold">日 常 杠 杆</text>
<text x="135" y="420" font-family="sans-serif" font-size="12" fill="#555" text-anchor="end" font-weight="normal">🎮 每日任务</text>
<text x="135" y="442" font-family="sans-serif" font-size="11" fill="#888" text-anchor="end" font-weight="normal">每天推一把头等大事</text>
<circle cx="450" cy="500" r="220" fill="none" stroke="#2ecc71" stroke-width="3" opacity="0.7"/>
<rect x="700" y="465" width="90" height="28" rx="14" ry="14" fill="#2ecc71" opacity="0.2"/>
<text x="705" y="484" font-family="sans-serif" font-size="11" fill="#2ecc71" text-anchor="start" font-weight="normal">L4</text>
<text x="730" y="484" font-family="sans-serif" font-size="13" fill="#2ecc71" text-anchor="start" font-weight="bold">一 月 项 目</text>
<text x="700" y="515" font-family="sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal">🎮 打 Boss</text>
<text x="700" y="537" font-family="sans-serif" font-size="11" fill="#888" text-anchor="start" font-weight="normal">学什么·会什么·做出什么</text>
<circle cx="450" cy="500" r="300" fill="none" stroke="#f39c12" stroke-width="3" opacity="0.7"/>
<rect x="30" y="340" width="90" height="28" rx="14" ry="14" fill="#f39c12" opacity="0.2"/>
<text x="35" y="359" font-family="sans-serif" font-size="11" fill="#f39c12" text-anchor="start" font-weight="normal">L3</text>
<text x="60" y="359" font-family="sans-serif" font-size="13" fill="#f39c12" text-anchor="start" font-weight="bold">一 年 目 标</text>
<text x="-20" y="390" font-family="sans-serif" font-size="12" fill="#555" text-anchor="end" font-weight="normal">🎮 主线任务</text>
<text x="-20" y="412" font-family="sans-serif" font-size="11" fill="#888" text-anchor="end" font-weight="normal">一年后该是什么样</text>
<circle cx="450" cy="500" r="385" fill="none" stroke="#e67e22" stroke-width="3" opacity="0.7"/>
<rect x="865" y="465" width="90" height="28" rx="14" ry="14" fill="#e67e22" opacity="0.2"/>
<text x="870" y="484" font-family="sans-serif" font-size="11" fill="#e67e22" text-anchor="start" font-weight="normal">L2</text>
<text x="895" y="484" font-family="sans-serif" font-size="13" fill="#e67e22" text-anchor="start" font-weight="bold">愿    景</text>
<text x="865" y="515" font-family="sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal">🎮 通关方式</text>
<text x="865" y="537" font-family="sans-serif" font-size="11" fill="#888" text-anchor="start" font-weight="normal">真心想要的生活</text>
<circle cx="450" cy="500" r="470" fill="none" stroke="#ff6b6b" stroke-width="3" opacity="0.7"/>
<rect x="-140" y="310" width="90" height="28" rx="14" ry="14" fill="#ff6b6b" opacity="0.2"/>
<text x="-135" y="329" font-family="sans-serif" font-size="11" fill="#ff6b6b" text-anchor="start" font-weight="normal">L1</text>
<text x="-110" y="329" font-family="sans-serif" font-size="13" fill="#ff6b6b" text-anchor="start" font-weight="bold">反 愿 景</text>
<text x="-190" y="360" font-family="sans-serif" font-size="12" fill="#555" text-anchor="end" font-weight="normal">🎮 输掉的代价</text>
<text x="-190" y="382" font-family="sans-serif" font-size="11" fill="#888" text-anchor="end" font-weight="normal">我活腻了的日子·再也不想回去</text>
<text x="450" y="505" font-family="sans-serif" font-size="28" fill="#333" text-anchor="middle" font-weight="normal">🎯</text>
<text x="450" y="532" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle" font-weight="normal">你</text>
<line x1="450" y1="508" x2="483.0" y2="522.0" stroke="#4d96ff" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
<line x1="450" y1="508" x2="525.0" y2="550.0" stroke="#6bcb77" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
<line x1="450" y1="508" x2="570.0" y2="580.0" stroke="#2ecc71" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
<line x1="450" y1="508" x2="618.0" y2="612.0" stroke="#f39c12" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
<line x1="450" y1="508" x2="669.0" y2="646.0" stroke="#e67e22" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
<line x1="450" y1="508" x2="720.0" y2="680.0" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
<text x="450" y="910" font-family="sans-serif" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">六层同心圆罩着脑子，把乱七八糟的诱惑挡在外头。</text>
<text x="450" y="930" font-family="sans-serif" font-size="13" fill="#555" text-anchor="middle" font-weight="bold">越玩这场游戏，这个圈越牢，到最后就成了你本人。</text>
</svg>