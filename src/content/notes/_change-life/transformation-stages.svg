<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320"><rect width="100%" height="100%" fill="#fcfcfc"/>
<text x="400.0" y="32" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">蜕变三阶段</text>
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#999"/></marker></defs>
<rect x="40.0" y="65" width="210" height="150" rx="16" fill="#ff6b6b" stroke="#ccc" stroke-width="1"/>
<text x="145.0" y="105" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">💥 撕裂期</text>
<text x="145.0" y="140" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal">感觉格格不入</text>
<text x="145.0" y="168" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal">受够了止步不前</text>
<line x1="258.0" y1="140" x2="287.0" y2="140" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="295.0" y="65" width="210" height="150" rx="16" fill="#ffd93d" stroke="#ccc" stroke-width="1"/>
<text x="400.0" y="105" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">🌫 迷茫期</text>
<text x="400.0" y="140" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="14" fill="#333" text-anchor="middle" font-weight="normal">不知道下一步在哪</text>
<text x="400.0" y="168" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="14" fill="#333" text-anchor="middle" font-weight="normal">摸索试错</text>
<line x1="513.0" y1="140" x2="542.0" y2="140" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="550.0" y="65" width="210" height="150" rx="16" fill="#6bcb77" stroke="#ccc" stroke-width="1"/>
<text x="655.0" y="105" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="18" fill="#000" text-anchor="middle" font-weight="bold">💡 顿悟期</text>
<text x="655.0" y="140" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="14" fill="#000" text-anchor="middle" font-weight="normal">找到想奔赴的方向</text>
<text x="655.0" y="168" font-family="sans-serif, PingFang SC, Microsoft YaHei, Noto Sans SC" font-size="14" fill="#000" text-anchor="middle" font-weight="normal">六个月走完六年的路</text>
</svg>