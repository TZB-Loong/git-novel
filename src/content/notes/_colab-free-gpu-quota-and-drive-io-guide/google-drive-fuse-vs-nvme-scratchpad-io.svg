<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1214" />
      <stop offset="100%" stop-color="#1A0B0D" />
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062E20" />
      <stop offset="100%" stop-color="#041F16" />
    </linearGradient>
    <marker id="arrow-red-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-green-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-blue-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="12" fill="url(#bgGrad2)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(35, 25)">
    <rect width="180" height="24" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#38BDF8">I/O ARCHITECTURE</text>
    <text x="195" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Google Drive FUSE 挂载 vs 本地 NVMe 暂存区架构对比</text>
  </g>

  <!-- Section 1: Direct FUSE Mount (Anti-Pattern) -->
  <g transform="translate(35, 65)">
    <rect width="890" height="175" rx="10" fill="url(#badGrad)" stroke="#7F1D1D" stroke-width="1.5" />
    <!-- Tag -->
    <rect x="20" y="15" width="220" height="22" rx="4" fill="#991B1B" />
    <text x="28" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FEE2E2">反模式：直接在 Drive 路径读取碎小文件</text>

    <!-- Path architecture nodes -->
    <!-- Node A: PyTorch -->
    <rect x="20" y="55" width="140" height="50" rx="6" fill="#18181B" stroke="#52525B" stroke-width="1" />
    <text x="32" y="76" font-family="monospace" font-size="11" font-weight="700" fill="#F43F5E">PyTorch DataLoader</text>
    <text x="32" y="93" font-family="-apple-system, sans-serif" font-size="10" fill="#A1A1AA">50,000 张碎图片</text>

    <!-- Arrow A -> B -->
    <path d="M160,80 H195" stroke="#EF4444" stroke-width="1.8" marker-end="url(#arrow-red-2)" />

    <!-- Node B: VFS & FUSE Daemon -->
    <rect x="205" y="55" width="165" height="50" rx="6" fill="#18181B" stroke="#EF4444" stroke-width="1.2" />
    <text x="217" y="75" font-family="monospace" font-size="11" font-weight="700" fill="#FCA5A5">FUSE 用户态文件系统</text>
    <text x="217" y="92" font-family="-apple-system, sans-serif" font-size="10" fill="#F87171">频繁上下文切换 (Syscall)</text>

    <!-- Arrow B -> C -->
    <path d="M370,80 H405" stroke="#EF4444" stroke-width="1.8" marker-end="url(#arrow-red-2)" />

    <!-- Node C: Network RPC -->
    <rect x="415" y="55" width="180" height="50" rx="6" fill="#18181B" stroke="#EF4444" stroke-width="1.2" />
    <text x="427" y="75" font-family="monospace" font-size="11" font-weight="700" fill="#FCA5A5">Google Drive HTTPS/API</text>
    <text x="427" y="92" font-family="-apple-system, sans-serif" font-size="10" fill="#F87171">逐文件 HTTP RPC / 50ms+ 延迟</text>

    <!-- Arrow C -> D -->
    <path d="M595,80 H630" stroke="#EF4444" stroke-width="1.8" marker-end="url(#arrow-red-2)" />

    <!-- Node D: Cloud Storage -->
    <rect x="640" y="55" width="110" height="50" rx="6" fill="#18181B" stroke="#52525B" stroke-width="1" />
    <text x="652" y="76" font-family="monospace" font-size="11" font-weight="700" fill="#CBD5E1">云端存储端</text>
    <text x="652" y="93" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">远程 Object</text>

    <!-- Impact box on the right -->
    <rect x="765" y="45" width="110" height="115" rx="6" fill="#450A0A" stroke="#DC2626" stroke-width="1" />
    <text x="778" y="70" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">I/O 饥饿死穴</text>
    <text x="778" y="92" font-family="monospace" font-size="11" fill="#FEE2E2">吞吐: 3.5 MB/s</text>
    <text x="778" y="112" font-family="monospace" font-size="11" fill="#FEE2E2">延迟: 120 ms</text>
    <text x="778" y="138" font-family="monospace" font-size="12" font-weight="800" fill="#EF4444">GPU仅 5%</text>

    <text x="20" y="132" font-family="-apple-system, sans-serif" font-size="11" fill="#FCA5A5">
      致命后果：GPU 大量周期白白耗费在 CUDA Stream 阻塞等待 I/O，极易被 Colab 判定为“低效空转占卡”提前踢出。
    </text>
    <text x="20" y="152" font-family="monospace" font-size="10" fill="#9CA3AF">
      Code: Dataset(root="/content/drive/MyDrive/images/")  # 绝对禁用的写法！
    </text>
  </g>

  <!-- Section 2: Two-stage Pipeline (Optimized) -->
  <g transform="translate(35, 255)">
    <rect width="890" height="195" rx="10" fill="url(#goodGrad)" stroke="#065F46" stroke-width="1.5" />
    <!-- Tag -->
    <rect x="20" y="15" width="250" height="22" rx="4" fill="#047857" />
    <text x="28" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#D1FAE5">工业级方案：两阶段本地 NVMe 虚拟盘加速</text>

    <!-- Stage 1: Single file transfer -->
    <g transform="translate(20, 50)">
      <rect width="390" height="70" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <text x="15" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0">阶段 1：大包流式同步与极速解包</text>
      <text x="15" y="44" font-family="monospace" font-size="10" fill="#D1FAE5">Drive: dataset.tar.gz (单文件 5GB) → 单次流水线拉取</text>
      <text x="15" y="60" font-family="monospace" font-size="10" fill="#6EE7B7">tar -I pigz -xf dataset.tar.gz -C /content/data/ (多核解压)</text>
    </g>

    <!-- Transition Arrow -->
    <path d="M415,85 H445" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue-2)" />

    <!-- Stage 2: Local NVMe High-speed execution -->
    <g transform="translate(455, 50)">
      <rect width="295" height="70" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
      <text x="15" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#7DD3FC">阶段 2：本地高速 NVMe 训练闭环</text>
      <text x="15" y="44" font-family="monospace" font-size="10" fill="#BAE6FD">DataLoader 零网络开销直读 /content/data/</text>
      <text x="15" y="60" font-family="monospace" font-size="10" fill="#38BDF8">异步打包 Checkpoint 批量写回 Google Drive</text>
    </g>

    <!-- Metrics on the right -->
    <rect x="765" y="40" width="110" height="135" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1" />
    <text x="778" y="65" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7">极致吞吐实测</text>
    <text x="778" y="87" font-family="monospace" font-size="11" fill="#A7F3D0">吞吐: 650 MB/s</text>
    <text x="778" y="107" font-family="monospace" font-size="11" fill="#A7F3D0">延迟: 0.12 ms</text>
    <text x="778" y="132" font-family="monospace" font-size="12" font-weight="800" fill="#10B981">GPU打满 98%</text>
    <text x="778" y="157" font-family="monospace" font-size="10" fill="#D1FAE5">加速: 180x ↑</text>

    <text x="20" y="145" font-family="-apple-system, sans-serif" font-size="11" fill="#A7F3D0">
      收益：单 Epoch 训练时间从原本的 47 分钟压缩至 2 分 15 秒；充分压榨 T4 免费额度，毫秒级流式吞吐。
    </text>
    <text x="20" y="168" font-family="monospace" font-size="10" fill="#34D399">
      Code: cp /content/drive/MyDrive/dataset.tar.gz /content/ &amp;&amp; pigz -dc dataset.tar.gz | tar -xf -
    </text>
  </g>

  <!-- Bottom Metric Bar Summary -->
  <g transform="translate(35, 465)">
    <rect width="890" height="55" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">工业基准实测（50,000 张小样本读写耗时对比）：</text>
    <text x="20" y="43" font-family="monospace" font-size="11" fill="#F87171">· FUSE 挂载直读：总耗时 3 小时 52 分（严重拖垮整个 12h 实例）</text>
    <text x="470" y="43" font-family="monospace" font-size="11" fill="#34D399">· 本地打包解压两阶流水线：复制解压 1.8 分钟 + 训练 11 分钟 = 12.8 分钟</text>
  </g>
</svg>