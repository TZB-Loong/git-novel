<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="panelBad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261014" />
      <stop offset="100%" stop-color="#15080A" />
    </linearGradient>
    <linearGradient id="panelGood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F231D" />
      <stop offset="100%" stop-color="#081512" />
    </linearGradient>
    <marker id="arrow-blue-3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-green-3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber-3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="530" rx="12" fill="url(#bgGrad3)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(35, 25)">
    <rect width="180" height="24" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#38BDF8">RESILIENT PIPELINE</text>
    <text x="195" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">拒绝 JS 模拟点击：Colab 合规容灾 Checkpoint 架构</text>
  </g>

  <!-- Column 1: Why JS Click Fails (Left Panel) -->
  <g transform="translate(35, 65)">
    <rect width="360" height="375" rx="10" fill="url(#panelBad)" stroke="#991B1B" stroke-width="1.5" />
    <!-- Tag -->
    <rect x="20" y="18" width="180" height="22" rx="4" fill="#7F1D1D" />
    <text x="28" y="33" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FECACA">虚假安全：前端 JS 模拟点击</text>

    <!-- Code Block representation -->
    <rect x="20" y="55" width="320" height="70" rx="6" fill="#180C0E" stroke="#52181F" stroke-width="1" />
    <text x="30" y="75" font-family="monospace" font-size="10" fill="#F87171">// 开发者控制台注入的代码</text>
    <text x="30" y="93" font-family="monospace" font-size="10" fill="#FCA5A5">setInterval(() =&gt; {</text>
    <text x="40" y="110" font-family="monospace" font-size="10" fill="#FCA5A5">  document.querySelector('#connect').click();</text>
    <text x="30" y="118" font-family="monospace" font-size="10" fill="#FCA5A5">}, 60000);</text>

    <!-- Detection layers -->
    <g transform="translate(20, 145)">
      <rect width="320" height="150" rx="6" fill="#2E1116" stroke="#991B1B" stroke-width="1" />
      <text x="15" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">Google 风控多维特征检测：</text>
      
      <circle cx="22" cy="46" r="3.5" fill="#EF4444" />
      <text x="35" y="50" font-family="-apple-system, sans-serif" font-size="10" fill="#FEE2E2">isTrusted 属性检测（代码触发为 false）</text>

      <circle cx="22" cy="74" r="3.5" fill="#EF4444" />
      <text x="35" y="78" font-family="-apple-system, sans-serif" font-size="10" fill="#FEE2E2">Page Visibility API（标签页长期处于 hidden）</text>

      <circle cx="22" cy="102" r="3.5" fill="#EF4444" />
      <text x="35" y="106" font-family="-apple-system, sans-serif" font-size="10" fill="#FEE2E2">零指针轨迹（缺少真实的 mousemove 运动向量）</text>

      <circle cx="22" cy="130" r="3.5" fill="#EF4444" />
      <text x="35" y="134" font-family="-apple-system, sans-serif" font-size="10" fill="#FEE2E2">绝对周期性频率（固定 60s 间隔暴露机器特征）</text>
    </g>

    <text x="20" y="325" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F87171">处罚下场：</text>
    <text x="20" y="345" font-family="-apple-system, sans-serif" font-size="10" fill="#FCA5A5">直接触发 Anti-Abuse 策略，GPU 资源遭黑盒熔断并永久标记。</text>
  </g>

  <!-- Column 2: True Resilient Engineering (Right Panel) -->
  <g transform="translate(420, 65)">
    <rect width="505" height="375" rx="10" fill="url(#panelGood)" stroke="#065F46" stroke-width="1.5" />
    <!-- Tag -->
    <rect x="20" y="18" width="220" height="22" rx="4" fill="#047857" />
    <text x="28" y="33" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#D1FAE5">工程解耦：断点热恢复与容灾流水线</text>

    <!-- Step 1: Atomic Snapshot -->
    <g transform="translate(20, 55)">
      <rect width="465" height="52" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#A7F3D0">Step 1. 原子态双缓冲落盘 (Local NVMe)</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#D1FAE5">torch.save(..., "ckpt_tmp.pt") &amp;&amp; os.replace("ckpt_tmp.pt", "latest.pt")</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M250,107 V123" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrow-green-3)" />

    <!-- Step 2: Background Sync -->
    <g transform="translate(20, 125)">
      <rect width="465" height="52" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#A7F3D0">Step 2. 异步独立线程推流回 Drive (Zero GPU Block)</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#D1FAE5">shutil.copyfile("latest.pt", "/content/drive/MyDrive/models/latest.pt")</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M250,177 V193" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrow-amber-3)" />

    <!-- Step 3: Eviction / Crash -->
    <g transform="translate(20, 195)">
      <rect width="465" height="50" rx="6" fill="#3B1A14" stroke="#D97706" stroke-width="1" />
      <text x="15" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#FDE68A">Step 3. 突发事件：90min 空闲断联 / 12h 容器重置销毁</text>
      <text x="15" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#FEF3C7">由于所有状态已持久化在 Drive，云端容器随意被销毁，进度毫发无损</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M250,245 V261" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrow-blue-3)" />

    <!-- Step 4: Hot Resume -->
    <g transform="translate(20, 265)">
      <rect width="465" height="52" rx="6" fill="#0C2A40" stroke="#0284C7" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#7DD3FC">Step 4. 新实例秒级热恢复 (Cold Start &lt; 30s)</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#BAE6FD">加载 latest.pt 恢复模型权重、优化器、学习率调度器与数据游标索引</text>
    </g>

    <text x="20" y="348" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34D399">核心设计哲学：</text>
    <text x="20" y="365" font-family="-apple-system, sans-serif" font-size="10" fill="#A7F3D0">把 Colab 视为“不可靠的廉价抢占式执行节点”，依托 Google Drive 建立状态外置持久化。</text>
  </g>

  <!-- Bottom Guidance -->
  <g transform="translate(35, 455)">
    <rect width="890" height="55" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">最佳工程实践口诀：</text>
    <text x="20" y="43" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">
      “永远不要试图在浏览器前端假装有人操作，而是要在后端用 Checkpoint 随时做好被掐断的准备。”
    </text>
  </g>
</svg>