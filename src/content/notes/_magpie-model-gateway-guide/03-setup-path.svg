<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="url(#bg3)"/>
  <text x="36" y="44" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#e2e8f0">从安装到路由组：五步，顺序不能乱</text>
  <text x="36" y="70" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8fa3bd">前两步验证通路，第三步做取舍，第四步才开自动切换</text>

  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- step 1 -->
    <rect x="36" y="96" width="168" height="176" rx="12" fill="#0d1728" stroke="#38bdf8" stroke-width="1.6"/>
    <circle cx="66" cy="126" r="15" fill="#38bdf8"/>
    <text x="66" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#061520">1</text>
    <text x="92" y="132" font-size="12.5" font-weight="800" fill="#e2e8f0">接一个 provider</text>
    <text x="56" y="160" font-size="9.5" fill="#8fa3bd">先验证协议翻译</text>
    <text x="56" y="178" font-size="9.5" fill="#8fa3bd">能不能跑通</text>
    <text x="56" y="206" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#67e8f9">magpie provider add</text>
    <text x="56" y="220" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#67e8f9">  deepseek sk-…</text>
    <text x="56" y="246" font-size="9.5" fill="#6b8299">跑一次真实任务确认</text>

    <!-- step 2 -->
    <rect x="222" y="96" width="168" height="176" rx="12" fill="#0d1728" stroke="#4f8bd8" stroke-width="1.6"/>
    <circle cx="252" cy="126" r="15" fill="#4f8bd8"/>
    <text x="252" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#061520">2</text>
    <text x="278" y="132" font-size="12.5" font-weight="800" fill="#e2e8f0">确认订阅发现</text>
    <text x="242" y="160" font-size="9.5" fill="#8fa3bd">读不到登录态</text>
    <text x="242" y="178" font-size="9.5" fill="#8fa3bd">后面都白搭</text>
    <text x="242" y="206" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#67e8f9">magpie accounts</text>
    <text x="242" y="220" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#67e8f9">  discovery</text>
    <text x="242" y="246" font-size="9.5" fill="#6b8299">检查 Privacy 开关</text>

    <!-- step 3 -->
    <rect x="408" y="96" width="168" height="176" rx="12" fill="#1a1408" stroke="#7a5a2f" stroke-width="1.6"/>
    <circle cx="438" cy="126" r="15" fill="#fbbf24"/>
    <text x="438" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#2a1a0a">3</text>
    <text x="464" y="132" font-size="12.5" font-weight="800" fill="#fbbf24">决定脱敏</text>
    <text x="428" y="160" font-size="9.5" fill="#c9b08a">默认是关的</text>
    <text x="428" y="178" font-size="9.5" fill="#c9b08a">这是取舍不是开关</text>
    <text x="428" y="204" font-size="9" fill="#8fa3bd">会贴日志/连接串</text>
    <text x="428" y="220" font-size="9" fill="#8fa3bd">→ 建议开</text>
    <text x="428" y="238" font-size="9" fill="#8fa3bd">要排查密钥问题</text>
    <text x="428" y="254" font-size="9" fill="#8fa3bd">→ 放进 Never mask</text>

    <!-- step 4 -->
    <rect x="594" y="96" width="168" height="176" rx="12" fill="#0d1728" stroke="#38bdf8" stroke-width="1.6"/>
    <circle cx="624" cy="126" r="15" fill="#38bdf8"/>
    <text x="624" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#061520">4</text>
    <text x="650" y="132" font-size="12.5" font-weight="800" fill="#e2e8f0">建路由组</text>
    <text x="614" y="160" font-size="9.5" fill="#8fa3bd">只有两个以上</text>
    <text x="614" y="178" font-size="9.5" fill="#8fa3bd">可切换对象才有意义</text>
    <text x="614" y="206" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#67e8f9">magpie group add</text>
    <text x="614" y="220" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#67e8f9">  "主+备" routing=smart</text>
    <text x="614" y="246" font-size="9.5" fill="#6b8299">只有一个账号就别建</text>

    <!-- step 5 -->
    <rect x="780" y="96" width="144" height="176" rx="12" fill="#0d1728" stroke="#a78bfa" stroke-width="1.6"/>
    <circle cx="810" cy="126" r="15" fill="#a78bfa"/>
    <text x="810" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#1a0f2a">5</text>
    <text x="836" y="132" font-size="12.5" font-weight="800" fill="#c4b5fd">固化 profile</text>
    <text x="800" y="160" font-size="9.5" fill="#8fa3bd">不同场景</text>
    <text x="800" y="178" font-size="9.5" fill="#8fa3bd">不同偏好</text>
    <text x="800" y="206" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#c4b5fd">magpie save work</text>
    <text x="800" y="220" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#c4b5fd">magpie use work</text>
    <text x="800" y="246" font-size="9.5" fill="#6b8299">写码 / 写文档分开</text>
  </g>

  <g stroke="#38bdf8" stroke-width="1.8" fill="none">
    <path d="M 206 184 L 218 184" marker-end="url(#ar3)"/>
    <path d="M 392 184 L 404 184" marker-end="url(#ar3)"/>
    <path d="M 578 184 L 590 184" marker-end="url(#ar3)"/>
    <path d="M 764 184 L 776 184" marker-end="url(#ar3)"/>
  </g>

  <rect x="36" y="296" width="888" height="76" rx="12" fill="#0a1220" stroke="#1e3a4d"/>
  <text x="56" y="322" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">为什么顺序不能乱</text>
  <text x="56" y="344" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8fa3bd">第 1、2 步不通就配路由组，你会以为是路由问题，实际是通路问题，排查方向全错。</text>
  <text x="56" y="362" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#fbbf24">第 3 步是取舍不是开关：脱敏会让「关于密钥本身」的排查任务失效。</text>
</svg>
