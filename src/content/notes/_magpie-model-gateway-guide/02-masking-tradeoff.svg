<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="ar2b" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bg2)"/>
  <text x="36" y="44" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#e2e8f0">脱敏的真实机制：占位符替换，以及它的边界</text>
  <text x="36" y="70" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8fa3bd">默认关闭；打开后是字符串替换，不是语义理解</text>

  <!-- flow -->
  <rect x="36" y="96" width="200" height="86" rx="10" fill="#0f1a2c" stroke="#2e4260" stroke-width="1.5"/>
  <text x="56" y="122" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1">你的请求</text>
  <text x="56" y="146" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#8fa3bd">api_key = "sk-live-…"</text>
  <text x="56" y="166" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#8fa3bd">email = "me@corp.com"</text>

  <path d="M 240 139 L 288 139" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#ar2)"/>

  <rect x="292" y="96" width="180" height="86" rx="10" fill="#0b1a2b" stroke="#38bdf8" stroke-width="2"/>
  <text x="382" y="124" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" fill="#7dd3fc">redact 插件</text>
  <text x="382" y="146" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#8fa3bd">内存中替换</text>
  <text x="382" y="164" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#6b8299">值不落盘</text>

  <path d="M 476 139 L 524 139" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#ar2)"/>

  <rect x="528" y="96" width="200" height="86" rx="10" fill="#0a1520" stroke="#1d5c6b" stroke-width="1.5"/>
  <text x="548" y="122" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" fill="#67e8f9">供应商看到</text>
  <text x="548" y="146" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#8fa3bd">api_key = "{{API_KEY_…}}"</text>
  <text x="548" y="166" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#8fa3bd">email = "{{EMAIL_…}}"</text>

  <rect x="756" y="96" width="168" height="86" rx="10" fill="#0a1220" stroke="#3d5068" stroke-width="1.2"/>
  <text x="774" y="120" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8fa3bd">同一值 →</text>
  <text x="774" y="140" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8fa3bd">同一占位符</text>
  <text x="774" y="164" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#6b8299">缓存与签名保持有效</text>

  <!-- return path -->
  <path d="M 628 186 C 628 216, 400 216, 386 190" stroke="#a78bfa" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#ar2b)"/>
  <text x="470" y="212" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#a78bfa">回复里的占位符换回真值（含流式与工具调用参数）</text>

  <!-- guarantees -->
  <text x="36" y="256" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">官方列出的四条保证</text>
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b8c9bf">
    <text x="36" y="280">① 换回全覆盖：流式文本与工具调用参数都换，Agent 执行时拿到真值</text>
    <text x="36" y="302">② 确定性：同一个值每次同一个占位符，prompt cache 与 thinking 签名不失效</text>
    <text x="36" y="324">③ 不落盘：值只在内存；脱敏该跑却跑不了时直接 503，绝不原样发出</text>
    <text x="36" y="346">④ 可核查：Insights › Masking 列出每个被改写的请求</text>
  </g>

  <!-- cost -->
  <rect x="36" y="368" width="888" height="76" rx="12" fill="#1a1408" stroke="#7a5a2f" stroke-width="1.5"/>
  <text x="56" y="394" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" fill="#fbbf24">代价（官方原文）</text>
  <text x="56" y="418" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#c9b08a">模型看到的是占位符而不是密钥，所以关于这个值本身的任务做不了（如「为什么这个 token 被拒了」）。</text>
  <text x="56" y="436" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#c9b08a">这类值要放进 Never mask。规则偶尔也会出错。</text>

  <!-- false claim -->
  <rect x="36" y="458" width="888" height="66" rx="12" fill="#1a0d13" stroke="#8f2f45" stroke-width="1.5"/>
  <text x="56" y="482" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" fill="#fb7185">流传的错误说法</text>
  <text x="56" y="504" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#f0b8c4">「Tree-sitter AST + 香农熵 ≥ 4.5 bits/char」——官方 README 与 4,824 行 reference 中检索这四个词，命中 0 次。</text>
</svg>
