<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#0b101a"/>
    </linearGradient>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="url(#bg2)"/>
  <text x="36" y="44" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#e2e8f0">如果要抄：四步，顺序有讲究</text>
  <text x="36" y="70" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8ea3b8">先建格式，再建默认集，然后才谈成本与自动化</text>

  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="36" y="96" width="204" height="188" rx="12" fill="#0d1728" stroke="#34d399" stroke-width="1.6"/>
    <circle cx="66" cy="126" r="15" fill="#34d399"/>
    <text x="66" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#061520">1</text>
    <text x="92" y="132" font-size="12.5" font-weight="800" fill="#e2e8f0">建仓库和格式</text>
    <text x="56" y="162" font-size="10" fill="#9fb5c4">不要先建平台</text>
    <text x="56" y="186" font-size="10" fill="#6b8299">Git 天然提供：</text>
    <text x="56" y="204" font-size="10" fill="#6b8299">owner · review · 历史</text>
    <text x="56" y="232" font-size="10" fill="#6ee7b7">几乎零成本</text>
    <text x="56" y="262" font-size="9.5" fill="#5f7288">这一步决定后面</text>
    <text x="56" y="276" font-size="9.5" fill="#5f7288">能不能规模化</text>

    <rect x="258" y="96" width="204" height="188" rx="12" fill="#0d1728" stroke="#22d3ee" stroke-width="1.6"/>
    <circle cx="288" cy="126" r="15" fill="#22d3ee"/>
    <text x="288" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#062028">2</text>
    <text x="314" y="132" font-size="12.5" font-weight="800" fill="#e2e8f0">先定默认集</text>
    <text x="278" y="162" font-size="10" fill="#9fb5c4">不要一开始就</text>
    <text x="278" y="178" font-size="10" fill="#9fb5c4">开放所有人写</text>
    <text x="278" y="204" font-size="10" fill="#6b8299">20–30 个</text>
    <text x="278" y="222" font-size="10" fill="#6b8299">「新人第一天</text>
    <text x="278" y="240" font-size="10" fill="#6b8299">就该有」的 skill</text>
    <text x="278" y="266" font-size="9.5" fill="#5f7288">做扎实后再开放</text>

    <rect x="480" y="96" width="204" height="188" rx="12" fill="#0d1728" stroke="#fbbf24" stroke-width="1.6"/>
    <circle cx="510" cy="126" r="15" fill="#fbbf24"/>
    <text x="510" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#2a1a0a">3</text>
    <text x="536" y="132" font-size="12.5" font-weight="800" fill="#e2e8f0">先测量再优化</text>
    <text x="500" y="162" font-size="10" fill="#9fb5c4">四个降本手段都</text>
    <text x="500" y="178" font-size="10" fill="#9fb5c4">建立在能算出</text>
    <text x="500" y="194" font-size="10" fill="#9fb5c4">单次成本之上</text>
    <text x="500" y="222" font-size="10" fill="#6b8299">没有测量就优化</text>
    <text x="500" y="240" font-size="10" fill="#6b8299">等于蒙眼调参</text>
    <text x="500" y="266" font-size="9.5" fill="#c9b08a">注意：不是每个</text>
    <text x="500" y="280" font-size="9.5" fill="#c9b08a">改动都有效</text>

    <rect x="702" y="96" width="222" height="188" rx="12" fill="#0d1728" stroke="#a78bfa" stroke-width="1.6"/>
    <circle cx="732" cy="126" r="15" fill="#a78bfa"/>
    <text x="732" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#1a0f2a">4</text>
    <text x="758" y="132" font-size="12.5" font-weight="800" fill="#e2e8f0">最后做 papercut</text>
    <text x="722" y="162" font-size="10" fill="#9fb5c4">依赖两个前提：</text>
    <text x="722" y="184" font-size="10" fill="#6b8299">· 明确的 owner 分组</text>
    <text x="722" y="202" font-size="10" fill="#6b8299">· 能接住报告的流程</text>
    <text x="722" y="232" font-size="10" fill="#c4b5fd">没有这两样，</text>
    <text x="722" y="250" font-size="10" fill="#c4b5fd">报告只会堆在</text>
    <text x="722" y="268" font-size="10" fill="#c4b5fd">没人看的看板上</text>
  </g>

  <g stroke="#34d399" stroke-width="1.8" fill="none">
    <path d="M 242 190 L 254 190" marker-end="url(#ar2)"/>
    <path d="M 464 190 L 476 190" marker-end="url(#ar2)"/>
    <path d="M 686 190 L 698 190" marker-end="url(#ar2)"/>
  </g>

  <rect x="36" y="308" width="888" height="64" rx="12" fill="#0a1220" stroke="#1e3a4d"/>
  <text x="56" y="334" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9fb5c4">能直接抄的是思路：三层分级、5/80/15 用例配比、消融实验、轨迹评分。</text>
  <text x="56" y="356" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#fbbf24">不能直接抄的是工具链：aifx、Skill Workshop、Minion、AES、Fawkes 都是 Uber 自研。</text>
</svg>
