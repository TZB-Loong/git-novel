<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030713"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </linearGradient>
    <style>
      .h    { font: 800 25px -apple-system,'PingFang SC',sans-serif; fill: #f1f5f9; }
      .sub  { font: 600 13.5px -apple-system,'PingFang SC',sans-serif; fill: #64748b; }
      .box  { font: 700 15px -apple-system,'PingFang SC',sans-serif; fill: #f1f5f9; }
      .lab  { font: 600 12px 'SF Mono',Menlo,monospace; fill: #94a3b8; }
      .tick { font: 600 11px 'SF Mono',Menlo,monospace; fill: #64748b; }
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)"/>

  <text x="60" y="48" class="h">副署只是表象：Cherry Studio 真正的 AI 协作是制度化的</text>
  <text x="60" y="74" class="sub">仓库里的 CLAUDE.md 与 .agents/notes/ 规范（实测抓取，非推测）</text>

  <!-- 层 1：人类定方向 -->
  <g transform="translate(60,110)">
    <rect x="0" y="0" width="300" height="150" rx="12" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="32" class="box" fill="#38bdf8">人类：写 Spec</text>
    <text x="20" y="60" class="lab">substantial feature / architecture</text>
    <text x="20" y="80" class="lab">/ process / simplification</text>
    <text x="20" y="108" class="lab" fill="#e2e8f0">→ 先落 proposed/ 提案</text>
    <text x="20" y="130" class="tick">留：问题、选择、代价、证据</text>
  </g>

  <!-- 层 2：Agent 实现 -->
  <g transform="translate(450,110)">
    <rect x="0" y="0" width="300" height="150" rx="12" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="32" class="box" fill="#fbbf24">Agent：照 Spec 实现</text>
    <text x="20" y="60" class="lab">CLAUDE.md 22KB 开发规约</text>
    <text x="20" y="80" class="lab">Think Before Coding / Simplicity First</text>
    <text x="20" y="108" class="lab" fill="#e2e8f0">每 PR 必填 Agent Note 字段</text>
    <text x="20" y="130" class="tick">机械改动可写 N/A + 理由</text>
  </g>

  <!-- 层 3：人类验收 -->
  <g transform="translate(840,110)">
    <rect x="0" y="0" width="300" height="150" rx="12" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="32" class="box" fill="#34d399">人类：验收定稿</text>
    <text x="20" y="60" class="lab">final layer 覆盖全部 AC</text>
    <text x="20" y="80" class="lab">→ proposed 转 implemented</text>
    <text x="20" y="108" class="lab" fill="#e2e8f0">被否 → rejected 并留理由</text>
    <text x="20" y="130" class="tick">防同一错误被反复提出</text>
  </g>

  <g stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M368 185 L438 185"/>
    <path d="M758 185 L828 185"/>
  </g>

  <!-- 状态机 -->
  <g transform="translate(60,320)">
    <rect x="0" y="0" width="1080" height="230" rx="12" fill="#080f1e" stroke="#1e293b" stroke-width="1.3"/>
    <text x="24" y="34" class="lab" fill="#fbbf24">.agents/notes/{lifecycle}/{class}/ 生命周期（README 原文口径）</text>

    <g transform="translate(24,60)">
      <rect x="0" y="0" width="170" height="52" rx="8" fill="#111c30" stroke="#475569"/>
      <text x="85" y="32" text-anchor="middle" class="box">proposed/</text>

      <rect x="250" y="0" width="170" height="52" rx="8" fill="#111c30" stroke="#475569"/>
      <text x="85" y="32" text-anchor="middle" class="box" fill="#34d399">implemented/</text>

      <rect x="500" y="0" width="170" height="52" rx="8" fill="#111c30" stroke="#475569"/>
      <text x="85" y="32" text-anchor="middle" class="box" fill="#f87171">rejected/</text>

      <rect x="750" y="0" width="250" height="52" rx="8" fill="#111c30" stroke="#475569"/>
      <text x="125" y="24" text-anchor="middle" class="lab">无需 note</text>
      <text x="125" y="42" text-anchor="middle" class="tick">PR 记 N/A — 理由</text>

      <g stroke="#f59e0b" stroke-width="1.8" fill="none" marker-end="url(#ar)">
        <path d="M180 26 L240 26"/>
        <path d="M430 26 L490 26"/>
      </g>
      <path d="M585 26 L640 26" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
      <path d="M875 26 L930 26" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    </g>

    <text x="24" y="146" class="lab" fill="#94a3b8">class 分六类：feature / bug-fix / simplification / architecture / process / testing</text>
    <text x="24" y="170" class="tick">「rejected 不是初始状态」——它只记录已被人类明确否决、且理由能阻止重复犯错的提案</text>
    <text x="24" y="192" class="tick">仓库现状：.agents/notes/ 下 AGENTS.md + implemented/ + proposed/ + 三语 README</text>
  </g>

  <g transform="translate(60,578)">
    <text x="0" y="16" class="lab" fill="#fbbf24">为什么这件事值得写</text>
    <text x="0" y="42" class="lab" fill="#cbd5e1">副署 trailer 是「谁写的」，Agent Note 是「为什么这么写」——后者才是 AI 协作真正难的部分。</text>
    <text x="1080" y="42" text-anchor="end" class="tick">来源：CherryHQ/cherry-studio main 分支实抓 · 2026-11-18</text>
  </g>
</svg>
