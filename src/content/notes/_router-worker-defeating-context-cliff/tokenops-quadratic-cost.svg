<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <style>
      .bg { fill: #030712; rx: 12; }
      .axis { stroke: #334155; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: bold; font-size: 15px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .curve-single { fill: none; stroke: #f43f5e; stroke-width: 3; }
      .curve-router { fill: none; stroke: #10b981; stroke-width: 3; }
    </style>
    <linearGradient id="glow-rose-token" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" class="bg"/>

  <!-- Title & Header -->
  <text x="40" y="42" class="text-title">图 2-1：TokenOps 成本模型对比：单会话 $O(N^2)$ 累积雪崩 vs Router-Worker 线性可控</text>
  <text x="40" y="65" class="text-sub">单任务 20 轮真实工程调试：单会话引发二次方计费雪崩；Router-Worker 将上下文维持在干净区间</text>

  <!-- Coordinate Grid -->
  <g transform="translate(70, 95)">
    <!-- Grid Lines (Y: 0, 2, 4, 6, 8, 10 USD) -->
    <line x1="0" y1="0" x2="520" y2="0" class="grid"/>
    <line x1="0" y1="48" x2="520" y2="48" class="grid"/>
    <line x1="0" y1="96" x2="520" y2="96" class="grid"/>
    <line x1="0" y1="144" x2="520" y2="144" class="grid"/>
    <line x1="0" y1="192" x2="520" y2="192" class="grid"/>
    <line x1="0" y1="240" x2="520" y2="240" class="grid"/>

    <!-- Grid Lines (X: 1, 5, 10, 15, 20 Turns) -->
    <line x1="130" y1="0" x2="130" y2="240" class="grid"/>
    <line x1="260" y1="0" x2="260" y2="240" class="grid"/>
    <line x1="390" y1="0" x2="390" y2="240" class="grid"/>
    <line x1="520" y1="0" x2="520" y2="240" class="grid"/>

    <!-- Axes -->
    <line x1="0" y1="240" x2="540" y2="240" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="240" class="axis"/>

    <!-- Y labels (Cost USD) -->
    <text x="-15" y="5" text-anchor="end" class="text-label">$10.0</text>
    <text x="-15" y="53" text-anchor="end" class="text-label">$8.0</text>
    <text x="-15" y="101" text-anchor="end" class="text-label">$6.0</text>
    <text x="-15" y="149" text-anchor="end" class="text-label">$4.0</text>
    <text x="-15" y="197" text-anchor="end" class="text-label">$2.0</text>
    <text x="-15" y="245" text-anchor="end" class="text-label">$0.0</text>

    <!-- X labels (Turns) -->
    <text x="0" y="260" text-anchor="middle" class="text-label">第 1 轮</text>
    <text x="130" y="260" text-anchor="middle" class="text-label">第 5 轮</text>
    <text x="260" y="260" text-anchor="middle" class="text-label">第 10 轮</text>
    <text x="390" y="260" text-anchor="middle" class="text-label">第 15 轮</text>
    <text x="520" y="260" text-anchor="middle" class="text-label">第 20 轮</text>
    <text x="260" y="285" text-anchor="middle" class="text-label" fill="#94a3b8">单任务工程交互轮数 (Turns)</text>

    <!-- Curve 1: Single Session Quadratic (Rose) -> Reaches $8.45 at Round 20 (y = 240 - 8.45*24 = 37.2) -->
    <path d="M 0,240 Q 300,232 520,37.2" class="curve-single"/>
    <path d="M 0,240 Q 300,232 520,37.2 L 520,240 L 0,240 Z" fill="url(#glow-rose-token)"/>

    <!-- Curve 2: Router-Worker Linear (Emerald) -> Reaches $1.82 at Round 20 (y = 240 - 1.82*24 = 196.3) -->
    <line x1="0" y1="240" x2="520" y2="196.3" class="curve-router"/>

    <!-- Callouts -->
    <circle cx="520" cy="37.2" r="5" fill="#f43f5e"/>
    <text x="500" y="30" text-anchor="end" class="text-mono" fill="#f43f5e" font-weight="bold">单任务耗费 $8.45 (O(N²))</text>

    <circle cx="520" cy="196.3" r="5" fill="#10b981"/>
    <text x="500" y="185" text-anchor="end" class="text-mono" fill="#10b981" font-weight="bold">Router-Worker 仅需 $1.82 (O(N))</text>
  </g>

  <!-- Side Summary Card -->
  <g transform="translate(630, 95)">
    <rect width="230" height="255" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="18" y="30" class="text-title" font-size="13px" fill="#10b981">78% 成本压降来源</text>

    <text x="18" y="60" class="text-sub" font-size="11.5px">
      <tspan x="18" dy="0" fill="#f43f5e">• 单会话恶性循环：</tspan>
      <tspan x="26" dy="18" fill="#cbd5e1">20 轮单任务累计 210 万 Token</tspan>
      <tspan x="26" dy="16" fill="#cbd5e1">输入 $6.30 + 生成 $2.15 = $8.45</tspan>
      <tspan x="26" dy="16" fill="#cbd5e1">超长历史致注意力漂移</tspan>
      
      <tspan x="18" dy="24" fill="#10b981">• Router-Worker 破局：</tspan>
      <tspan x="26" dy="18" fill="#cbd5e1">主调度维持极简 DAG (3k)</tspan>
      <tspan x="26" dy="16" fill="#cbd5e1">派生 Worker 上下文 (4k~8k)</tspan>
      <tspan x="26" dy="16" fill="#cbd5e1">单任务综合开销仅 $1.82</tspan>
      <tspan x="18" dy="22" fill="#38bdf8">净省 78% 成本，彻底消除断崖</tspan>
    </text>
  </g>
</svg>
