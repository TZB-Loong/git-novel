<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#091024"/>
      <stop offset="100%" stop-color="#030610"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .box-desc { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #cbd5e1; }
      .tag { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 700; }
      .table-hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #94a3b8; }
      .table-cell { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; fill: #f8fafc; }
      .highlight { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 700; fill: #38bdf8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Top Title -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" class="title">2× NVIDIA T4 (32GB) vs 单卡 P100 架构与吞吐全景对比</text>
    <text x="0" y="24" class="desc">相同配额成本下的算力飞跃：Turing Tensor Cores、双卡显存池与 PyTorch DDP 吞吐压榨</text>
  </g>

  <!-- Left Side: Hardware & Quota Spec Comparison Table -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="440" height="440" rx="12" fill="#0b152d" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="440" height="4" rx="2" fill="#38bdf8"/>
    
    <g transform="translate(20, 24)">
      <text x="0" y="0" class="box-title" fill="#38bdf8">硬件架构与计费参数对比</text>
      
      <!-- Table Header -->
      <g transform="translate(0, 25)">
        <rect width="400" height="30" rx="4" fill="#0f224a"/>
        <text x="12" y="20" class="table-hdr">评估指标</text>
        <text x="140" y="20" class="table-hdr">1× Tesla P100</text>
        <text x="270" y="20" class="table-hdr">2× Tesla T4 (推荐)</text>
      </g>

      <!-- Row 1: Architecture -->
      <g transform="translate(0, 65)">
        <text x="12" y="16" class="table-cell" fill="#94a3b8">核心架构</text>
        <text x="140" y="16" class="table-cell">Pascal (2016)</text>
        <text x="270" y="16" class="highlight">Turing (2018)</text>
        <line x1="10" y1="28" x2="390" y2="28" stroke="#1e293b" stroke-width="1"/>
      </g>

      <!-- Row 2: VRAM Total -->
      <g transform="translate(0, 105)">
        <text x="12" y="16" class="table-cell" fill="#94a3b8">总可用显存</text>
        <text x="140" y="16" class="table-cell">16 GB HBM2</text>
        <text x="270" y="16" class="highlight">32 GB (16G × 2)</text>
        <line x1="10" y1="28" x2="390" y2="28" stroke="#1e293b" stroke-width="1"/>
      </g>

      <!-- Row 3: Tensor Cores -->
      <g transform="translate(0, 145)">
        <text x="12" y="16" class="table-cell" fill="#94a3b8">Tensor Cores</text>
        <text x="140" y="16" class="table-cell" fill="#f43f5e">无 (仅传统 CUDA)</text>
        <text x="270" y="16" class="highlight">640 Cores (FP16/INT8)</text>
        <line x1="10" y1="28" x2="390" y2="28" stroke="#1e293b" stroke-width="1"/>
      </g>

      <!-- Row 4: FP16 Tensor TFLOPS -->
      <g transform="translate(0, 185)">
        <text x="12" y="16" class="table-cell" fill="#94a3b8">FP16 混合算力</text>
        <text x="140" y="16" class="table-cell">~21.2 TFLOPS</text>
        <text x="270" y="16" class="highlight">~130 TFLOPS (双卡)</text>
        <line x1="10" y1="28" x2="390" y2="28" stroke="#1e293b" stroke-width="1"/>
      </g>

      <!-- Row 5: Weekly Quota Cost -->
      <g transform="translate(0, 225)">
        <text x="12" y="16" class="table-cell" fill="#94a3b8">配额扣减规则</text>
        <text x="140" y="16" class="table-cell">1 小时 / 挂钟时</text>
        <text x="270" y="16" class="highlight">1 小时 / 挂钟时 (同价!)</text>
        <line x1="10" y1="28" x2="390" y2="28" stroke="#1e293b" stroke-width="1"/>
      </g>

      <!-- Row 6: FlashAttention -->
      <g transform="translate(0, 265)">
        <text x="12" y="16" class="table-cell" fill="#94a3b8">算子兼容性</text>
        <text x="140" y="16" class="table-cell" fill="#f43f5e">不支持 FA2</text>
        <text x="270" y="16" class="highlight">支持 FlashAttn / xFormers</text>
        <line x1="10" y1="28" x2="390" y2="28" stroke="#1e293b" stroke-width="1"/>
      </g>

      <!-- Summary Banner -->
      <g transform="translate(0, 310)">
        <rect width="400" height="75" rx="8" fill="#042038" stroke="#0284c7" stroke-width="1"/>
        <text x="14" y="24" class="box-desc" fill="#38bdf8" font-weight="700">【算力精算师结论】</text>
        <text x="14" y="44" class="box-desc" fill="#cbd5e1">在完全相同的每周 30 小时额度下，2× T4 提供了</text>
        <text x="14" y="62" class="box-desc" fill="#f8fafc"><tspan fill="#38bdf8" font-weight="700">2倍显存空间 + 6倍混合精度算力</tspan>，属于无脑优选！</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Real-World Workload Throughput & Memory Scaling -->
  <g transform="translate(510, 95)" filter="url(#shadow)">
    <rect width="450" height="440" rx="12" fill="#0b152d" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="450" height="4" rx="2" fill="#10b981"/>

    <g transform="translate(24, 24)">
      <text x="0" y="0" class="box-title" fill="#34d399">真实任务吞吐与批处理尺寸实测对比</text>
      
      <!-- Metric 1: LLM Fine-tuning (LoRA) -->
      <g transform="translate(0, 35)">
        <text x="0" y="14" class="box-desc" fill="#f8fafc" font-weight="700">1. Llama-3.1 8B LoRA 微调 (最大 Batch Size)</text>
        <!-- Bar P100 -->
        <rect x="0" y="24" width="140" height="20" rx="4" fill="#334155"/>
        <text x="148" y="38" class="box-desc" fill="#94a3b8">P100 (16GB): Batch=2 (OOM边缘)</text>
        <!-- Bar 2x T4 -->
        <rect x="0" y="50" width="310" height="20" rx="4" fill="#0284c7"/>
        <text x="318" y="64" class="highlight">2× T4 (DDP): Batch=8 (4x吞吐)</text>
      </g>

      <!-- Metric 2: Whisper Large-V3 Audio Transcription -->
      <g transform="translate(0, 130)">
        <text x="0" y="14" class="box-desc" fill="#f8fafc" font-weight="700">2. Whisper Large V3 播客音频并发转写速度 (RTF倍速)</text>
        <!-- Bar P100 -->
        <rect x="0" y="24" width="160" height="20" rx="4" fill="#334155"/>
        <text x="168" y="38" class="box-desc" fill="#94a3b8">P100: 8.5× 实时速率</text>
        <!-- Bar 2x T4 -->
        <rect x="0" y="50" width="330" height="20" rx="4" fill="#10b981"/>
        <text x="338" y="64" class="highlight" fill="#34d399">2× T4 双路切片: 17.8× 实时速率</text>
      </g>

      <!-- Metric 3: Stable Diffusion SDXL Batch Latency -->
      <g transform="translate(0, 225)">
        <text x="0" y="14" class="box-desc" fill="#f8fafc" font-weight="700">3. 连续生成 100 张 1024×1024 图像耗时 (分钟)</text>
        <!-- Bar P100 -->
        <rect x="0" y="24" width="280" height="20" rx="4" fill="#9f1239"/>
        <text x="288" y="38" class="box-desc" fill="#fda4af">P100: 42 分钟 (无 FP16 TensorCore)</text>
        <!-- Bar 2x T4 -->
        <rect x="0" y="50" width="125" height="20" rx="4" fill="#6366f1"/>
        <text x="135" y="64" class="highlight" fill="#a5b4fc">2× T4: 18 分钟 (节约 57% 算力)</text>
      </g>

      <!-- DDP vs DP Architecture Note -->
      <g transform="translate(0, 320)">
        <rect width="402" height="70" rx="8" fill="#131b2e" stroke="#3b82f6" stroke-width="1"/>
        <text x="14" y="22" class="box-desc" fill="#60a5fa" font-weight="700">⚡ 避坑关键：务必使用 torch.distributed (DDP)</text>
        <text x="14" y="40" class="box-desc" fill="#94a3b8">传统 nn.DataParallel 会让 GPU 0 充当参数聚合器导致严重显存偏斜；</text>
        <text x="14" y="56" class="box-desc" fill="#cbd5e1">改用 DDP 多进程独立副本，双卡显存占用绝对均衡且无主卡瓶颈。</text>
      </g>
    </g>
  </g>
</svg>
