<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#091024"/>
      <stop offset="100%" stop-color="#030610"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .box-desc { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #cbd5e1; }
      .tag { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 700; }
      .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #38bdf8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="url(#bg)"/>

  <!-- Top Title -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" class="title">交互调试 CPU 到后台提交 GPU 的分流流水线</text>
    <text x="0" y="24" class="desc">传统错误高耗姿势 vs 生产级零漏电架构：如何通过无头调度将配额利用率拉升至 95% 以上</text>
  </g>

  <!-- Section 1: The Bad Pattern (Top Lane) -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="920" height="150" rx="12" fill="#1e0b11" stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect width="920" height="4" rx="2" fill="#f43f5e"/>
    
    <!-- Title Tag -->
    <g transform="translate(20, 20)">
      <rect width="120" height="22" rx="4" fill="#881337"/>
      <text x="10" y="15" class="tag" fill="#fecdd3">× 常见漏电反模式</text>
      <text x="135" y="16" class="box-title" fill="#f43f5e">全程挂载 GPU 交互式开发（极其昂贵的浪费）</text>
    </g>

    <!-- Steps in Bad Flow -->
    <g transform="translate(20, 58)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="165" height="72" rx="8" fill="#2d121b" stroke="#9f1239" stroke-width="1"/>
      <text x="12" y="22" class="box-desc" fill="#fecdd3" font-weight="700">1. 开 GPU 写代码</text>
      <text x="12" y="42" class="box-desc" fill="#94a3b8">编写/调试 Syntax 错误</text>
      <text x="12" y="58" class="box-desc" fill="#f43f5e">持续扣费 (0% GPU利用)</text>

      <!-- Arrow -->
      <path d="M 175 36 L 195 36" stroke="#f43f5e" stroke-width="1.5" fill="none"/>
      <polygon points="195,33 200,36 195,39" fill="#f43f5e"/>

      <!-- Step 2 -->
      <rect x="210" y="0" width="175" height="72" rx="8" fill="#2d121b" stroke="#9f1239" stroke-width="1"/>
      <text x="12" y="22" class="box-desc" fill="#fecdd3" font-weight="700">2. GPU 会话下下载数据</text>
      <text x="12" y="42" class="box-desc" fill="#94a3b8">从外网拉几十GB模型权重</text>
      <text x="12" y="58" class="box-desc" fill="#f43f5e">网速受限白耗 1~2h 算力</text>

      <!-- Arrow -->
      <path d="M 395 36 L 415 36" stroke="#f43f5e" stroke-width="1.5" fill="none"/>
      <polygon points="415,33 420,36 415,39" fill="#f43f5e"/>

      <!-- Step 3 -->
      <rect x="430" y="0" width="195" height="72" rx="8" fill="#2d121b" stroke="#9f1239" stroke-width="1"/>
      <text x="12" y="22" class="box-desc" fill="#fecdd3" font-weight="700">3. 边训练边看网页</text>
      <text x="12" y="42" class="box-desc" fill="#94a3b8">依赖浏览器长连接保持</text>
      <text x="12" y="58" class="box-desc" fill="#f43f5e">网络波动断连导致会话挂起</text>

      <!-- Arrow -->
      <path d="M 635 36 L 655 36" stroke="#f43f5e" stroke-width="1.5" fill="none"/>
      <polygon points="655,33 660,36 655,39" fill="#f43f5e"/>

      <!-- Step 4 -->
      <rect x="670" y="0" width="210" height="72" rx="8" fill="#4c0519" stroke="#be123c" stroke-width="1.5"/>
      <text x="12" y="22" class="box-desc" fill="#ffe4e6" font-weight="700">4. 直接关掉浏览器标签</text>
      <text x="12" y="42" class="box-desc" fill="#fda4af">容器未主动关机，后台闲置</text>
      <text x="12" y="58" class="box-desc" fill="#f43f5e" font-weight="700">超时前扣光本周所有配额！</text>
    </g>
  </g>

  <!-- Section 2: The Recommended Zero-Leak Flow (Bottom Lane) -->
  <g transform="translate(40, 275)" filter="url(#shadow)">
    <rect width="920" height="245" rx="12" fill="#061a23" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="920" height="4" rx="2" fill="#38bdf8"/>

    <!-- Title Tag -->
    <g transform="translate(20, 20)">
      <rect width="130" height="22" rx="4" fill="#0369a1"/>
      <text x="10" y="15" class="tag" fill="#e0f2fe">✓ 生产级零漏电规范</text>
      <text x="145" y="16" class="box-title" fill="#38bdf8">阶段解耦：CPU 纯净调试 + 远程无头批处理调度</text>
    </g>

    <!-- 4 Structured Stages -->
    <g transform="translate(20, 58)">
      <!-- Stage 1 -->
      <g transform="translate(0, 0)">
        <rect width="205" height="165" rx="8" fill="#082236" stroke="#0ea5e9" stroke-width="1"/>
        <rect width="205" height="3" rx="1" fill="#38bdf8"/>
        <text x="14" y="24" class="box-title" font-size="13" fill="#38bdf8">Stage 1: CPU 本地/交互</text>
        <text x="14" y="44" class="box-desc" fill="#94a3b8">· Accelerator 设为 None</text>
        <text x="14" y="62" class="box-desc" fill="#94a3b8">· 校验 Dataset 维度与格式</text>
        <text x="14" y="80" class="box-desc" fill="#94a3b8">· 运行 1 个 Batch 跑通流程</text>
        <text x="14" y="98" class="box-desc" fill="#94a3b8">· 完成所有依赖库预编译</text>
        <rect x="14" y="132" width="130" height="18" rx="4" fill="#0369a1"/>
        <text x="20" y="145" class="tag" fill="#e0f2fe">消耗配额：0 小时</text>
      </g>

      <!-- Connect 1 -> 2 -->
      <path d="M 215 82 L 235 82" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
      <polygon points="235,79 240,82 235,85" fill="#38bdf8"/>

      <!-- Stage 2 -->
      <g transform="translate(245, 0)">
        <rect width="205" height="165" rx="8" fill="#062e2c" stroke="#10b981" stroke-width="1"/>
        <rect width="205" height="3" rx="1" fill="#34d399"/>
        <text x="14" y="24" class="box-title" font-size="13" fill="#34d399">Stage 2: 声明式元数据</text>
        <text x="14" y="44" class="box-desc" fill="#94a3b8">· kernel-metadata.json</text>
        <text x="14" y="62" class="code-font">"enable_gpu": "true"</text>
        <text x="14" y="80" class="code-font">"enable_internet": "true"</text>
        <text x="14" y="98" class="box-desc" fill="#94a3b8">· 选择 2× T4 显存最大化</text>
        <rect x="14" y="132" width="140" height="18" rx="4" fill="#065f46"/>
        <text x="20" y="145" class="tag" fill="#a7f3d0">Git 风格版本受控</text>
      </g>

      <!-- Connect 2 -> 3 -->
      <path d="M 460 82 L 480 82" stroke="#34d399" stroke-width="1.5" fill="none"/>
      <polygon points="480,79 485,82 480,85" fill="#34d399"/>

      <!-- Stage 3 -->
      <g transform="translate(490, 0)">
        <rect width="205" height="165" rx="8" fill="#1b1c3a" stroke="#818cf8" stroke-width="1"/>
        <rect width="205" height="3" rx="1" fill="#a5b4fc"/>
        <text x="14" y="24" class="box-title" font-size="13" fill="#a5b4fc">Stage 3: 无头容器调度</text>
        <text x="14" y="44" class="code-font">$ kaggle kernels push</text>
        <text x="14" y="62" class="box-desc" fill="#94a3b8">· 本地触发，云端容器起跑</text>
        <text x="14" y="80" class="box-desc" fill="#94a3b8">· 网页无需打开，不怕掉线</text>
        <text x="14" y="98" class="box-desc" fill="#94a3b8">· 独立沙盒执行至结束</text>
        <rect x="14" y="132" width="130" height="18" rx="4" fill="#3730a3"/>
        <text x="20" y="145" class="tag" fill="#e0e7ff">100% 有效计算</text>
      </g>

      <!-- Connect 3 -> 4 -->
      <path d="M 705 82 L 725 82" stroke="#a5b4fc" stroke-width="1.5" fill="none"/>
      <polygon points="725,79 730,82 725,85" fill="#a5b4fc"/>

      <!-- Stage 4 -->
      <g transform="translate(735, 0)">
        <rect width="145" height="165" rx="8" fill="#1e1809" stroke="#f59e0b" stroke-width="1"/>
        <rect width="145" height="3" rx="1" fill="#fbbf24"/>
        <text x="12" y="24" class="box-title" font-size="13" fill="#fbbf24">Stage 4: 自动落盘</text>
        <text x="12" y="44" class="box-desc" fill="#94a3b8">· 跑完秒级关机</text>
        <text x="12" y="62" class="box-desc" fill="#94a3b8">· 截断计费无空转</text>
        <text x="12" y="80" class="code-font">$ kernels output</text>
        <text x="12" y="98" class="box-desc" fill="#94a3b8">· 模型/日志同步</text>
        <rect x="12" y="132" width="115" height="18" rx="4" fill="#78350f"/>
        <text x="16" y="145" class="tag" fill="#fde68a">零漏电完美闭环</text>
      </g>
    </g>
  </g>
</svg>
