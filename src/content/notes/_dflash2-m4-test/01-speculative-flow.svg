<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Speculative decoding 与 DFlash2 工作流程</title>
  <desc id="desc">草稿模型先提出多个 token，主模型批量验证，接受的 token 被保留，错误分支被丢弃。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1224"/><stop offset="1" stop-color="#1b1530"/></linearGradient>
    <linearGradient id="good" x1="0" x2="1"><stop stop-color="#58e3e8"/><stop offset="1" stop-color="#8df7c3"/></linearGradient>
    <linearGradient id="bad" x1="0" x2="1"><stop stop-color="#ff8295"/><stop offset="1" stop-color="#ffbf69"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8aa0ca"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <text x="62" y="74" fill="#fff" font-size="32" font-weight="800">DFlash2 在做什么？</text>
    <text x="63" y="111" fill="#9eadd1" font-size="18">把“主模型每次只走一步”改成“先猜一段，再批量核对”</text>
    <g transform="translate(62 170)">
      <rect width="250" height="176" rx="20" fill="#141e40" stroke="#58e3e8" stroke-width="2"/>
      <text x="24" y="40" fill="#8df7c3" font-size="17" font-weight="700">01 / DRAFT</text>
      <text x="24" y="86" fill="#fff" font-size="28" font-weight="700">草稿模型</text>
      <text x="24" y="123" fill="#aebbd8" font-size="17">快速提出一串 token</text>
      <text x="24" y="151" fill="#58e3e8" font-family="monospace" font-size="16">“speculative decoding …”</text>
    </g>
    <path d="M330 258H420" stroke="#8aa0ca" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(452 170)">
      <rect width="290" height="176" rx="20" fill="#172444" stroke="#a8b9e8" stroke-opacity=".75" stroke-width="2"/>
      <text x="24" y="40" fill="#b9c7ec" font-size="17" font-weight="700">02 / VERIFY</text>
      <text x="24" y="86" fill="#fff" font-size="28" font-weight="700">主模型验证</text>
      <text x="24" y="123" fill="#aebbd8" font-size="17">一次前向计算检查多步</text>
      <text x="24" y="151" fill="#ffbf69" font-family="monospace" font-size="16">accept / reject</text>
    </g>
    <path d="M762 258H852" stroke="#8aa0ca" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(884 170)">
      <rect width="250" height="176" rx="20" fill="#201d3b" stroke="#ffbf69" stroke-width="2"/>
      <text x="24" y="40" fill="#ffbf69" font-size="17" font-weight="700">03 / CONTINUE</text>
      <text x="24" y="86" fill="#fff" font-size="28" font-weight="700">继续生成</text>
      <text x="24" y="123" fill="#aebbd8" font-size="17">接受的 token 留下</text>
      <text x="24" y="151" fill="#ff8a9d" font-size="16">猜错的 token 丢弃</text>
    </g>
    <g transform="translate(92 430)">
      <text x="0" y="0" fill="#9eadd1" font-size="18" font-weight="700">一次 speculative step 的 token 轨迹</text>
      <g transform="translate(0 30)">
        <rect x="0" y="0" width="122" height="54" rx="12" fill="#183e47" stroke="#58e3e8"/><text x="20" y="34" fill="#d9fff1" font-family="monospace" font-size="17">speculative</text>
        <rect x="136" y="0" width="92" height="54" rx="12" fill="#183e47" stroke="#58e3e8"/><text x="160" y="34" fill="#d9fff1" font-family="monospace" font-size="17">decoding</text>
        <rect x="242" y="0" width="92" height="54" rx="12" fill="#183e47" stroke="#58e3e8"/><text x="268" y="34" fill="#d9fff1" font-family="monospace" font-size="17">可以</text>
        <rect x="348" y="0" width="80" height="54" rx="12" fill="#3e2930" stroke="#ff8295"/><text x="374" y="34" fill="#ffd9d4" font-family="monospace" font-size="17">加速</text>
        <path d="M438 27h40" stroke="#8aa0ca" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="500" y="23" fill="#8df7c3" font-size="17" font-weight="700">保留 3 个</text><text x="500" y="49" fill="#ff9da9" font-size="16">丢弃 1 个</text>
      </g>
    </g>
    <path d="M804 490c58 0 72-34 72-88" fill="none" stroke="#ff8295" stroke-dasharray="8 10" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="882" y="514" fill="#ffb3ba" font-size="17">关键：接受率</text>
    <text x="882" y="544" fill="#9eadd1" font-size="15">决定猜测成本能否换来收益</text>
  </g>
</svg>
