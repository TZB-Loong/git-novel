<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <style>
      .bg { fill: #030712; rx: 12; }
      .axis { stroke: #334155; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: bold; font-size: 15px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .curve-cloud { fill: none; stroke: #f43f5e; stroke-width: 3; }
      .curve-hybrid { fill: none; stroke: #10b981; stroke-width: 3; }
    </style>
  </defs>

  <rect width="900" height="420" class="bg"/>

  <!-- Title & Header -->
  <text x="40" y="42" class="text-title">图 3-1：10 人研发团队算力账本：纯云端 API (OPEX) vs 端云混合 (CAPEX) 回本周期</text>
  <text x="40" y="65" class="text-sub">一次性采购 2 台 Mac 节点 (CAPEX ¥24,000)，在第 2.5 个月越过平衡点，首年净省 ¥88,800</text>

  <!-- Coordinate Grid -->
  <g transform="translate(80, 95)">
    <!-- Grid Lines (Y: 0, 40k, 80k, 120k, 160k) -->
    <line x1="0" y1="0" x2="520" y2="0" class="grid"/>
    <line x1="0" y1="60" x2="520" y2="60" class="grid"/>
    <line x1="0" y1="120" x2="520" y2="120" class="grid"/>
    <line x1="0" y1="180" x2="520" y2="180" class="grid"/>
    <line x1="0" y1="240" x2="520" y2="240" class="grid"/>

    <!-- Grid Lines (X: 0, 2.5m, 6m, 9m, 12m) -->
    <line x1="110" y1="0" x2="110" y2="240" class="grid"/>
    <line x1="260" y1="0" x2="260" y2="240" class="grid"/>
    <line x1="390" y1="0" x2="390" y2="240" class="grid"/>
    <line x1="520" y1="0" x2="520" y2="240" class="grid"/>

    <!-- Axes -->
    <line x1="0" y1="240" x2="540" y2="240" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="240" class="axis"/>

    <!-- Y labels (CNY Cost) -->
    <text x="-15" y="5" text-anchor="end" class="text-label">¥160,000</text>
    <text x="-15" y="65" text-anchor="end" class="text-label">¥120,000</text>
    <text x="-15" y="125" text-anchor="end" class="text-label">¥80,000</text>
    <text x="-15" y="185" text-anchor="end" class="text-label">¥40,000</text>
    <text x="-15" y="245" text-anchor="end" class="text-label">¥0</text>

    <!-- X labels (Months) -->
    <text x="0" y="260" text-anchor="middle" class="text-label">第 0 月</text>
    <text x="110" y="260" text-anchor="middle" class="text-label" fill="#fbbf24">第 2.5 月 (平衡点)</text>
    <text x="260" y="260" text-anchor="middle" class="text-label">第 6 月</text>
    <text x="390" y="260" text-anchor="middle" class="text-label">第 9 月</text>
    <text x="520" y="260" text-anchor="middle" class="text-label">第 12 月</text>
    <text x="260" y="285" text-anchor="middle" class="text-label" fill="#94a3b8">团队运行周期 (月)</text>

    <!-- Curve 1: Pure Cloud API (Rose) - Slope = 11,400/mo, 12 mo = 136,800 (y = 240 - 205.2 = 34.8) -->
    <line x1="0" y1="240" x2="520" y2="34.8" class="curve-cloud"/>

    <!-- Curve 2: Hybrid Local + Cloud (Emerald) - Initial = 24,000 (y=204), 12 mo = 48,000 (y = 240 - 72 = 168) -->
    <line x1="0" y1="204" x2="520" y2="168" class="curve-hybrid"/>

    <!-- Intersection / Breakeven Callout at Month 2.55 (x=110.5, y=196.4) -->
    <circle cx="110.5" cy="196.4" r="6" fill="#fbbf24"/>
    <line x1="110.5" y1="0" x2="110.5" y2="240" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="120" y="185" class="text-mono" fill="#fbbf24" font-weight="bold">2.5 个月收回硬件成本 (¥29,100)</text>

    <!-- End Callouts at Month 12 -->
    <circle cx="520" cy="34.8" r="5" fill="#f43f5e"/>
    <text x="505" y="48" text-anchor="end" class="text-mono" fill="#f43f5e" font-weight="bold">纯云端: ¥136,800 / 年</text>

    <circle cx="520" cy="168" r="5" fill="#10b981"/>
    <text x="505" y="160" text-anchor="end" class="text-mono" fill="#10b981" font-weight="bold">端云混合: ¥48,000 / 年 (含硬件)</text>
  </g>

  <!-- Side Metric Card -->
  <g transform="translate(640, 95)">
    <rect width="220" height="255" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="18" y="30" class="text-title" font-size="13px" fill="#38bdf8">财务核算明细 (严格对齐)</text>

    <text x="18" y="60" class="text-sub" font-size="11.5px">
      <tspan x="18" dy="0" fill="#f43f5e">• 纯云端模式：</tspan>
      <tspan x="26" dy="18" fill="#cbd5e1">人均 ¥1,140/月 API 账单</tspan>
      <tspan x="26" dy="16" fill="#cbd5e1">10 人团队年耗 ¥136,800</tspan>
      
      <tspan x="18" dy="24" fill="#10b981">• 端云混合模式：</tspan>
      <tspan x="26" dy="18" fill="#cbd5e1">CAPEX: 2台 Mac mini M4</tspan>
      <tspan x="26" dy="16" fill="#cbd5e1">一次性硬件: ¥24,000</tspan>
      <tspan x="26" dy="16" fill="#cbd5e1">云端 API: ¥24,000/年</tspan>

      <tspan x="18" dy="24" fill="#fbbf24">首年净省：¥88,800</tspan>
      <tspan x="26" dy="16" fill="#38bdf8">(次年起年省 ¥112,800)</tspan>
    </text>
  </g>
</svg>
