<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <style>
      .bg { fill: #030712; rx: 12; }
      .axis { stroke: #334155; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: bold; font-size: 15px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .curve-cloud { fill: none; stroke: #f43f5e; stroke-width: 3; }
      .curve-hybrid { fill: none; stroke: #10b981; stroke-width: 3; }
    </style>
  </defs>

  <rect width="900" height="420" class="bg"/>

  <!-- Title & Header -->
  <text x="40" y="42" class="text-title">图 3-1：10 人研发团队算力账本：纯云端 API (OPEX) vs 端云混合 (CAPEX) 回本周期</text>
  <text x="40" y="65" class="text-sub">一次性采购 2 台 M4 Max 本地网关，在第 2.5 个月即可越过收支平衡点，首年净省超过 ¥105,000</text>

  <!-- Coordinate Grid -->
  <g transform="translate(80, 95)">
    <!-- Grid Lines -->
    <line x1="0" y1="40" x2="520" y2="40" class="grid"/>
    <line x1="0" y1="100" x2="520" y2="100" class="grid"/>
    <line x1="0" y1="160" x2="520" y2="160" class="grid"/>
    <line x1="0" y1="220" x2="520" y2="220" class="grid"/>

    <line x1="130" y1="0" x2="130" y2="240" class="grid"/>
    <line x1="260" y1="0" x2="260" y2="240" class="grid"/>
    <line x1="390" y1="0" x2="390" y2="240" class="grid"/>
    <line x1="520" y1="0" x2="520" y2="240" class="grid"/>

    <!-- Axes -->
    <line x1="0" y1="240" x2="540" y2="240" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="240" class="axis"/>

    <!-- Y labels (CNY Cost) -->
    <text x="-15" y="10" text-anchor="end" class="text-label">¥160,000</text>
    <text x="-15" y="70" text-anchor="end" class="text-label">¥120,000</text>
    <text x="-15" y="130" text-anchor="end" class="text-label">¥80,000</text>
    <text x="-15" y="190" text-anchor="end" class="text-label">¥40,000</text>
    <text x="-15" y="245" text-anchor="end" class="text-label">¥0</text>

    <!-- X labels (Months) -->
    <text x="0" y="260" text-anchor="middle" class="text-label">第 0 月</text>
    <text x="108" y="260" text-anchor="middle" class="text-label">第 2.5 月 (平衡点)</text>
    <text x="260" y="260" text-anchor="middle" class="text-label">第 6 月</text>
    <text x="390" y="260" text-anchor="middle" class="text-label">第 9 月</text>
    <text x="520" y="260" text-anchor="middle" class="text-label">第 12 月</text>
    <text x="260" y="285" text-anchor="middle" class="text-label" fill="#94a3b8">团队运行周期 (月)</text>

    <!-- Curve 1: Pure Cloud API (Rose) - Slope = ~12,500/mo -->
    <line x1="0" y1="240" x2="520" y2="15" class="curve-cloud"/>

    <!-- Curve 2: Hybrid Local + Cloud (Emerald) - Initial = 32,000, Slope = ~2,500/mo -->
    <line x1="0" y1="192" x2="520" y2="155" class="curve-hybrid"/>

    <!-- Intersection / Breakeven Callout -->
    <circle cx="108" cy="193" r="6" fill="#fbbf24"/>
    <line x1="108" y1="0" x2="108" y2="240" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="115" y="180" class="text-mono" fill="#fbbf24" font-weight="bold">2.5 个月收回硬件成本</text>

    <!-- End Callouts -->
    <circle cx="520" cy="15" r="5" fill="#f43f5e"/>
    <text x="500" y="32" text-anchor="end" class="text-mono" fill="#f43f5e" font-weight="bold">纯云端: ¥150,000 / 年</text>

    <circle cx="520" cy="155" r="5" fill="#10b981"/>
    <text x="500" y="145" text-anchor="end" class="text-mono" fill="#10b981" font-weight="bold">端云混合: ¥44,800 / 年</text>
  </g>

  <!-- Side Metric Card -->
  <g transform="translate(640, 95)">
    <rect width="220" height="255" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="18" y="30" class="text-title" font-size="13px" fill="#38bdf8">财务核算明细</text>

    <text x="18" y="60" class="text-sub" font-size="11.5px">
      <tspan x="18" dy="0" fill="#f43f5e">• 纯云端模式：</tspan>
      <tspan x="26" dy="18" fill="#cbd5e1">人均 ¥1,250/月 API 账单</tspan>
      <tspan x="26" dy="16" fill="#cbd5e1">10 人团队年耗 ¥150,000</tspan>
      
      <tspan x="18" dy="24" fill="#10b981">• 端云混合模式：</tspan>
      <tspan x="26" dy="18" fill="#cbd5e1">CAPEX: 2台 Mac Studio</tspan>
      <tspan x="26" dy="16" fill="#cbd5e1">一次性硬件: ¥32,000</tspan>
      <tspan x="26" dy="16" fill="#cbd5e1">云端长尾 API: ¥12,800/年</tspan>

      <tspan x="18" dy="24" fill="#fbbf24">净省现金：¥105,200/年</tspan>
      <tspan x="18" dy="16" fill="#38bdf8">代码资产 100% 物理留存</tspan>
    </text>
  </g>
</svg>
