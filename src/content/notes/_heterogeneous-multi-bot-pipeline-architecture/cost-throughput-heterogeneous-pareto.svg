<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580">
  <defs>
    <style>
      .bg { fill: #040813; rx: 14; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 16px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-h2 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #e2e8f0; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .card-bg { fill: #0b1329; stroke: #1e293b; stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <rect width="960" height="580" class="bg"/>

  <!-- Header -->
  <text x="35" y="36" class="text-title">图 3-1：异构 Multi-Bot 协同 vs 单体云实例的成本-吞吐帕累托相图</text>
  <text x="35" y="56" class="text-sub">为什么“全功能单体云机器”是性价比陷阱？解密多基础设施协同的算力杠杆与零账单生产级闭环</text>

  <!-- Container -->
  <g transform="translate(35, 75)">
    <rect width="890" height="470" rx="10" class="card-bg"/>

    <!-- Left Chart Canvas (Scatter / Pareto Trade-off) -->
    <g transform="translate(35, 30)">
      <rect width="520" height="310" rx="6" fill="#070c1e" stroke="#1e293b" stroke-width="0.8"/>

      <!-- Grid lines -->
      <line x1="55" y1="40" x2="490" y2="40" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="55" y1="100" x2="490" y2="100" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="55" y1="160" x2="490" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="55" y1="220" x2="490" y2="220" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="55" y1="270" x2="490" y2="270" stroke="#334155" stroke-width="1.5"/>

      <!-- Y-Axis (真实工程综合交付吞吐指数) -->
      <text x="45" y="44" text-anchor="end" class="text-mono" font-size="10" fill="#10b981">100</text>
      <text x="45" y="104" text-anchor="end" class="text-mono" font-size="10" fill="#10b981">75</text>
      <text x="45" y="164" text-anchor="end" class="text-mono" font-size="10" fill="#10b981">50</text>
      <text x="45" y="224" text-anchor="end" class="text-mono" font-size="10" fill="#10b981">25</text>
      <text x="45" y="274" text-anchor="end" class="text-mono" font-size="10" fill="#10b981">0</text>
      <text x="20" y="25" class="text-mono" font-weight="700" font-size="10" fill="#34d399">综合工程交付效能 ↑ (越高越好)</text>

      <!-- X-Axis (月度基础设施与账单成本) -->
      <text x="80" y="292" text-anchor="middle" class="text-mono" font-size="10" fill="#10b981">$0 (纯额度)</text>
      <text x="180" y="292" text-anchor="middle" class="text-mono" font-size="10" fill="#94a3b8">$150/月</text>
      <text x="290" y="292" text-anchor="middle" class="text-mono" font-size="10" fill="#94a3b8">$450/月</text>
      <text x="400" y="292" text-anchor="middle" class="text-mono" font-size="10" fill="#94a3b8">$900/月</text>
      <text x="480" y="292" text-anchor="middle" class="text-mono" font-size="10" fill="#f87171">$1500+/月</text>
      <text x="440" y="260" text-anchor="end" class="text-mono" font-size="10" fill="#f87171">云账单总成本 →</text>

      <!-- Pareto Frontier Curve -->
      <path d="M 85,55 Q 180,75 300,110 T 480,180" fill="none" stroke="#10b981" stroke-width="2.5"/>
      <text x="190" y="70" class="text-mono" font-size="10" fill="#6ee7b7">异构算力帕累托最优边界</text>

      <!-- Point 1: Our Model (The Golden Dot) -->
      <g transform="translate(85, 55)">
        <circle cx="0" cy="0" r="9" fill="#10b981" stroke="#fff" stroke-width="2"/>
        <rect x="15" y="-22" width="210" height="38" rx="4" fill="#042a1f" stroke="#10b981" stroke-width="1.2"/>
        <text x="25" y="-8" class="text-mono" font-weight="700" font-size="10" fill="#6ee7b7">git-novel 异构流水线 (实操)</text>
        <text x="25" y="7" class="text-mono" font-size="9" fill="#a7f3d0">交付效能: 96 | 额外云支出: $0</text>
      </g>

      <!-- Point 2: Monolithic Cloud GPU Instance (The Cloud Trap) -->
      <g transform="translate(420, 160)">
        <circle cx="0" cy="0" r="8" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
        <rect x="-215" y="10" width="205" height="38" rx="4" fill="#311010" stroke="#ef4444" stroke-width="1"/>
        <text x="-205" y="25" class="text-mono" font-weight="700" font-size="10" fill="#fca5a5">单体全能云主机 (A10G/40G)</text>
        <text x="-205" y="40" class="text-mono" font-size="9" fill="#fecaca">交付效能: 52 | 账单: $1100+/月</text>
      </g>

      <!-- Point 3: Local Mac only (OOM Failure) -->
      <g transform="translate(85, 255)">
        <circle cx="0" cy="0" r="7" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
        <rect x="15" y="-12" width="165" height="30" rx="4" fill="#2d1506" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="22" y="2" class="text-mono" font-weight="700" font-size="10" fill="#fde68a">纯本地运行 (单节点)</text>
        <text x="22" y="14" class="text-mono" font-size="8" fill="#fed7aa">显存不足/无法跑 7B+ vLLM</text>
      </g>
    </g>

    <!-- Legend below curve -->
    <g transform="translate(35, 360)">
      <rect width="520" height="85" rx="6" fill="#070c1e" stroke="#1e293b" stroke-width="0.8"/>
      
      <circle cx="25" cy="25" r="5" fill="#10b981"/>
      <text x="38" y="29" class="text-mono" font-weight="700" fill="#a7f3d0">异构多 Bot 流水线核心红利：</text>
      <text x="38" y="45" class="text-body" fill="#94a3b8">将“高频轻量工程调度”留给本地，将“不可信环境准备”放入云沙盒，将“瞬时重型 GPU 压测”定向分派给免费云算力池。</text>

      <circle cx="25" cy="62" r="5" fill="#ef4444"/>
      <text x="38" y="66" class="text-mono" font-weight="700" fill="#fca5a5">单体云主机陷阱：闲时 90% 显存空转，月付上千美元，却受困于单机环境污染</text>
    </g>

    <!-- Right Side: Architectural Principles -->
    <g transform="translate(575, 30)">
      <rect width="280" height="415" rx="8" fill="#071026" stroke="#2563eb" stroke-width="1"/>
      
      <text x="18" y="30" class="text-h2" fill="#93c5fd">生产级“物理分立”法则</text>
      <line x1="18" y1="42" x2="262" y2="42" stroke="#1e3a8a" stroke-width="1"/>

      <!-- Card 1 -->
      <g transform="translate(18, 55)">
        <rect width="244" height="75" rx="4" fill="#0b1b38"/>
        <text x="10" y="18" class="text-mono" font-weight="700" fill="#38bdf8">1. 算力按需流动，环境各司其职</text>
        <text x="10" y="36" class="text-body" fill="#bfdbfe">不强求一个 Agent 能干所有事；</text>
        <text x="10" y="52" class="text-body" fill="#bfdbfe">Mac 负责磁盘与排版，沙盒跑探针，</text>
        <text x="10" y="68" class="text-body" fill="#bfdbfe">Kaggle 双卡专职执行 35 分钟长压测。</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(18, 140)">
        <rect width="244" height="75" rx="4" fill="#0b1b38"/>
        <text x="10" y="18" class="text-mono" font-weight="700" fill="#38bdf8">2. 彻底消灭分布式会话同步</text>
        <text x="10" y="36" class="text-body" fill="#bfdbfe">不搞实时 WebSocket 会话透传；</text>
        <text x="10" y="52" class="text-body" fill="#bfdbfe">所有跨基础设施交接，只认 Git 仓库</text>
        <text x="10" y="68" class="text-body" fill="#bfdbfe">中的标准产物文件（CSV / JSON）。</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(18, 225)">
        <rect width="244" height="85" rx="4" fill="#0b1b38"/>
        <text x="10" y="18" class="text-mono" font-weight="700" fill="#38bdf8">3. 人类审批作为最终单向门禁</text>
        <text x="10" y="36" class="text-body" fill="#bfdbfe">任何花钱动作、凭据授权或</text>
        <text x="10" y="52" class="text-body" fill="#bfdbfe">对外代码推送（git push），必须经</text>
        <text x="10" y="68" class="text-body" fill="#bfdbfe">人类架构师拍板，构建绝对安全边界。</text>
      </g>

      <!-- Card 4: Summary -->
      <g transform="translate(18, 320)">
        <rect width="244" height="75" rx="4" fill="#042a1f" stroke="#10b981" stroke-width="0.8"/>
        <text x="10" y="20" class="text-mono" font-weight="700" fill="#6ee7b7">架构师总结：</text>
        <text x="10" y="38" class="text-body" fill="#a7f3d0">“真正的 Multi-Bot 正向价值，</text>
        <text x="10" y="54" class="text-body" fill="#a7f3d0">是连接割裂的现实基础设施，</text>
        <text x="10" y="70" class="text-body" fill="#a7f3d0">把每一分硬件与算力榨取到极致。”</text>
      </g>
    </g>
  </g>
</svg>