<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGradP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="badCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1515" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1A0B0B" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="goodCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B251E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#061A14" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glowP1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGradP1)" />

  <g opacity="0.1" stroke="#64748B" stroke-width="1">
    <path d="M0,60 H960 M0,120 H960 M0,180 H960 M0,240 H960 M0,300 H960 M0,360 H960 M0,420 H960 M0,480 H960" />
    <path d="M80,0 V540 M160,0 V540 M240,0 V540 M320,0 V540 M400,0 V540 M480,0 V540 M560,0 V540 M640,0 V540 M720,0 V540 M800,0 V540 M880,0 V540" />
  </g>

  <!-- Title Section -->
  <text x="480" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">静态全量工具加载 vs Tool-RAG 动态意图路由对比</text>
  <text x="480" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94A3B8">超 50+ 企业级 MCP 工具接入场景下的上下文膨胀、注意力稀释与准确率断崖</text>

  <!-- Left: Bad Pattern (Static Full Injection) -->
  <g transform="translate(40, 95)">
    <rect width="420" height="360" rx="12" fill="url(#badCardGrad)" stroke="#EF4444" stroke-width="1.5" />
    <!-- Header -->
    <rect width="420" height="42" rx="12" fill="#450A0A" />
    <circle cx="20" cy="21" r="5" fill="#EF4444" />
    <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#FCA5A5">传统反模式：静态全量注入 (Static Overload)</text>

    <!-- Schema Overload Stack -->
    <g transform="translate(20, 58)">
      <rect width="380" height="150" rx="8" fill="#1C1917" stroke="#78350F" stroke-width="1" />
      <text x="14" y="24" font-family="monospace" font-size="12" font-weight="700" fill="#FCA5A5">System Prompt Context (28,500 Token):</text>
      
      <!-- Visual Tool Badges crowded -->
      <g transform="translate(14, 38)">
        <rect width="110" height="24" rx="4" fill="#7F1D1D" /><text x="8" y="16" font-family="monospace" font-size="10" fill="#FEE2E2">tool: git_commit</text>
        <rect x="116" width="120" height="24" rx="4" fill="#7F1D1D" /><text x="124" y="16" font-family="monospace" font-size="10" fill="#FEE2E2">tool: jira_create</text>
        <rect x="242" width="110" height="24" rx="4" fill="#7F1D1D" /><text x="250" y="16" font-family="monospace" font-size="10" fill="#FEE2E2">tool: sql_query</text>
      </g>
      <g transform="translate(14, 68)">
        <rect width="110" height="24" rx="4" fill="#7F1D1D" /><text x="8" y="16" font-family="monospace" font-size="10" fill="#FEE2E2">tool: k8s_deploy</text>
        <rect x="116" width="120" height="24" rx="4" fill="#7F1D1D" /><text x="124" y="16" font-family="monospace" font-size="10" fill="#FEE2E2">tool: s3_upload</text>
        <rect x="242" width="110" height="24" rx="4" fill="#7F1D1D" /><text x="250" y="16" font-family="monospace" font-size="10" fill="#FEE2E2">tool: slack_post</text>
      </g>
      <g transform="translate(14, 98)">
        <rect width="352" height="22" rx="4" fill="#450A0A" stroke="#991B1B" stroke-dasharray="3 3" />
        <text x="100" y="15" font-family="monospace" font-size="11" fill="#FCA5A5">... 50+ MCP Tools Full Schema JSON ...</text>
      </g>
      <text x="14" y="138" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#EF4444">⚠️ 注意力严重稀释：相似参数互串，容易挑错工具</text>
    </g>

    <!-- Metrics Bad -->
    <g transform="translate(20, 222)">
      <rect width="380" height="120" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E4E4E7">实测指标表现 (50 个工具并发)：</text>
      <text x="14" y="48" font-family="monospace" font-size="12" fill="#94A3B8">• Context 消耗：<tspan fill="#EF4444" font-weight="700">28,500 Token</tspan> (占大半窗口)</text>
      <text x="14" y="70" font-family="monospace" font-size="12" fill="#94A3B8">• 首字延迟 (TTFT)：<tspan fill="#EF4444" font-weight="700">4.62 秒</tspan> (严重卡顿)</text>
      <text x="14" y="92" font-family="monospace" font-size="12" fill="#94A3B8">• 工具调用命中准确率：<tspan fill="#EF4444" font-weight="700">41.5%</tspan> (高频选错/参数幻觉)</text>
    </g>
  </g>

  <!-- Right: Good Pattern (Tool-RAG & Dynamic Pruning) -->
  <g transform="translate(500, 95)">
    <rect width="420" height="360" rx="12" fill="url(#goodCardGrad)" stroke="#10B981" stroke-width="1.5" />
    <!-- Header -->
    <rect width="420" height="42" rx="12" fill="#064E3B" />
    <circle cx="20" cy="21" r="5" fill="#10B981" />
    <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#6EE7B7">工业级架构：两阶段 Tool-RAG 动态路由</text>

    <!-- Two-Stage Pipeline -->
    <g transform="translate(20, 58)">
      <rect width="380" height="150" rx="8" fill="#022C22" stroke="#059669" stroke-width="1" />
      
      <!-- Stage 1 -->
      <g transform="translate(12, 16)">
        <rect width="356" height="40" rx="6" fill="#065F46" />
        <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#A7F3D0">阶段 1: 语义意图网关 (BM25 + BGE 向量重排)</text>
        <text x="10" y="32" font-family="monospace" font-size="10" fill="#D1FAE5">输入 Query $\rightarrow$ 动态召回 Top-3 相关 MCP 工具</text>
      </g>

      <!-- Stage 2 -->
      <g transform="translate(12, 64)">
        <rect width="356" height="46" rx="6" fill="#047857" />
        <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ECFDF5">阶段 2: 精准 Prompt 挂载 (1,680 Token)</text>
        <g transform="translate(10, 24)">
          <rect width="95" height="18" rx="3" fill="#064E3B" /><text x="6" y="13" font-family="monospace" font-size="9" fill="#A7F3D0">tool: git_commit</text>
          <rect x="102" width="95" height="18" rx="3" fill="#064E3B" /><text x="108" y="13" font-family="monospace" font-size="9" fill="#A7F3D0">tool: git_status</text>
          <rect x="204" width="95" height="18" rx="3" fill="#064E3B" /><text x="210" y="13" font-family="monospace" font-size="9" fill="#A7F3D0">tool: git_diff</text>
        </g>
      </g>

      <text x="14" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#34D399">✅ 极致轻量：只暴露当前目标所需的确定性工具 Schema</text>
    </g>

    <!-- Metrics Good -->
    <g transform="translate(20, 222)">
      <rect width="380" height="120" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E4E4E7">实测指标表现 (50 个工具并发)：</text>
      <text x="14" y="48" font-family="monospace" font-size="12" fill="#94A3B8">• Context 消耗：<tspan fill="#34D399" font-weight="700">1,680 Token</tspan> (大幅压缩 94.1%)</text>
      <text x="14" y="70" font-family="monospace" font-size="12" fill="#94A3B8">• 首字延迟 (TTFT)：<tspan fill="#34D399" font-weight="700">0.71 秒</tspan> (提速 6.5 倍)</text>
      <text x="14" y="92" font-family="monospace" font-size="12" fill="#94A3B8">• 工具调用命中准确率：<tspan fill="#34D399" font-weight="700">98.4%</tspan> (注意力高度集中)</text>
    </g>
  </g>

  <!-- Bottom Summary Bar -->
  <g transform="translate(40, 472)">
    <rect width="880" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#E2E8F0">核心结论：静态 Schema 挂载在玩具 Demo 中尚可应付；一旦跨入企业级 30+ 工具规模，必须通过 <tspan fill="#38BDF8" font-weight="700">Tool-RAG 动态意图路由</tspan> 切割上下文边界。</text>
  </g>
</svg>
