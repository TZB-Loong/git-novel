<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGradP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0D192E" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGradP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glowP2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGradP2)" />

  <g opacity="0.1" stroke="#64748B" stroke-width="1">
    <path d="M0,60 H960 M0,120 H960 M0,180 H960 M0,240 H960 M0,300 H960 M0,360 H960 M0,420 H960 M0,480 H960" />
    <path d="M80,0 V540 M160,0 V540 M240,0 V540 M320,0 V540 M400,0 V540 M480,0 V540 M560,0 V540 M640,0 V540 M720,0 V540 M800,0 V540 M880,0 V540" />
  </g>

  <!-- Title Section -->
  <text x="480" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">企业级 MCP 微服务解耦拓扑：Client、网关与 FastMCP 集群</text>
  <text x="480" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">Stdio 本地进程内通信 vs 远程 SSE (Server-Sent Events) 高并发微服务网络模型</text>

  <!-- Column 1: MCP Client & Hosts -->
  <g transform="translate(35, 90)">
    <rect width="210" height="370" rx="12" fill="url(#cardGradP2)" stroke="#38BDF8" stroke-width="1.5" />
    <rect width="210" height="38" rx="12" fill="#0369A1" opacity="0.8" />
    <circle cx="18" cy="19" r="5" fill="#38BDF8" />
    <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F0F9FF">MCP 宿主 (Clients)</text>

    <!-- Client Items -->
    <g transform="translate(15, 55)">
      <rect width="180" height="52" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Claude Code (CLI)</text>
      <text x="12" y="42" font-family="monospace" font-size="10" fill="#94A3B8">终端编码智能体</text>
    </g>
    <g transform="translate(15, 120)">
      <rect width="180" height="52" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Cursor / VS Code</text>
      <text x="12" y="42" font-family="monospace" font-size="10" fill="#94A3B8">桌面级开发 IDE</text>
    </g>
    <g transform="translate(15, 185)">
      <rect width="180" height="52" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">自研 Multi-Agent</text>
      <text x="12" y="42" font-family="monospace" font-size="10" fill="#94A3B8">企业生产编排总线</text>
    </g>
    <g transform="translate(15, 255)">
      <rect width="180" height="95" rx="8" fill="#082F49" stroke="#0284C7" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#BAE6FD">通信契约特性：</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#E0F2FE">• 标准 JSON-RPC 2.0</text>
      <text x="12" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#E0F2FE">• 状态无关与会话握手</text>
      <text x="12" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#E0F2FE">• 客户端一次适配全通</text>
    </g>
  </g>

  <!-- Flow Arrows 1 -->
  <g transform="translate(255, 230)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="35,0 28,-4 28,4" fill="#38BDF8" />
    <text x="18" y="-8" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">RPC Req</text>
  </g>
  <g transform="translate(255, 270)">
    <line x1="35" y1="0" x2="0" y2="0" stroke="#34D399" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="0,0 7,-4 7,4" fill="#34D399" />
    <text x="18" y="16" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">RPC Resp</text>
  </g>

  <!-- Column 2: MCP Enterprise Gateway & Tool-RAG Registry -->
  <g transform="translate(300, 90)">
    <rect width="250" height="370" rx="12" fill="url(#cardGradP2)" stroke="#A855F7" stroke-width="1.5" />
    <rect width="250" height="38" rx="12" fill="#7E22CE" opacity="0.8" />
    <circle cx="18" cy="19" r="5" fill="#A855F7" />
    <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#FAF5FF">MCP 企业网关 (Gateway)</text>

    <!-- Sub Modules -->
    <g transform="translate(15, 52)">
      <rect width="220" height="60" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#F3E8FF">统一鉴权与 RBAC 控制</text>
      <text x="12" y="38" font-family="monospace" font-size="10" fill="#A855F7">API-Key · JWT · 组织租户隔离</text>
      <text x="12" y="52" font-family="monospace" font-size="10" fill="#94A3B8">阻断未授权 Client 访问危险工具</text>
    </g>

    <g transform="translate(15, 122)">
      <rect width="220" height="75" rx="8" fill="#2E1065" stroke="#9333EA" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#E9D5FF">Tool-RAG 动态意图路由中心</text>
      <text x="12" y="40" font-family="monospace" font-size="10" fill="#C084FC">• 语义向量索引 (100+ Tools)</text>
      <text x="12" y="54" font-family="monospace" font-size="10" fill="#C084FC">• 关键词 BM25 + 向量双路召回</text>
      <text x="12" y="68" font-family="monospace" font-size="10" fill="#C084FC">• 动态生成精简 tools 声明</text>
    </g>

    <g transform="translate(15, 208)">
      <rect width="220" height="65" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#F3E8FF">协议适配与负载均衡 (LB)</text>
      <text x="12" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Stdio 进程桥接 / SSE 微服务直连</text>
      <text x="12" y="54" font-family="monospace" font-size="10" fill="#94A3B8">健康检查心跳 · 自动熔断与降级</text>
    </g>

    <g transform="translate(15, 285)">
      <rect width="220" height="70" rx="8" fill="#4C1D95" stroke="#7C3AED" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#EDE9FE">审计日志与合规追踪</text>
      <text x="12" y="40" font-family="monospace" font-size="10" fill="#DDD6FE">全链路 TraceID · 请求入参捕获</text>
      <text x="12" y="56" font-family="monospace" font-size="10" fill="#DDD6FE">防止敏感信息外发 (DLP 扫描)</text>
    </g>
  </g>

  <!-- Flow Arrows 2 -->
  <g transform="translate(560, 210)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#A855F7" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="35,0 28,-4 28,4" fill="#A855F7" />
    <text x="18" y="-8" text-anchor="middle" font-family="monospace" font-size="9" fill="#C084FC">Stdio</text>
  </g>
  <g transform="translate(560, 310)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="35,0 28,-4 28,4" fill="#10B981" />
    <text x="18" y="-8" text-anchor="middle" font-family="monospace" font-size="9" fill="#6EE7B7">SSE / HTTP</text>
  </g>

  <!-- Column 3: FastMCP Microservices & Systems -->
  <g transform="translate(605, 90)">
    <rect width="320" height="370" rx="12" fill="url(#cardGradP2)" stroke="#10B981" stroke-width="1.5" />
    <rect width="320" height="38" rx="12" fill="#065F46" opacity="0.8" />
    <circle cx="18" cy="19" r="5" fill="#10B981" />
    <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ECFDF5">FastMCP 服务集群 (Microservices)</text>

    <!-- Node 1: FastMCP Git Service (Local Stdio) -->
    <g transform="translate(15, 50)">
      <rect width="290" height="66" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1" />
      <rect width="70" height="20" rx="4" fill="#064E3B" x="208" y="8" />
      <text x="218" y="22" font-family="monospace" font-size="10" fill="#6EE7B7">Local Stdio</text>
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">FastMCP: Codebase &amp; Git Node</text>
      <text x="12" y="42" font-family="monospace" font-size="10" fill="#94A3B8">工具: git_diff, ripgrep_search, ast_grep</text>
      <text x="12" y="56" font-family="monospace" font-size="10" fill="#34D399">执行形式: 本地宿主进程内安全隔离</text>
    </g>

    <!-- Node 2: FastMCP Remote Database Node (SSE) -->
    <g transform="translate(15, 126)">
      <rect width="290" height="66" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1" />
      <rect width="80" height="20" rx="4" fill="#047857" x="198" y="8" />
      <text x="206" y="22" font-family="monospace" font-size="10" fill="#A7F3D0">Remote SSE</text>
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">FastMCP: Analytics &amp; DB Node</text>
      <text x="12" y="42" font-family="monospace" font-size="10" fill="#94A3B8">工具: postgres_query, clickhouse_stat</text>
      <text x="12" y="56" font-family="monospace" font-size="10" fill="#34D399">安全防御: 强制只读事务、SQL AST 白名单拦截</text>
    </g>

    <!-- Node 3: FastMCP Enterprise SaaS Node (SSE) -->
    <g transform="translate(15, 202)">
      <rect width="290" height="66" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1" />
      <rect width="80" height="20" rx="4" fill="#047857" x="198" y="8" />
      <text x="206" y="22" font-family="monospace" font-size="10" fill="#A7F3D0">Remote SSE</text>
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">FastMCP: DevOps &amp; Cloud Node</text>
      <text x="12" y="42" font-family="monospace" font-size="10" fill="#94A3B8">工具: k8s_pod_logs, jira_issue_sync</text>
      <text x="12" y="56" font-family="monospace" font-size="10" fill="#34D399">隔离审计: 双向 mTLS 加密、按租户连接池隔离</text>
    </g>

    <!-- Bottom summary node -->
    <g transform="translate(15, 278)">
      <rect width="290" height="78" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ECFDF5">FastMCP 极简装饰器开发优势：</text>
      <text x="12" y="40" font-family="monospace" font-size="10" fill="#A7F3D0">@mcp.tool() 原生推导 Pydantic 类型</text>
      <text x="12" y="54" font-family="monospace" font-size="10" fill="#A7F3D0">0 样板代码自动导出 JSON Schema</text>
      <text x="12" y="68" font-family="monospace" font-size="10" fill="#A7F3D0">一键切换 stdio / sse 传输层无需改业务</text>
    </g>
  </g>

  <!-- Bottom Global Summary -->
  <g transform="translate(35, 475)">
    <rect width="890" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#E2E8F0">解耦收益：前端 Client（Cursor/Claude）零感知，后端业务通过 FastMCP 无限横向扩展微服务，网关集中接管权限与动态路由。</text>
  </g>
</svg>
