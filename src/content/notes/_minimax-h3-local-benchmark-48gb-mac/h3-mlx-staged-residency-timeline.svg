<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGradF3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0D192E" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="segBlueF3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="segCyanF3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="segPurpleF3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="segAmberF3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="glowF3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bgGradF3)" />

  <g opacity="0.09" stroke="#64748B" stroke-width="1">
    <path d="M0,60 H960 M0,120 H960 M0,180 H960 M0,240 H960 M0,300 H960 M0,360 H960 M0,420 H960 M0,480 H960" />
    <path d="M80,0 V540 M160,0 V540 M240,0 V540 M320,0 V540 M400,0 V540 M480,0 V540 M560,0 V540 M640,0 V540 M720,0 V540 M800,0 V540 M880,0 V540" />
  </g>

  <circle cx="640" cy="250" r="180" fill="#3B82F6" opacity="0.08" filter="url(#glowF3)" />
  <circle cx="180" cy="420" r="130" fill="#22D3EE" opacity="0.08" filter="url(#glowF3)" />

  <text x="480" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">33B 全量路线的 32 分 16 秒：四段可计时阶段串行，任何时刻只驻留一件</text>
  <text x="480" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">896×512 / 124 帧 / 6 次评估 / Q8 paged Transformer + Q8 paged Qwen3-VL + Q8 视频 VAE</text>

  <g transform="translate(40, 90)">
    <rect width="880" height="424" rx="12" fill="#0B1220" stroke="#1E293B" stroke-width="1" />

    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#E2E8F0">墙钟时间轴（0 → 1,936 秒）</text>

    <g transform="translate(70, 0)">
      <path d="M0,52 H760" stroke="#334155" stroke-width="1" />
      <text x="0" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">0</text>
      <text x="190" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">8min</text>
      <text x="380" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">16min</text>
      <text x="570" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">24min</text>
      <text x="756" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748B">32min</text>

      <g transform="translate(0, 66)">
        <rect x="0" y="0" width="760" height="46" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <rect x="2" y="2" width="21" height="42" rx="6" fill="url(#segBlueF3)" />
        <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E2E8F0">① AdaLN 缓存预热</text>
        <text x="34" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#93C5FD">53 s · AdaLN 分支预计算，采样期不再加载</text>

        <rect x="23" y="52" width="760" height="46" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <rect x="25" y="54" width="614" height="42" rx="6" fill="url(#segCyanF3)" />
        <text x="40" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#06202A">② DiT 联合采样 · 6 次评估</text>
        <text x="40" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#06202A">1,607 s · 约 4.3 min/步 · 占全程 83%</text>

        <rect x="23" y="104" width="760" height="46" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <rect x="641" y="106" width="104" height="42" rx="6" fill="url(#segPurpleF3)" />
        <text x="632" y="124" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E2E8F0">③ 视频 VAE 解码 · 265 s</text>
        <text x="632" y="142" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#C4B5FD">一次性解出 124 帧</text>

        <rect x="23" y="156" width="760" height="46" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <rect x="749" y="158" width="8" height="42" rx="4" fill="url(#segAmberF3)" />
        <text x="740" y="176" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#E2E8F0">④ 音频解码 + MP4 · 10 s</text>
        <text x="740" y="194" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#FCD34D">32kHz 立体声 / AAC</text>
      </g>
    </g>

    <g transform="translate(24, 306)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">组件驻留（同一时刻只有一个大件在内存）</text>

      <g transform="translate(0, 30)">
        <rect width="152" height="30" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#E2E8F0">Qwen3-VL（Q8 paged）</text>
        <rect x="160" y="0" width="120" height="30" rx="6" fill="#1D4ED8" opacity="0.75" />
        <text x="168" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#DBEAFE">编码后立即卸载</text>
      </g>

      <g transform="translate(0, 68)">
        <rect width="152" height="30" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#E2E8F0">H3 Transformer（Q8）</text>
        <rect x="160" y="0" width="400" height="30" rx="6" fill="#0E7490" opacity="0.8" />
        <text x="168" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#CFFAFE">4-block 窗口从 SSD 预读，MLX 峰值 7.2GB</text>
      </g>

      <g transform="translate(0, 106)">
        <rect width="152" height="30" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#E2E8F0">视频 / 音频 VAE</text>
        <rect x="560" y="0" width="150" height="30" rx="6" fill="#6D28D9" opacity="0.8" />
        <text x="568" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#EDE9FE">解码阶段载入</text>
      </g>
    </g>

    <g transform="translate(24, 388)">
      <rect width="832" height="26" rx="6" fill="#0B1220" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94A3B8">进程峰值 ~15GB，MLX 峰值 7.2GB —— 分阶段加载的意义不是“更快”，而是“装得下”。</text>
    </g>
  </g>

  <g transform="translate(770, 118)">
    <rect width="130" height="86" rx="10" fill="#2A1215" stroke="#7F1D1D" stroke-width="1.2" />
    <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#FCA5A5">反面案例</text>
    <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#F87171">51.7GB</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#FCA5A5">512p + bf16 编码器</text>
    <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#FCA5A5">加载期峰值越线</text>
  </g>
</svg>