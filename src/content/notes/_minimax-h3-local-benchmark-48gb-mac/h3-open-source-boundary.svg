<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGradF1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0D192E" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="openGradF1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="cardGradF1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glowF1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowF1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B" />
    </marker>
    <marker id="arrowCyanF1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22D3EE" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bgGradF1)" />

  <g opacity="0.09" stroke="#64748B" stroke-width="1">
    <path d="M0,60 H960 M0,120 H960 M0,180 H960 M0,240 H960 M0,300 H960 M0,360 H960 M0,420 H960 M0,480 H960" />
    <path d="M80,0 V540 M160,0 V540 M240,0 V540 M320,0 V540 M400,0 V540 M480,0 V540 M560,0 V540 M640,0 V540 M720,0 V540 M800,0 V540 M880,0 V540" />
  </g>

  <circle cx="490" cy="230" r="190" fill="#10B981" opacity="0.10" filter="url(#glowF1)" />
  <circle cx="160" cy="160" r="140" fill="#3B82F6" opacity="0.10" filter="url(#glowF1)" />
  <circle cx="820" cy="330" r="150" fill="#A855F7" opacity="0.10" filter="url(#glowF1)" />

  <text x="480" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">H3 系统三件套：开源的只有中间那一件</text>
  <text x="480" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">Context-IR 负责“听懂”，H3-Base 负责“生成”，Regenerate-2K 负责“放大”——只有 H3-Base 放出权重</text>

  <g transform="translate(40, 100)">
    <rect width="250" height="270" rx="14" fill="url(#cardGradF1)" stroke="#3B82F6" stroke-width="1.6" />
    <rect width="250" height="46" rx="14" fill="#1D4ED8" opacity="0.75" />
    <circle cx="22" cy="23" r="5" fill="#93C5FD" />
    <text x="38" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#EFF6FF">H3-Context-IR</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#93C5FD">托管服务 · 不开源</text>
    <text x="14" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#CBD5E1">指令解析 / 跨模态关联</text>
    <text x="14" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#CBD5E1">时序理解 / 逻辑推理</text>
    <text x="14" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">输入越复杂，它越关键：</text>
    <text x="14" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">≤9 图 / ≤3 视频 / ≤3 音频</text>
    <rect x="14" y="192" width="222" height="58" rx="8" fill="#0B1220" stroke="#334155" stroke-width="1" />
    <text x="26" y="214" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#F59E0B">输出 Context IR</text>
    <text x="26" y="234" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94A3B8">结构化表征 → 交给 H3-Base</text>
  </g>

  <g transform="translate(355, 92)">
    <rect width="250" height="286" rx="14" fill="url(#cardGradF1)" stroke="#10B981" stroke-width="2.2" />
    <rect width="250" height="46" rx="14" fill="url(#openGradF1)" />
    <circle cx="22" cy="23" r="5" fill="#A7F3D0" />
    <text x="38" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#ECFDF5">H3-Base（权重公开）</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#34D399">OPEN WEIGHTS · 两个 checkpoint</text>
    <text x="14" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#E2E8F0">FL2VA：文 / 首帧 / 尾帧 / 首尾帧</text>
    <text x="14" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#E2E8F0">Ref2VA：文 + 参考图/视频/音频</text>
    <rect x="14" y="132" width="222" height="52" rx="8" fill="#052E2B" stroke="#0D9488" stroke-width="1" />
    <text x="26" y="153" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#5EEAD4">33B dense 单流 Transformer</text>
    <text x="26" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#99F6E4">其中 ~13B 在 AdaLN，推理可不加载</text>
    <text x="14" y="206" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">联合预测视频 + 音频 latent</text>
    <text x="14" y="226" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">输出 768p / 24fps / 32kHz 立体声</text>
    <text x="14" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748B">官方参考部署：4×GPU + ulysses-degree 4</text>
    <text x="14" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748B">BF16 · CFG 蒸馏</text>
  </g>

  <g transform="translate(670, 100)">
    <rect width="250" height="270" rx="14" fill="url(#cardGradF1)" stroke="#A855F7" stroke-width="1.6" />
    <rect width="250" height="46" rx="14" fill="#6D28D9" opacity="0.72" />
    <circle cx="22" cy="23" r="5" fill="#DDD6FE" />
    <text x="38" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#F5F3FF">H3-Regenerate-2K</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#C4B5FD">托管服务 · 不开源</text>
    <text x="14" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#CBD5E1">不用独立超分模块</text>
    <text x="14" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#CBD5E1">把 768p 结果 + 原始 context</text>
    <text x="14" y="144" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#CBD5E1">回灌 H3 原地重生成</text>
    <rect x="14" y="164" width="222" height="66" rx="8" fill="#0B1220" stroke="#334155" stroke-width="1" />
    <text x="26" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#F59E0B">In-context regeneration</text>
    <text x="26" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94A3B8">小字 / 细节能“回忆”而非猜测</text>
  </g>

  <path d="M290,235 H347" stroke="#64748B" stroke-width="2" marker-end="url(#arrowF1)" />
  <path d="M605,235 H662" stroke="#64748B" stroke-width="2" marker-end="url(#arrowF1)" />

  <g transform="translate(40, 388)">
    <rect width="880" height="118" rx="12" fill="#0B1220" stroke="#1E293B" stroke-width="1" />
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#F8FAFC">开源的边界，就是本地部署的天花板</text>

    <g transform="translate(18, 40)">
      <rect width="206" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#E2E8F0">文本编码：Qwen3-VL-32B 第 50 层</text>
    </g>
    <g transform="translate(236, 40)">
      <rect width="206" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#E2E8F0">VisualVAE：f16t4d24 + 1×2×2 patch</text>
    </g>
    <g transform="translate(454, 40)">
      <rect width="206" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#E2E8F0">AudioVAE：32kHz → 40Hz latent</text>
    </g>
    <g transform="translate(672, 40)">
      <rect width="190" height="28" rx="14" fill="#3B1D1D" stroke="#B91C1C" stroke-width="1" />
      <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#FCA5A5">稀疏注意力：训练过，未放出</text>
    </g>

    <text x="18" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94A3B8">初始开源版只提供 full attention：长序列的算力优化要靠社区自己补——这正是后面所有本地加速方案的出发点。</text>
  </g>
</svg>