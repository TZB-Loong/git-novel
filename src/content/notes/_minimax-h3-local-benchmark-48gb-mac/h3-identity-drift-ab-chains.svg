    <text x="18" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B">0 = 无关，1 = 同一张脸；0.6 以上视为强同人</text>

    <g transform="translate(30, 66)">
