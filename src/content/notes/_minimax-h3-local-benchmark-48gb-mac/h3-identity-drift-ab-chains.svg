        <text x="10" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#6EE7B7">锚图 + 提示词</text>

        <rect x="0" y="46" width="106" height="40" rx="7" fill="url(#cardBF5)" stroke="#059669" stroke-width="1" />
        <text x="10" y="63" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#A7F3D0">镜 S2</text>
        <text x="10" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#6EE7B7">锚图 + 提示词</text>

        <rect x="0" y="92" width="106" height="40" rx="7" fill="url(#cardBF5)" stroke="#059669" stroke-width="1" />
        <text x="10" y="109" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#A7F3D0">镜 S3</text>
        <text x="10" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#6EE7B7">锚图 + 提示词</text>
      </g>

      <path d="M108,60 L136,48" stroke="#34D399" stroke-width="1.6" marker-end="url(#arrowGreenF5)" />
      <path d="M108,60 L136,94" stroke="#34D399" stroke-width="1.6" marker-end="url(#arrowGreenF5)" />
      <path d="M108,60 L136,140" stroke="#34D399" stroke-width="1.6" marker-end="url(#arrowGreenF5)" />
    </g>

    <g transform="translate(18, 390)">
      <rect width="484" height="34" rx="8" fill="#052E2B" stroke="#0D9488" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#99F6E4">结构上不继承上一镜的错误：锚点是什么，每一镜就锚回什么。</text>
    </g>
  </g>

  <g transform="translate(570, 88)">
    <rect width="360" height="424" rx="12" fill="#0B1220" stroke="#1E293B" stroke-width="1" />
