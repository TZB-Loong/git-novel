      <text x="4" y="274" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#475569">0</text>
      <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#475569">.6</text>
      <text x="0" y="-6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#475569">cosine</text>

      <g transform="translate(0, 0)">
        <text x="70" y="288" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">384p · 31px 锚</text>
        <rect x="52" y="189" width="16" height="16" rx="4" fill="#7F1D1D" stroke="#B91C1C" stroke-width="1" />
        <text x="42" y="199" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#FCA5A5">A</text>
        <rect x="84" y="159" width="16" height="51" rx="4" fill="#78350F" stroke="#B45309" stroke-width="1" />
        <text x="102" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#FCD34D">B</text>
        <text x="70" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#64748B">A .24–.30 / B .22–.41</text>

        <text x="70" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#F87171">不可判别</text>
      </g>

      <g transform="translate(160, 0)">
        <text x="70" y="288" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">512p · 184px 锚</text>
        <rect x="70" y="42" width="18" height="59" rx="4" fill="url(#rangeGoodF5)" filter="url(#glowF5)" />
        <text x="100" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#6EE7B7">0.63–0.85</text>
        <circle cx="79" cy="42" r="3" fill="#ECFDF5" />
        <circle cx="79" cy="49" r="3" fill="#ECFDF5" />
        <circle cx="79" cy="101" r="3" fill="#ECFDF5" />
        <text x="96" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#A7F3D0">S3 .85</text>
        <text x="96" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#A7F3D0">S1 .82</text>
        <text x="96" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#A7F3D0">S2 .63</text>
      </g>
    </g>

    <g transform="translate(18, 390)">
      <rect width="324" height="30" rx="7" fill="#1C1917" stroke="#B45309" stroke-width="1" />
      <text x="10" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#FCD34D">陷阱：同人不同姿态可低至 0.216 → 小脸+低分辨率不能做阈值</text>
    </g>
