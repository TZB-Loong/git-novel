  <rect width="960" height="540" fill="url(#bgGradF5)" />

  <g opacity="0.08" stroke="#64748B" stroke-width="1">
    <path d="M0,60 H960 M0,120 H960 M0,180 H960 M0,240 H960 M0,300 H960 M0,360 H960 M0,420 H960 M0,480 H960" />
    <path d="M80,0 V540 M160,0 V540 M240,0 V540 M320,0 V540 M400,0 V540 M480,0 V540 M560,0 V540 M640,0 V540 M720,0 V540 M800,0 V540 M880,0 V540" />
  </g>

  <text x="480" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">身份漂移的两条链路：接力会把错误传下去，固定参考不会</text>
  <text x="480" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">左：FL2VA 首尾帧接力 vs Ref2VA 固定参考　右：本机 arcface 余弦实测分布（同人判定）</text>

  <g transform="translate(30, 88)">
    <rect width="520" height="424" rx="12" fill="#0B1220" stroke="#1E293B" stroke-width="1" />
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#F87171">A 链 · FL2VA 首尾帧接力</text>

    <g transform="translate(18, 40)">
      <rect x="0" y="0" width="118" height="58" rx="8" fill="url(#cardAF5)" stroke="#B91C1C" stroke-width="1" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FECACA">镜 S1</text>
      <text x="10" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#FCA5A5">首帧 + 尾帧生成</text>

      <rect x="160" y="0" width="118" height="58" rx="8" fill="url(#cardAF5)" stroke="#B91C1C" stroke-width="1" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FECACA">镜 S2</text>
      <text x="10" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#FCA5A5">首帧 = S1 实际尾帧</text>

      <rect x="320" y="0" width="118" height="58" rx="8" fill="url(#cardAF5)" stroke="#B91C1C" stroke-width="1" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FECACA">镜 S3</text>
      <text x="10" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#FCA5A5">首帧 = S2 实际尾帧</text>

      <path d="M120,29 H156" stroke="#F87171" stroke-width="1.8" marker-end="url(#arrowRedF5)" />
      <path d="M280,29 H316" stroke="#F87171" stroke-width="1.8" marker-end="url(#arrowRedF5)" />
    </g>

    <path d="M78,104 C120,132 180,132 218,104" stroke="#F87171" stroke-width="1.4" fill="none" stroke-dasharray="4,4" opacity="0.6" />
    <text x="150" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#FCA5A5">上一镜的偏差被当成条件写进下一镜</text>

    <g transform="translate(18, 158)">
      <rect width="484" height="40" rx="8" fill="#2A1215" stroke="#7F1D1D" stroke-width="1" />
