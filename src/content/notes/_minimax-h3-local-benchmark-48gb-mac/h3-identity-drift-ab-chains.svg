      <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#F87171">跨镜 0.735 / 0.868 / 0.782 的“稳定”，主要来自锁构图，不等于身份更强。</text>
    </g>

    <line x1="18" y1="214" x2="502" y2="214" stroke="#1E293B" stroke-width="1" />

    <text x="18" y="238" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#34D399">B 链 · Ref2VA 固定参考</text>

    <g transform="translate(18, 252)">
      <rect x="0" y="34" width="104" height="52" rx="8" fill="#0F172A" stroke="#0D9488" stroke-width="1.4" />
      <text x="10" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#5EEAD4">同一张</text>
      <text x="10" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#5EEAD4">高清锚图</text>

