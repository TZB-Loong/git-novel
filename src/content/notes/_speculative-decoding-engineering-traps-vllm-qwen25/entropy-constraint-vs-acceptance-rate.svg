<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500">
  <defs>
    <style>
      .bg { fill: #040813; rx: 14; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 15px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-axis { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
      .axis { stroke: #334155; stroke-width: 1.5; }
    </style>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="920" height="500" class="bg"/>

  <!-- Title & Subtitle -->
  <text x="40" y="38" class="text-title">图 3-1：任务生成熵（Entropy）与 Schema 约束度 vs 推测接收率衰减相图</text>
  <text x="40" y="58" class="text-sub">约束强度决定了 Target 与 Draft 概率分布的一致性；Schema 强约束下解码近似确定性，自由发散场景接收率崩溃</text>

  <!-- Main Phase Diagram Frame -->
  <g transform="translate(40, 85)">
    <!-- Background Frame -->
    <rect x="0" y="0" width="840" height="375" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>

    <!-- Coordinate Grid: Origin at (90, 310), Width = 700, Height = 250 -->
    <!-- X-axis: 0 to 1.0 (Entropy / Freedom Degree: Schema Strict -> Open Creative) -->
    <!-- Y-axis: 0% to 100% Acceptance Rate -->
    <g transform="translate(0, 10)">
      <!-- Zone Backgrounds -->
      <!-- Green Zone: X = 90 to 280 (High Constraint / Low Entropy) -->
      <rect x="90" y="20" width="200" height="280" fill="#064e3b" fill-opacity="0.18"/>
      <text x="190" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">正加速区（Accelerated Zone）</text>
      <text x="190" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#6ee7b7" text-anchor="middle">接收率 &gt; 70% · 净加速 +15%~30%</text>

      <!-- Yellow Zone: X = 290 to 520 (Moderate Constraint) -->
      <rect x="290" y="20" width="230" height="280" fill="#78350f" fill-opacity="0.15"/>
      <text x="405" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">盈亏平衡与钝化区（Breakeven）</text>
      <text x="405" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#fde68a" text-anchor="middle">接收率 40%~60% · 吞吐轻微受损</text>

      <!-- Red Zone: X = 520 to 760 (High Entropy / Creative) -->
      <rect x="520" y="20" width="240" height="280" fill="#7f1d1d" fill-opacity="0.18"/>
      <text x="640" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">吞吐断崖灾难区（Throughput Cliff）</text>
      <text x="640" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#fca5a5" text-anchor="middle">接收率 &lt; 35% · 吞吐暴跌 40%~50%</text>

      <!-- Grid lines horizontal -->
      <line x1="90" y1="60" x2="760" y2="60" class="grid"/>
      <text x="80" y="64" class="text-axis" text-anchor="end">100%</text>
      <line x1="90" y1="110" x2="760" y2="110" class="grid"/>
      <text x="80" y="114" class="text-axis" text-anchor="end">80%</text>
      <line x1="90" y1="160" x2="760" y2="160" class="grid"/>
      <text x="80" y="164" class="text-axis" text-anchor="end">60%</text>
      <!-- Breakeven Threshold Line -->
      <line x1="90" y1="185" x2="760" y2="185" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>
      <text x="765" y="189" class="text-mono" fill="#ef4444" font-weight="700">理论平衡线 ~65%</text>
      <line x1="90" y1="210" x2="760" y2="210" class="grid"/>
      <text x="80" y="214" class="text-axis" text-anchor="end">40%</text>
      <line x1="90" y1="260" x2="760" y2="260" class="grid"/>
      <text x="80" y="264" class="text-axis" text-anchor="end">20%</text>
      <line x1="90" y1="300" x2="760" y2="300" class="axis"/>
      <text x="80" y="304" class="text-axis" text-anchor="end">0%</text>

      <!-- Axes -->
      <line x1="90" y1="20" x2="90" y2="300" class="axis"/>
      <text x="90" y="15" class="text-axis" font-weight="700">草稿接收率 (Acceptance Rate)</text>
      <line x1="90" y1="300" x2="760" y2="300" class="axis"/>
      <text x="760" y="325" class="text-axis" text-anchor="end" font-weight="700">任务生成熵 / 输出自由度 →</text>

      <!-- S-Curve Decay Path -->
      <!-- Points: (150, 83) [JSON: 90.6%], (380, 178) [Code t=0: 51%], (440, 203) [Code t=0.7: 39.3%], (620, 215) [Writing t=0: 33.9%], (700, 258) [Writing t=0.7: 16.7%] -->
      <path d="M 120 75 C 220 80, 280 120, 380 178 S 500 215, 620 220 S 680 250, 740 270" fill="none" stroke="url(#curveGrad)" stroke-width="4"/>

      <!-- Measured Data Point 1: JSON (t=0.0 & t=0.7) -->
      <circle cx="160" cy="83.5" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
      <rect x="110" y="98" width="135" height="42" rx="4" fill="#0f172a" stroke="#10b981"/>
      <text x="177" y="112" class="text-mono" font-weight="700" fill="#34d399" text-anchor="middle">JSON 抽取 (t=0.0/0.7)</text>
      <text x="177" y="126" class="text-mono" fill="#a7f3d0" text-anchor="middle">接收率: 90.6% (77/85)</text>
      <text x="177" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">输出逐字节完全相同</text>

      <!-- Measured Data Point 2: Code t=0.0 -->
      <circle cx="380" cy="182.5" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="380" y="172" class="text-mono" font-weight="700" fill="#fbbf24" text-anchor="middle">代码 t=0.0 (51.0%)</text>

      <!-- Measured Data Point 3: Code t=0.7 -->
      <circle cx="440" cy="211.7" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="440" y="235" class="text-mono" font-weight="700" fill="#fbbf24" text-anchor="middle">代码 t=0.7 (39.3%)</text>

      <!-- Measured Data Point 4: Writing t=0.0 -->
      <circle cx="600" cy="225.2" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <text x="600" y="215" class="text-mono" font-weight="700" fill="#f87171" text-anchor="middle">写作 t=0.0 (33.9%)</text>

      <!-- Measured Data Point 5: Writing t=0.7 -->
      <circle cx="700" cy="268.2" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <rect x="635" y="280" width="130" height="34" rx="4" fill="#0f172a" stroke="#ef4444"/>
      <text x="700" y="295" class="text-mono" font-weight="700" fill="#f87171" text-anchor="middle">写作 t=0.7 (16.7%)</text>
      <text x="700" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">吞吐腰斩至 9.59 tok/s</text>

      <!-- Bottom X Labels -->
      <text x="160" y="325" class="text-axis" text-anchor="middle">强类型 JSON / Schema 校验</text>
      <text x="410" y="325" class="text-axis" text-anchor="middle">结构化代码 / 严格语法树</text>
      <text x="650" y="325" class="text-axis" text-anchor="middle">发散性写作 / 开放对话 (t=0.7)</text>
    </g>
  </g>
</svg>