<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#080812"/></linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="1" stroke-opacity="0.45"/></pattern>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/><rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="50" y="45" width="1100" height="610" rx="20" fill="none" stroke="#2e384d" stroke-width="2" stroke-dasharray="10,6"/>
  <rect x="88" y="78" width="330" height="34" rx="8" fill="#1e2433" stroke="#475569"/><circle cx="108" cy="95" r="5" fill="#a78bfa"/>
  <text x="122" y="101" font-family="monospace" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">TWO DEEP DIVES / CREDENTIAL BINDING</text>
  <text x="88" y="166" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="800" fill="#f8fafc">两种「免费」凭据，恰好是两种相反的身份绑定</text>
  <text x="88" y="204" font-family="-apple-system,'PingFang SC',sans-serif" font-size="17" fill="#94a3b8">一个把凭证交给字符串，一个把凭证锁进设备；前者省掉找回，后者挡住自动化。</text>

  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="88" y="238" width="500" height="330" rx="14" fill="#1a150f" stroke="url(#amber)" stroke-width="2"/>
    <text x="112" y="274" font-family="monospace" font-size="12" font-weight="700" fill="#fbbf24">① DAHL · 指纹即密码</text>
    <text x="112" y="308" font-size="16" font-weight="700" fill="#f8fafc">注册产物 = 一串 32 位指纹</text>
    <text x="112" y="336" font-size="14" fill="#94a3b8">这串指纹就是密码，无邮箱、无找回</text>
    <line x1="112" y1="354" x2="564" y2="354" stroke="#4c3a1a" stroke-width="1"/>
    <text x="112" y="384" font-size="14" fill="#e2e8f0">本质：bearer credential，持串即拥有账户</text>
    <text x="112" y="412" font-size="14" fill="#e2e8f0">一旦丢失：账户与 1 亿 token 池一起不可恢复</text>
    <text x="112" y="440" font-size="14" fill="#e2e8f0">没有 password reset / 邮箱 OTP 这条兜底链</text>
    <text x="112" y="468" font-size="14" fill="#e2e8f0">换来对自动化的友好：注册即可脚本化续跑</text>
    <line x1="112" y1="486" x2="564" y2="486" stroke="#4c3a1a" stroke-width="1"/>
    <text x="112" y="516" font-size="14" fill="#fbbf24">代价：运维责任全部转移给使用者</text>
    <text x="112" y="542" font-size="13" fill="#94a3b8">指纹不写进文章、不进日志、只进本地密钥库</text>
  </g>

  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="608" y="238" width="504" height="330" rx="14" fill="#0f1626" stroke="url(#cyan)" stroke-width="2"/>
    <text x="632" y="274" font-family="monospace" font-size="12" font-weight="700" fill="#7dd3fc">② GOOGLE PASSKEY · MUSE 链路</text>
    <text x="632" y="308" font-size="16" font-weight="700" fill="#f8fafc">Google 两步验证只挂了 passkey</text>
    <text x="632" y="336" font-size="14" fill="#94a3b8">云端浏览器没有这把设备私钥</text>
    <line x1="632" y1="354" x2="1088" y2="354" stroke="#1e3a5f" stroke-width="1"/>
    <text x="632" y="384" font-size="14" fill="#e2e8f0">本质：私钥留在注册时的那台设备里</text>
    <text x="632" y="412" font-size="14" fill="#e2e8f0">不随浏览器迁移，凭证本身不可复制、不可转发</text>
    <text x="632" y="440" font-size="14" fill="#e2e8f0">实测回执：No passkeys available</text>
    <text x="632" y="468" font-size="14" fill="#e2e8f0">抗钓鱼是设计目标，反自动化是它的副作用</text>
    <line x1="632" y1="486" x2="1088" y2="486" stroke="#1e3a5f" stroke-width="1"/>
    <text x="632" y="516" font-size="14" fill="#7dd3fc">代价：异地 / 无人值守的浏览器流程直接断链</text>
    <text x="632" y="542" font-size="13" fill="#94a3b8">叠加地区墙：提交后跳「尚未在你的国家开放」</text>
  </g>

  <rect x="88" y="586" width="1024" height="46" rx="8" fill="#141420" stroke="#2e384d"/>
  <text x="106" y="615" font-family="-apple-system,'PingFang SC',sans-serif" font-size="14" fill="#cbd5e1">判断：安全设计不是可用性缺陷，但它要求你先决定「这条流程要不要允许脚本替人完成」</text>
</svg>
