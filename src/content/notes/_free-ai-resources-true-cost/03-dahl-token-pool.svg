<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#080812"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="1" stroke-opacity="0.45"/></pattern>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/><rect width="1200" height="720" fill="url(#grid)"/>
  <rect x="50" y="45" width="1100" height="630" rx="20" fill="none" stroke="#2e384d" stroke-width="2" stroke-dasharray="10,6"/>
  <rect x="88" y="78" width="300" height="34" rx="8" fill="#1e2433" stroke="#475569"/><circle cx="108" cy="95" r="5" fill="#34d399"/>
  <text x="122" y="101" font-family="monospace" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">DAHL INFERENCE / TOKEN FLOW</text>
  <text x="88" y="166" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="800" fill="#f8fafc">1 亿 token 不在 key 里，在账户池里</text>
  <text x="88" y="204" font-family="-apple-system,'PingFang SC',sans-serif" font-size="17" fill="#94a3b8">赠送额度要手动分配才进入 key；key 初始为 0，这是最容易踩空的一步。</text>

  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="88" y="248" width="165" height="126" rx="10" fill="#1a1a24" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="102" y="274" font-family="monospace" font-size="11" fill="#fbbf24">01 注册</text>
    <text x="102" y="300" font-size="14" font-weight="700" fill="#f8fafc">浏览器注册</text>
    <text x="102" y="324" font-size="12" fill="#94a3b8">32 位指纹即密码</text>
    <text x="102" y="344" font-size="12" fill="#fca5a5">无邮箱找回</text>
    <text x="102" y="364" font-size="12" fill="#94a3b8">同时拿到 API key</text>

    <rect x="271" y="248" width="165" height="126" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="285" y="274" font-family="monospace" font-size="11" fill="#7dd3fc">02 账户池</text>
    <text x="285" y="300" font-size="18" font-weight="800" fill="#7dd3fc">1 亿 token</text>
    <text x="285" y="324" font-size="12" fill="#94a3b8">赠送额度停在池里</text>
    <text x="285" y="344" font-size="12" fill="#94a3b8">未自动挂到 key</text>

    <rect x="454" y="248" width="165" height="126" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="468" y="274" font-family="monospace" font-size="11" fill="#7dd3fc">03 手动分配</text>
    <text x="468" y="302" font-family="monospace" font-size="11" fill="#e2e8f0">POST</text>
    <text x="468" y="322" font-family="monospace" font-size="11" fill="#e2e8f0">/v1/account/</text>
    <text x="468" y="342" font-family="monospace" font-size="11" fill="#e2e8f0">allocate</text>

    <rect x="637" y="248" width="165" height="126" rx="10" fill="#201317" stroke="#ef4444" stroke-width="1.5"/>
    <text x="651" y="274" font-family="monospace" font-size="11" fill="#fca5a5">04 分配前</text>
    <text x="651" y="302" font-size="16" font-weight="700" fill="#f8fafc">API key</text>
    <text x="651" y="328" font-family="monospace" font-size="15" fill="#f87171">0 token</text>
    <text x="651" y="352" font-size="12" fill="#94a3b8">尚未挂载额度</text>

    <rect x="820" y="248" width="165" height="126" rx="10" fill="#0c1a17" stroke="#34d399" stroke-width="2"/>
    <text x="834" y="274" font-family="monospace" font-size="11" fill="#86efac">05 分配后</text>
    <text x="834" y="302" font-size="16" font-weight="700" fill="#f8fafc">API key</text>
    <text x="834" y="328" font-size="13" fill="#86efac">已有可用额度</text>

    <rect x="1003" y="248" width="109" height="126" rx="10" fill="#0c1a17" stroke="#34d399" stroke-width="2"/>
    <text x="1017" y="274" font-family="monospace" font-size="11" fill="#86efac">06 实测</text>
    <text x="1017" y="300" font-size="12" fill="#d1fae5">MiniMax</text>
    <text x="1017" y="318" font-size="12" fill="#d1fae5">M2.7</text>
    <text x="1017" y="346" font-size="12" fill="#86efac">消耗 63</text>
    <text x="1017" y="364" font-size="11" fill="#94a3b8">token</text>
  </g>
  <g font-family="monospace" font-size="18" fill="#64748b">
    <text x="256" y="316">→</text><text x="439" y="316">→</text><text x="622" y="316">→</text><text x="805" y="316">→</text><text x="988" y="316">→</text>
  </g>

  <rect x="88" y="398" width="1024" height="62" rx="10" fill="#201317" stroke="#ef4444" stroke-width="2"/>
  <text x="110" y="426" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fca5a5">⚠ 连续 7 天不发请求 → 赠送 token 全部烧掉</text>
  <text x="110" y="448" font-family="-apple-system,'PingFang SC',sans-serif" font-size="13" fill="#94a3b8">额度是有倒计时的券，不是存款；充值只收加密货币（NOWPayments）。</text>

  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="88" y="482" width="500" height="130" rx="12" fill="#141420" stroke="#2e384d"/>
    <text x="110" y="512" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">计费 / 模型</text>
    <text x="110" y="540" font-size="14" fill="#cbd5e1">$0.02 每百万 token，11 月底前半价</text>
    <text x="110" y="564" font-size="13" fill="#94a3b8">MiniMax-M2.7 · DeepSeek-V4-Flash-0731</text>
    <text x="110" y="586" font-size="13" fill="#94a3b8">GLM-5.3-Flash</text>

    <rect x="608" y="482" width="504" height="130" rx="12" fill="#141420" stroke="#2e384d"/>
    <text x="630" y="512" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">接入方式</text>
    <text x="630" y="540" font-size="13" fill="#cbd5e1">OpenAI 兼容：inference.dahl.global/v1</text>
    <text x="630" y="564" font-size="13" fill="#94a3b8">已接入本机 Magpie 的 providers.json</text>
    <text x="630" y="586" font-size="13" fill="#94a3b8">分配接口调用成功后才计费可用</text>
  </g>

  <text x="88" y="648" font-family="monospace" font-size="12" fill="#475569">注：本文不记录任何指纹、API key 或凭据的具体值，只讨论机制。</text>
</svg>
