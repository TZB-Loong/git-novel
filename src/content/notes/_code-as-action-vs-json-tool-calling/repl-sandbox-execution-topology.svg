<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <defs>
    <style>
      .bg { fill: #040813; rx: 14; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 16px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-h2 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #e2e8f0; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .card-bg { fill: #0b1329; stroke: #1e293b; stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <rect width="960" height="560" class="bg"/>

  <!-- Header -->
  <text x="35" y="36" class="text-title">图 3-1：生产级 Code-as-Action 安全执行拓扑与四层防御网</text>
  <text x="35" y="56" class="text-sub">如何兼得代码动作的图灵完备与零信任安全？从 AST 静态语法预检、Wasm/容器隔离到特权 SDK 审计网关</text>

  <!-- Container -->
  <g transform="translate(35, 75)">
    <rect width="890" height="450" rx="10" class="card-bg"/>

    <!-- Flow Pipeline Horizontal: 4 Columns -->
    
    <!-- Stage 1: LLM Generator -->
    <g transform="translate(25, 25)">
      <rect width="185" height="395" rx="8" fill="#070d1e" stroke="#6366f1" stroke-width="1.2"/>
      <rect x="12" y="14" width="161" height="26" rx="4" fill="#1e1b4b"/>
      <text x="92" y="31" text-anchor="middle" class="text-mono" font-weight="700" fill="#a5b4fc">1. 动作生成层</text>

      <g transform="translate(12, 50)">
        <text x="0" y="16" class="text-h2" fill="#c7d2fe">LLM Agent</text>
        <text x="0" y="32" class="text-mono" font-size="10" fill="#64748b">Code-as-Action 提示词</text>

        <rect y="45" width="161" height="135" rx="4" fill="#030712" stroke="#312e81"/>
        <text x="8" y="20" class="text-mono" fill="#38bdf8">```python</text>
        <text x="8" y="38" class="text-mono" fill="#94a3b8"># 允许的 SDK 模块</text>
        <text x="8" y="56" class="text-mono" fill="#a7f3d0">import sdk.analytics</text>
        <text x="8" y="74" class="text-mono" fill="#cbd5e1">df = sdk.load()</text>
        <text x="8" y="92" class="text-mono" fill="#cbd5e1">res = df.sum()</text>
        <text x="8" y="110" class="text-mono" fill="#38bdf8">print(res)</text>
        <text x="8" y="126" class="text-mono" fill="#38bdf8">```</text>

        <rect y="195" width="161" height="130" rx="4" fill="#0f172a"/>
        <text x="8" y="20" class="text-mono" font-weight="700" fill="#a5b4fc">动作规范约束：</text>
        <text x="8" y="40" class="text-body" fill="#94a3b8">• 仅调用受信 SDK</text>
        <text x="8" y="60" class="text-body" fill="#94a3b8">• 打印关键收敛指标</text>
        <text x="8" y="80" class="text-body" fill="#94a3b8">• 数据绝不全量 dump</text>
        <text x="8" y="100" class="text-body" fill="#94a3b8">• 自带异常重试块</text>
      </g>
    </g>

    <!-- Arrow 1 -->
    <text x="223" y="225" fill="#6366f1" font-size="16" font-weight="bold">→</text>

    <!-- Stage 2: AST Interceptor -->
    <g transform="translate(235, 25)">
      <rect width="185" height="395" rx="8" fill="#070d1e" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="12" y="14" width="161" height="26" rx="4" fill="#451a03"/>
      <text x="92" y="31" text-anchor="middle" class="text-mono" font-weight="700" fill="#fde68a">2. AST 静态预检网</text>

      <g transform="translate(12, 50)">
        <text x="0" y="16" class="text-h2" fill="#fed7aa">AST 语法分析器</text>
        <text x="0" y="32" class="text-mono" font-size="10" fill="#64748b">毫秒级代码静态断言</text>

        <rect y="45" width="161" height="135" rx="4" fill="#030712" stroke="#78350f"/>
        <text x="8" y="20" class="text-mono" font-weight="700" fill="#ef4444">黑名单特征熔断：</text>
        <text x="8" y="40" class="text-mono" fill="#f87171">✗ os.system / exec</text>
        <text x="8" y="58" class="text-mono" fill="#f87171">✗ subprocess.Popen</text>
        <text x="8" y="76" class="text-mono" fill="#f87171">✗ socket / urllib</text>
        <text x="8" y="94" class="text-mono" fill="#f87171">✗ __import__ / eval</text>
        <text x="8" y="116" class="text-mono" fill="#fbbf24">✓ 仅放行纯计算节点</text>

        <rect y="195" width="161" height="130" rx="4" fill="#0f172a"/>
        <text x="8" y="20" class="text-mono" font-weight="700" fill="#fde68a">拦截收益：</text>
        <text x="8" y="40" class="text-body" fill="#94a3b8">• 0 运行时开销拦截</text>
        <text x="8" y="60" class="text-body" fill="#94a3b8">• 消除恶意注入指令</text>
        <text x="8" y="80" class="text-body" fill="#94a3b8">• 拦截死循环语法结构</text>
        <text x="8" y="100" class="text-body" fill="#94a3b8">• 返回清晰静态告警</text>
      </g>
    </g>

    <!-- Arrow 2 -->
    <text x="433" y="225" fill="#f59e0b" font-size="16" font-weight="bold">→</text>

    <!-- Stage 3: Isolated REPL Sandbox -->
    <g transform="translate(445, 25)">
      <rect width="205" height="395" rx="8" fill="#070d1e" stroke="#10b981" stroke-width="1.2"/>
      <rect x="12" y="14" width="181" height="26" rx="4" fill="#064e3b"/>
      <text x="102" y="31" text-anchor="middle" class="text-mono" font-weight="700" fill="#6ee7b7">3. REPL 隔离计算沙盒</text>

      <g transform="translate(12, 50)">
        <text x="0" y="16" class="text-h2" fill="#a7f3d0">无状态容器 / Wasm</text>
        <text x="0" y="32" class="text-mono" font-size="10" fill="#64748b">MicroVM / Docker Scratch</text>

        <rect y="45" width="181" height="135" rx="4" fill="#030712" stroke="#065f46"/>
        <text x="8" y="20" class="text-mono" font-weight="700" fill="#34d399">硬核隔离边界：</text>
        <text x="8" y="38" class="text-body" fill="#6ee7b7">• 物理禁止外部公网连接</text>
        <text x="8" y="56" class="text-body" fill="#6ee7b7">• 临时 scratchfs 内存盘</text>
        <text x="8" y="74" class="text-body" fill="#6ee7b7">• CPU 限制: max 2.0s</text>
        <text x="8" y="92" class="text-body" fill="#6ee7b7">• 内存限额: 512MB 熔断</text>
        <text x="8" y="112" class="text-mono" fill="#a7f3d0">>> 执行完成即刻销毁</text>

        <rect y="195" width="181" height="130" rx="4" fill="#0f172a"/>
        <text x="8" y="20" class="text-mono" font-weight="700" fill="#6ee7b7">数据不出沙盒：</text>
        <text x="8" y="40" class="text-body" fill="#94a3b8">• 几十万条行数据内存处理</text>
        <text x="8" y="60" class="text-body" fill="#94a3b8">• 中间变量绝不写回 Context</text>
        <text x="8" y="80" class="text-body" fill="#94a3b8">• 仅捕获 stdout 标准输出</text>
        <text x="8" y="100" class="text-body" fill="#94a3b8">• 零历史污染，干净利落</text>
      </g>
    </g>

    <!-- Arrow 3 -->
    <text x="663" y="225" fill="#10b981" font-size="16" font-weight="bold">→</text>

    <!-- Stage 4: Output Filter & Audit -->
    <g transform="translate(675, 25)">
      <rect width="185" height="395" rx="8" fill="#070d1e" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="12" y="14" width="161" height="26" rx="4" fill="#0c4a6e"/>
      <text x="92" y="31" text-anchor="middle" class="text-mono" font-weight="700" fill="#bae6fd">4. 结果捕获与审计</text>

      <g transform="translate(12, 50)">
        <text x="0" y="16" class="text-h2" fill="#e0f2fe">标准输出收敛</text>
        <text x="0" y="32" class="text-mono" font-size="10" fill="#64748b">高信噪比纯净结果</text>

        <rect y="45" width="161" height="135" rx="4" fill="#030712" stroke="#075985"/>
        <text x="8" y="20" class="text-mono" font-weight="700" fill="#38bdf8">stdout 截断捕获：</text>
        <text x="8" y="38" class="text-mono" fill="#bae6fd">Total: 4,821</text>
        <text x="8" y="56" class="text-mono" fill="#bae6fd">P95: $182,500.00</text>
        <text x="8" y="74" class="text-mono" fill="#94a3b8">Latency: 1.2s</text>
        <text x="8" y="96" class="text-mono" fill="#10b981">Exit Code: 0 (OK)</text>
        <text x="8" y="118" class="text-mono" font-size="9" fill="#64748b">Size: 48 bytes only</text>

        <rect y="195" width="161" height="130" rx="4" fill="#0f172a"/>
        <text x="8" y="20" class="text-mono" font-weight="700" fill="#38bdf8">全局审计日志：</text>
        <text x="8" y="40" class="text-body" fill="#94a3b8">• 记录代码哈希与耗时</text>
        <text x="8" y="60" class="text-body" fill="#94a3b8">• 异常时回传完整 Trace</text>
        <text x="8" y="80" class="text-body" fill="#94a3b8">• 驱动 Agent 零试错自愈</text>
        <text x="8" y="100" class="text-body" fill="#94a3b8">• 闭环归档入系统 Journal</text>
      </g>
    </g>
  </g>
</svg>