<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #040813; rx: 14; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 16px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-h2 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #e2e8f0; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .card-bg { fill: #0b1329; stroke: #1e293b; stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <rect width="960" height="540" class="bg"/>

  <!-- Header -->
  <text x="35" y="36" class="text-title">图 2-1：动作空间表达力与 Token 消耗 / 容错率相图</text>
  <text x="35" y="56" class="text-sub">随着业务逻辑复杂度提升，为什么基于 JSON Schema 的工具调用会遭遇指数级崩溃，而代码动作保持线性平稳？</text>

  <!-- Container -->
  <g transform="translate(35, 75)">
    <rect width="890" height="435" rx="10" class="card-bg"/>

    <!-- Left Chart: Curve Plot -->
    <g transform="translate(30, 25)">
      <rect width="440" height="385" rx="8" fill="#060c1c" stroke="#1e293b"/>
      <text x="16" y="24" class="text-mono" font-weight="700" fill="#38bdf8">任务复杂度 vs Token 消耗趋势 (实测拟合)</text>

      <!-- Axes -->
      <g transform="translate(45, 45)">
        <!-- Y-Axis -->
        <line x1="0" y1="0" x2="0" y2="280" stroke="#334155" stroke-width="1.5"/>
        <text x="-10" y="15" class="text-mono" font-size="9" fill="#94a3b8" text-anchor="end">40k</text>
        <text x="-10" y="85" class="text-mono" font-size="9" fill="#94a3b8" text-anchor="end">25k</text>
        <text x="-10" y="155" class="text-mono" font-size="9" fill="#94a3b8" text-anchor="end">10k</text>
        <text x="-10" y="225" class="text-mono" font-size="9" fill="#94a3b8" text-anchor="end">2k</text>
        <text x="-10" y="280" class="text-mono" font-size="9" fill="#94a3b8" text-anchor="end">0</text>
        <text x="-28" y="140" class="text-mono" font-size="10" fill="#64748b" text-anchor="middle" transform="rotate(-90 -28 140)">Token 消耗量</text>

        <!-- X-Axis -->
        <line x1="0" y1="280" x2="360" y2="280" stroke="#334155" stroke-width="1.5"/>
        <text x="0" y="298" class="text-mono" font-size="9" fill="#94a3b8">简单查表</text>
        <text x="110" y="298" class="text-mono" font-size="9" fill="#94a3b8">过滤+多重汇总</text>
        <text x="240" y="298" class="text-mono" font-size="9" fill="#94a3b8">跨表嵌套关联+分支</text>
        <text x="180" y="316" class="text-mono" font-size="10" fill="#64748b" text-anchor="middle">任务逻辑深度与组合阶数</text>

        <!-- Grid Lines -->
        <line x1="0" y1="70" x2="360" y2="70" stroke="#1e293b" stroke-dasharray="3,3"/>
        <line x1="0" y1="140" x2="360" y2="140" stroke="#1e293b" stroke-dasharray="3,3"/>
        <line x1="0" y1="210" x2="360" y2="210" stroke="#1e293b" stroke-dasharray="3,3"/>

        <!-- Curve 1: Traditional JSON Calling (Red - Exponential explosion) -->
        <path d="M 10 240 Q 120 220, 200 130 T 350 20" fill="none" stroke="#ef4444" stroke-width="2.5"/>
        <circle cx="350" cy="20" r="4" fill="#ef4444"/>
        <text x="345" y="12" class="text-mono" font-weight="700" font-size="10" fill="#ef4444" text-anchor="end">传统 50+ JSON Schema (指数级膨胀与失控)</text>

        <!-- Curve 2: ReAct Raw Text (Orange) -->
        <path d="M 10 245 Q 120 225, 220 170 T 350 90" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,2"/>
        <circle cx="350" cy="90" r="3.5" fill="#f59e0b"/>
        <text x="345" y="82" class="text-mono" font-size="9" fill="#f59e0b" text-anchor="end">纯文本 ReAct (容易出现解析死锁)</text>

        <!-- Curve 3: Code as Action (Green - Flat Linear) -->
        <path d="M 10 260 L 120 252 L 240 242 L 350 230" fill="none" stroke="#10b981" stroke-width="2.5"/>
        <circle cx="350" cy="230" r="4" fill="#10b981"/>
        <text x="345" y="222" class="text-mono" font-weight="700" font-size="10" fill="#34d399" text-anchor="end">Code-as-Action (几乎平坦的 Token 开销)</text>
      </g>
    </g>

    <!-- Right Side: Comparison Table / Matrix -->
    <g transform="translate(490, 25)">
      <rect width="375" height="385" rx="8" fill="#060c1c" stroke="#1e293b"/>
      <text x="16" y="24" class="text-mono" font-weight="700" fill="#10b981">四维架构硬指标实测对比</text>

      <g transform="translate(14, 40)">
        <!-- Metric 1: Expressive Power -->
        <rect width="347" height="74" rx="4" fill="#0b172d" stroke="#1e293b"/>
        <text x="12" y="18" class="text-mono" font-weight="700" fill="#38bdf8">1. 动作空间表达力 (Expressive Power)</text>
        <text x="12" y="36" class="text-body" fill="#94a3b8">• JSON Tool：仅支持一阶函数调用，无法原生表达循环与条件</text>
        <text x="12" y="54" class="text-body" fill="#a7f3d0">• Code Action：图灵完备！直接支持 `for`, `try/except`, 管道与递归</text>

        <!-- Metric 2: Token Tax -->
        <g transform="translate(0, 84)">
          <rect width="347" height="74" rx="4" fill="#0b172d" stroke="#1e293b"/>
          <text x="12" y="18" class="text-mono" font-weight="700" fill="#f59e0b">2. 上下文与网络税 (Context &amp; Network Tax)</text>
          <text x="12" y="36" class="text-body" fill="#94a3b8">• JSON Tool：50 个 Schema 永久吃掉 8k 上下文；中间结果必须进 Context</text>
          <text x="12" y="54" class="text-body" fill="#a7f3d0">• Code Action：仅注入 1 个 REPL 工具定义；中间数据全部留存沙盒内存</text>
        </g>

        <!-- Metric 3: Error Recovery -->
        <g transform="translate(0, 168)">
          <rect width="347" height="74" rx="4" fill="#0b172d" stroke="#1e293b"/>
          <text x="12" y="18" class="text-mono" font-weight="700" fill="#f87171">3. 异常纠错与自愈成本 (Self-Correction)</text>
          <text x="12" y="36" class="text-body" fill="#94a3b8">• JSON Tool：参数校验失败只能抛出字符串，模型经常在同类错误打转</text>
          <text x="12" y="54" class="text-body" fill="#a7f3d0">• Code Action：Traceback 堆栈精准指出具体行号与类型，自修复成功率 92%</text>
        </g>

        <!-- Metric 4: Bottom Line -->
        <g transform="translate(0, 252)">
          <rect width="347" height="74" rx="4" fill="#063523" stroke="#10b981"/>
          <text x="12" y="18" class="text-mono" font-weight="700" fill="#6ee7b7">4. 工业级结论 (Industrial Consensus)</text>
          <text x="12" y="36" class="text-body" fill="#f8fafc">在计算密集、长列表过滤、跨数据源拼装场景中：</text>
          <text x="12" y="54" class="text-body" fill="#34d399">Code-as-Action 的能效比与确定性比 JSON 提升 5 ~ 10 倍！</text>
        </g>
      </g>
    </g>
  </g>
</svg>