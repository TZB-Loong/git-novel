<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#0a1324"/>
    </linearGradient>
    <linearGradient id="barNew" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="barOld" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="960" height="380" fill="url(#bg6)"/>
  <text x="36" y="44" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#e2e8f0">单位任务成本：Opus 5.5 相对 Opus 5</text>
  <text x="36" y="70" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#7c8fa6">Anthropic 自报数据；基准为 SWE-bench Pro 的一个子集，不能与公开榜单直接比较</text>

  <!-- axes -->
  <line x1="120" y1="290" x2="900" y2="290" stroke="#2b3d5c" stroke-width="2"/>
  <line x1="120" y1="100" x2="120" y2="290" stroke="#2b3d5c" stroke-width="2"/>
  <g stroke="#1c2a42" stroke-width="1">
    <line x1="120" y1="100" x2="900" y2="100"/>
    <line x1="120" y1="164" x2="900" y2="164"/>
    <line x1="120" y1="228" x2="900" y2="228"/>
  </g>
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#5f7089">
    <text x="98" y="104" text-anchor="end">100%</text>
    <text x="98" y="168" text-anchor="end">60%</text>
    <text x="98" y="232" text-anchor="end">30%</text>
    <text x="98" y="294" text-anchor="end">0</text>
  </g>

  <!-- group 1 -->
  <rect x="246" y="100" width="62" height="190" rx="4" fill="url(#barOld)"/>
  <rect x="326" y="248" width="62" height="42" rx="4" fill="url(#barNew)"/>
  <text x="277" y="90" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8">100%</text>
  <text x="357" y="238" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#67e8f9">22%</text>
  <text x="317" y="314" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">长周期编程任务</text>
  <rect x="250" y="322" width="66" height="18" rx="4" fill="#334155"/>
  <text x="283" y="335" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#cbd5e1">Opus 5</text>
  <rect x="326" y="322" width="66" height="18" rx="4" fill="#0e7490"/>
  <text x="359" y="335" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#e0f2fe">Opus 5.5</text>

  <!-- delta 1 -->
  <rect x="410" y="176" width="74" height="30" rx="8" fill="#0a241c" stroke="#10b981"/>
  <text x="447" y="196" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" fill="#34d399">-78%</text>

  <!-- group 2 -->
  <rect x="600" y="100" width="62" height="190" rx="4" fill="url(#barOld)"/>
  <rect x="680" y="176" width="62" height="114" rx="4" fill="url(#barNew)"/>
  <text x="631" y="90" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8">100%</text>
  <text x="711" y="166" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#67e8f9">60%</text>
  <text x="671" y="314" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">典型工作负载</text>
  <rect x="604" y="322" width="66" height="18" rx="4" fill="#334155"/>
  <text x="637" y="335" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#cbd5e1">Opus 5</text>
  <rect x="680" y="322" width="66" height="18" rx="4" fill="#0e7490"/>
  <text x="713" y="335" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#e0f2fe">Opus 5.5</text>

  <!-- delta 2 -->
  <rect x="764" y="216" width="74" height="30" rx="8" fill="#0a241c" stroke="#10b981"/>
  <text x="801" y="236" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" fill="#34d399">-40%</text>

  <!-- footnote -->
  <text x="36" y="366" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b">读法：同样做对一道题，谁更便宜；不是「谁更聪明」。常驻带来的运行次数放大，可能抵消单价下降。</text>
</svg>
