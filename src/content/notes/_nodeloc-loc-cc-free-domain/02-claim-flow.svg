<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#080812"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="1" stroke-opacity="0.45"/></pattern>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)"/><rect width="1200" height="660" fill="url(#grid)"/>
  <rect x="50" y="45" width="1100" height="570" rx="20" fill="none" stroke="#2e384d" stroke-width="2" stroke-dasharray="10,6"/>

  <rect x="88" y="78" width="286" height="34" rx="8" fill="#1e2433" stroke="#475569"/><circle cx="108" cy="95" r="5" fill="#38bdf8"/>
  <text x="122" y="101" font-family="monospace" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">CHECKOUT / AMOUNT FLOW</text>
  <text x="88" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="800" fill="#f8fafc">领取链路：七步，零支出</text>
  <text x="88" y="196" font-family="-apple-system,'PingFang SC',sans-serif" font-size="16" fill="#94a3b8">全程未绑定任何支付方式；金额在结算页被优惠码全额抹平，实付 NL0.00。</text>

  <!-- step chips -->
  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
    <rect x="88" y="222" width="132" height="52" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="243" font-family="monospace" font-size="11" fill="#38bdf8">01</text><text x="100" y="262" fill="#e2e8f0">Google OAuth</text>
    <line x1="220" y1="248" x2="244" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="246" y="222" width="132" height="52" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="258" y="243" font-family="monospace" font-size="11" fill="#38bdf8">02</text><text x="258" y="262" fill="#e2e8f0">控制台 0 / 2</text>
    <line x1="378" y1="248" x2="402" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="404" y="222" width="132" height="52" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="416" y="243" font-family="monospace" font-size="11" fill="#38bdf8">03</text><text x="416" y="262" fill="#e2e8f0">查名 git-novel</text>
    <line x1="536" y1="248" x2="560" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="562" y="222" width="132" height="52" rx="9" fill="#1a1206" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="574" y="243" font-family="monospace" font-size="11" fill="#f59e0b">04</text><text x="574" y="262" fill="#fcd34d">勾「终身注册」</text>
    <line x1="694" y1="248" x2="718" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="720" y="222" width="132" height="52" rx="9" fill="#1a1206" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="732" y="243" font-family="monospace" font-size="11" fill="#f59e0b">05</text><text x="732" y="262" fill="#fcd34d">应用优惠码</text>
    <line x1="852" y1="248" x2="876" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="878" y="222" width="132" height="52" rx="9" fill="#0c1a17" stroke="#34d399" stroke-width="1.5"/>
    <text x="890" y="243" font-family="monospace" font-size="11" fill="#34d399">06</text><text x="890" y="262" fill="#d1fae5">创建订单</text>
    <line x1="1010" y1="248" x2="1034" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="1036" y="222" width="76" height="52" rx="9" fill="#0c1a17" stroke="#34d399" stroke-width="1.5"/>
    <text x="1048" y="243" font-family="monospace" font-size="11" fill="#34d399">07</text><text x="1048" y="262" fill="#d1fae5">生效</text>
  </g>

  <!-- amount flow -->
  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="88" y="316" width="1112" height="150" rx="14" fill="#101018" stroke="#2e384d"/>
    <text x="112" y="348" font-family="monospace" font-size="12" font-weight="700" fill="#64748b">结算页金额流转 / 同一次下单</text>

    <rect x="112" y="366" width="220" height="76" rx="10" fill="#0f172a" stroke="#38bdf8"/>
    <text x="130" y="392" font-size="13" fill="#94a3b8">1 年标价（默认）</text>
    <text x="130" y="422" font-size="22" font-weight="800" fill="#e2e8f0">NL100.00</text>

    <line x1="332" y1="404" x2="368" y2="404" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>
    <text x="336" y="396" font-family="monospace" font-size="11" fill="#f59e0b">勾终身</text>

    <rect x="374" y="366" width="240" height="76" rx="10" fill="#1a1206" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="392" y="392" font-size="13" fill="#94a3b8">终身注册 · 原价</text>
    <text x="392" y="422" font-size="22" font-weight="800" fill="#fcd34d">NL1000.00</text>

    <line x1="614" y1="404" x2="650" y2="404" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>
    <text x="608" y="396" font-family="monospace" font-size="11" fill="#38bdf8">FREENOV2026</text>

    <rect x="656" y="366" width="240" height="76" rx="10" fill="#0f172a" stroke="#38bdf8"/>
    <text x="674" y="392" font-size="13" fill="#94a3b8">优惠</text>
    <text x="674" y="422" font-size="22" font-weight="800" fill="#7dd3fc">− NL1000.00</text>

    <line x1="896" y1="404" x2="932" y2="404" stroke="#34d399" stroke-width="2" marker-end="url(#arw)"/>

    <rect x="938" y="356" width="238" height="96" rx="10" fill="#0c1a17" stroke="#34d399" stroke-width="2"/>
    <text x="956" y="382" font-size="13" fill="#94a3b8">合计 · 一次性付款 · 实付</text>
    <text x="956" y="420" font-size="30" font-weight="800" fill="#34d399">NL0.00</text>
    <text x="956" y="440" font-size="12" fill="#64748b">未绑定支付方式</text>
  </g>

  <!-- receipt -->
  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="88" y="486" width="540" height="106" rx="12" fill="#0c1a17" stroke="#34d399" stroke-width="1.5"/>
    <text x="110" y="514" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">控制台回执 / OBSERVED</text>
    <text x="110" y="542" font-size="14" fill="#d1fae5">状态「正常 / 已同步」· 领取于 2026/11/16</text>
    <text x="110" y="566" font-size="14" fill="#d1fae5">显示到期 2126/11/16 · DNS 记录 0 条 · 用量 1 / 2</text>

    <rect x="656" y="486" width="544" height="106" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="678" y="514" font-family="monospace" font-size="12" font-weight="700" fill="#ef4444">但「终身」不是合同期限</text>
    <text x="678" y="542" font-size="14" fill="#fca5a5">2126 只是系统给「终身」填的 100 年数字；</text>
    <text x="678" y="566" font-size="14" fill="#fca5a5">条款里是可撤回的使用权，见下图。</text>
  </g>
</svg>
