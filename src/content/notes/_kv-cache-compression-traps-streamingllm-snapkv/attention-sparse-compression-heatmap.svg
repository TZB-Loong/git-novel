<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460">
  <defs>
    <style>
      .bg { fill: #040813; rx: 14; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 15px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f1f5f9; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
      .matrix-border { stroke: #334155; stroke-width: 1.5; fill: #0b1324; }
      .grid-line { stroke: #1e293b; stroke-width: 0.8; }
    </style>
    <linearGradient id="heatFull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="920" height="460" class="bg"/>

  <!-- Header -->
  <text x="40" y="38" class="text-title">图 2-1：三种注意力机制的 KV Cache 保留策略与注意力矩阵拓扑对比</text>
  <text x="40" y="60" class="text-sub">Full Attention 完整保留因果历史；StreamingLLM 物理驱逐中段历史；SnapKV 基于观察窗口聚类提取关键块</text>

  <!-- Panel 1: Full Attention -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="265" height="340" rx="10" fill="#090f1d" stroke="#1e293b" stroke-width="1.2"/>
    <text x="18" y="26" class="text-card-title">1. Full Attention (全量保留)</text>
    <text x="18" y="44" class="text-mono" fill="#38bdf8">Tokens: 64k 全量 | 显存: 3.58 GB</text>

    <!-- Matrix View (180x180) -->
    <g transform="translate(42, 60)">
      <rect x="0" y="0" width="180" height="180" class="matrix-border"/>
      <!-- Lower triangular full heat fill -->
      <path d="M 0 0 L 180 180 L 0 180 Z" fill="url(#heatFull)" opacity="0.85"/>
      <!-- Grid lines -->
      <line x1="0" y1="45" x2="180" y2="45" class="grid-line"/>
      <line x1="0" y1="90" x2="180" y2="90" class="grid-line"/>
      <line x1="0" y1="135" x2="180" y2="135" class="grid-line"/>
      <line x1="45" y1="0" x2="45" y2="180" class="grid-line"/>
      <line x1="90" y1="0" x2="90" y2="180" class="grid-line"/>
      <line x1="135" y1="0" x2="135" y2="180" class="grid-line"/>

      <!-- Needle Position Indicator -->
      <circle cx="90" cy="140" r="5" fill="#facc15" stroke="#ffffff" stroke-width="1.5"/>
      <text x="100" y="144" class="text-mono" font-weight="700" fill="#facc15">Needle (50%)</text>
    </g>

    <!-- Description -->
    <rect x="15" y="255" width="235" height="70" rx="6" fill="#040813" stroke="#1e293b"/>
    <text x="24" y="274" class="text-mono" fill="#10b981">✓ 大海捞针召回率: 100% (PASS)</text>
    <text x="24" y="292" class="text-mono" fill="#f87171">✗ 64k 解码吞吐: 1.01 tok/s</text>
    <text x="24" y="310" class="text-mono" fill="#94a3b8">计算/搬运复杂度: O(N²) / O(N)</text>
  </g>

  <!-- Panel 2: StreamingLLM (Attention Sink + Sliding Window) -->
  <g transform="translate(325, 85)">
    <rect x="0" y="0" width="265" height="340" rx="10" fill="#090f1d" stroke="#1e293b" stroke-width="1.2"/>
    <text x="18" y="26" class="text-card-title">2. StreamingLLM (Sink + Window)</text>
    <text x="18" y="44" class="text-mono" fill="#f59e0b">Tokens: 4 Sink + 1024 Window | 56 MB</text>

    <!-- Matrix View (180x180) -->
    <g transform="translate(42, 60)">
      <rect x="0" y="0" width="180" height="180" class="matrix-border"/>
      
      <!-- Attention Sink Band (Left 14px) -->
      <rect x="0" y="0" width="14" height="180" fill="#f59e0b" opacity="0.85"/>
      <text x="4" y="-6" class="text-mono" font-size="9" fill="#f59e0b">Sink (4)</text>

      <!-- Evicted Empty Zone -->
      <rect x="14" y="0" width="126" height="180" fill="#020617"/>
      <line x1="20" y1="30" x2="130" y2="150" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
      <text x="35" y="95" class="text-mono" font-weight="700" fill="#ef4444">物理驱逐盲区</text>
      <text x="28" y="110" class="text-mono" font-size="9" fill="#94a3b8">(丢弃 98.4% 历史 KV)</text>

      <!-- Local Sliding Window (Right-most band along diagonal) -->
      <polygon points="140,140 180,140 180,180 140,180" fill="#10b981" opacity="0.8"/>
      <text x="110" y="175" class="text-mono" font-size="9" fill="#10b981">Window</text>

      <!-- Needle Position Lost -->
      <circle cx="90" cy="140" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="83" y1="133" x2="97" y2="147" stroke="#ffffff" stroke-width="1.5"/>
      <text x="45" y="132" class="text-mono" font-weight="700" fill="#ef4444">Needle 丢失</text>
    </g>

    <!-- Description -->
    <rect x="15" y="255" width="235" height="70" rx="6" fill="#040813" stroke="#1e293b"/>
    <text x="24" y="274" class="text-mono" fill="#ef4444">✗ 大海捞针召回率: 0% (FAIL)</text>
    <text x="24" y="292" class="text-mono" fill="#10b981">✓ 64k 解码吞吐: 13.42 tok/s</text>
    <text x="24" y="310" class="text-mono" fill="#94a3b8">无限流式生成，但无长程事实记忆</text>
  </g>

  <!-- Panel 3: SnapKV (Clustering & Observation Window) -->
  <g transform="translate(610, 85)">
    <rect x="0" y="0" width="270" height="340" rx="10" fill="#090f1d" stroke="#334155" stroke-width="1.2"/>
    <text x="18" y="26" class="text-card-title">3. SnapKV (聚类压缩)</text>
    <text x="18" y="44" class="text-mono" fill="#a855f7">Tokens: 64k → 1,088 关键块 | 59.5 MB</text>

    <!-- Matrix View (180x180) -->
    <g transform="translate(45, 60)">
      <rect x="0" y="0" width="180" height="180" class="matrix-border"/>

      <!-- Sparse Selected Key Columns (Clustered) -->
      <rect x="0" y="0" width="12" height="180" fill="#f59e0b" opacity="0.85"/>
      <rect x="35" y="35" width="10" height="145" fill="#8b5cf6" opacity="0.75"/>
      <rect x="70" y="70" width="8" height="110" fill="#8b5cf6" opacity="0.75"/>
      <rect x="110" y="110" width="12" height="70" fill="#8b5cf6" opacity="0.75"/>

      <!-- Observation Window at Bottom-Right -->
      <rect x="145" y="145" width="35" height="35" fill="#06b6d4" opacity="0.8"/>
      <text x="145" y="138" class="text-mono" font-size="9" fill="#06b6d4">观察窗口</text>

      <!-- Empty Pruned Areas -->
      <text x="48" y="60" class="text-mono" font-size="9" fill="#64748b">池化裁剪区</text>

      <!-- Needle Position Dropped due to non-clustered attention -->
      <circle cx="90" cy="135" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="90" y1="130" x2="90" y2="100" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="90" y="94" text-anchor="middle" class="text-mono" font-size="9" font-weight="700" fill="#ef4444">未入选 Top-K (Needle 丢失)</text>
    </g>

    <!-- Description -->
    <rect x="15" y="255" width="240" height="70" rx="6" fill="#040813" stroke="#1e293b"/>
    <text x="24" y="274" class="text-mono" fill="#ef4444">✗ 实测特定大海捞针: 0% (FAIL)</text>
    <text x="24" y="292" class="text-mono" fill="#10b981">✓ 64k 解码吞吐: 13.83 tok/s</text>
    <text x="24" y="310" class="text-mono" fill="#94a3b8">适用于高自相似性语言，弱于孤立稀疏事实</text>
  </g>
</svg>
