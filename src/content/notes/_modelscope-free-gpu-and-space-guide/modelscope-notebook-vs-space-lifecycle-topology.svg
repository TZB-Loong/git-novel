<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <linearGradient id="bgGradMs1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="boxNotebook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="boxSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818CF8" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2DD4BF" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="url(#bgGradMs1)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(35, 25)">
    <rect width="180" height="24" rx="4" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#818CF8">DUAL-ENVIRONMENT</text>
    <text x="195" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">魔搭 Notebook（交互式研发）与 创空间（应用托管）双轨拓扑</text>
  </g>

  <!-- Left: Notebook Container -->
  <g transform="translate(35, 65)">
    <rect width="420" height="275" rx="10" fill="url(#boxNotebook)" stroke="#6366F1" stroke-width="1.5" />
    <!-- Tag -->
    <rect x="20" y="15" width="220" height="22" rx="4" fill="#4338CA" />
    <text x="28" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E0E7FF">环境 A：交互式 Notebook (GPU 算力机)</text>

    <!-- Node 1: Compute Card -->
    <g transform="translate(20, 50)">
      <rect width="380" height="55" rx="6" fill="#111827" stroke="#312E81" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#A5B4FC">算力资源：每月 36h 免费加速卡</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#C7D2FE">· 规格：NVIDIA T4 (16GB) / A10 (24GB 显存)</text>
    </g>

    <!-- Node 2: Storage Architecture -->
    <g transform="translate(20, 115)">
      <rect width="380" height="55" rx="6" fill="#111827" stroke="#312E81" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#A5B4FC">存储体系：/mnt/workspace (持久化)</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#C7D2FE">· 关键：实例关闭后 /mnt/workspace 保留，/root/ 重置</text>
    </g>

    <!-- Node 3: Network Constraint -->
    <g transform="translate(20, 180)">
      <rect width="380" height="75" rx="6" fill="#2E1015" stroke="#991B1B" stroke-width="1" />
      <text x="15" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">网络与生命周期铁律（避坑死穴）：</text>
      <text x="15" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#FEE2E2">· 4 小时无代码交互自动进入休眠（停止扣除 36h 额度）</text>
      <text x="15" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#FCA5A5">· 无公网入站 IP / 端口映射，严禁当常驻生产 Web 服务器！</text>
    </g>
  </g>

  <!-- Right: Spaces Container -->
  <g transform="translate(505, 65)">
    <rect width="420" height="275" rx="10" fill="url(#boxSpace)" stroke="#10B981" stroke-width="1.5" />
    <!-- Tag -->
    <rect x="20" y="15" width="220" height="22" rx="4" fill="#047857" />
    <text x="28" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#D1FAE5">环境 B：创空间 Spaces (服务托管平台)</text>

    <!-- Node 1: Hosting Lifetime -->
    <g transform="translate(20, 50)">
      <rect width="380" height="55" rx="6" fill="#111827" stroke="#065F46" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#6EE7B7">服务托管：7 × 24 小时常驻运行</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#A7F3D0">· 资源：免费 CPU 实例持续在线，支持轻量应用</text>
    </g>

    <!-- Node 2: Ingress & Domain -->
    <g transform="translate(20, 115)">
      <rect width="380" height="55" rx="6" fill="#111827" stroke="#065F46" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#6EE7B7">公网访问：官方二级域名暴露</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#A7F3D0">· 访问地址：https://modelscope.cn/studios/{user}/{repo}</text>
    </g>

    <!-- Node 3: Deployment Frameworks -->
    <g transform="translate(20, 180)">
      <rect width="380" height="75" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <text x="15" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7">推荐应用落地场景：</text>
      <text x="15" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#D1FAE5">· Gradio / Streamlit 演示 UI、企业轻量知识库前端</text>
      <text x="15" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#A7F3D0">· 搭配免费 Serverless 推理 API 实现 0 显卡成本大模型问答</text>
    </g>
  </g>

  <!-- Middle Connection Pipe: Hub Push & Pull -->
  <g transform="translate(435, 170)">
    <!-- Arrow Notebook -> Space -->
    <path d="M20,0 H50" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow-indigo)" />
    <!-- Model Hub Center Circle -->
    <circle cx="35" cy="0" r="16" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5" />
    <text x="35" y="4" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#C7D2FE">HUB</text>
  </g>

  <!-- Bottom Workflow Matrix -->
  <g transform="translate(35, 360)">
    <rect width="890" height="135" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2" />
    <!-- Header -->
    <path d="M0,8 Q0,0 8,0 H882 Q890,0 890,8 V32 H0 Z" fill="#1E293B" />
    <text x="20" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">双轨分工矩阵</text>
    <text x="180" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#818CF8">Notebook (算力生产中心)</text>
    <text x="540" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34D399">创空间 Spaces (服务消费端)</text>

    <!-- Row 1 -->
    <line x1="0" y1="32" x2="890" y2="32" stroke="#334155" stroke-width="1" />
    <text x="20" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">核心职责</text>
    <text x="180" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#C7D2FE">拉取千亿模型分片、LoRA 微调、GGUF/AWQ 量化蒸馏</text>
    <text x="540" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#A7F3D0">加载量化模型、提供 Web 界面、对外提供 API 路由</text>

    <!-- Row 2 -->
    <line x1="0" y1="66" x2="890" y2="66" stroke="#334155" stroke-width="1" />
    <text x="20" y="86" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">公网暴露能力</text>
    <text x="180" y="86" font-family="-apple-system, sans-serif" font-size="11" fill="#F87171">无原生公网入口（仅限开发控制台 SSH/Jupyter 访问）</text>
    <text x="540" y="86" font-family="-apple-system, sans-serif" font-size="11" fill="#34D399">自带 HTTPS 域名，支持嵌入 Iframe 与外部直链访问</text>

    <!-- Row 3 -->
    <line x1="0" y1="100" x2="890" y2="100" stroke="#334155" stroke-width="1" />
    <text x="20" y="120" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">数据持久化机制</text>
    <text x="180" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#38BDF8">保存在 `/mnt/workspace/` 目录，关机不丢数据</text>
    <text x="540" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#34D399">基于 Git 代码仓库构建，版本强受控与自动持续构建</text>
  </g>
</svg>