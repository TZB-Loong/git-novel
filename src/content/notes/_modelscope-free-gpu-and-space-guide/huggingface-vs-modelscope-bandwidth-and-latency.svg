<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <linearGradient id="bgGradMs2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="gradOverseas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1217" />
      <stop offset="100%" stop-color="#170A0D" />
    </linearGradient>
    <linearGradient id="gradModelScope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="100%" stop-color="#081A1C" />
    </linearGradient>
    <marker id="arrow-red-ms" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-teal-ms" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#14B8A6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="url(#bgGradMs2)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(35, 25)">
    <rect width="180" height="24" rx="4" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#818CF8">BANDWIDTH BENCHMARK</text>
    <text x="195" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">海外 Hugging Face 直连 vs 阿里内网 ModelScope 带宽与稳定性实测</text>
  </g>

  <!-- Section 1: Overseas HF Direct (Bad) -->
  <g transform="translate(35, 65)">
    <rect width="890" height="175" rx="10" fill="url(#gradOverseas)" stroke="#991B1B" stroke-width="1.5" />
    <!-- Tag -->
    <rect x="20" y="15" width="240" height="22" rx="4" fill="#7F1D1D" />
    <text x="28" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FEE2E2">传统痛点：公网跨海直连 HuggingFace Hub</text>

    <!-- Pipeline nodes -->
    <rect x="20" y="55" width="130" height="50" rx="6" fill="#18181B" stroke="#52525B" stroke-width="1" />
    <text x="32" y="76" font-family="monospace" font-size="11" font-weight="700" fill="#F43F5E">本地/国内环境</text>
    <text x="32" y="93" font-family="-apple-system, sans-serif" font-size="10" fill="#A1A1AA">transformers 拉取</text>

    <path d="M150,80 H185" stroke="#EF4444" stroke-width="1.8" marker-end="url(#arrow-red-ms)" />

    <rect x="195" y="55" width="160" height="50" rx="6" fill="#18181B" stroke="#EF4444" stroke-width="1.2" />
    <text x="207" y="75" font-family="monospace" font-size="11" font-weight="700" fill="#FCA5A5">国际跨境骨干出口</text>
    <text x="207" y="92" font-family="-apple-system, sans-serif" font-size="10" fill="#F87171">丢包率 15% · 延迟 280ms</text>

    <path d="M355,80 H390" stroke="#EF4444" stroke-width="1.8" marker-end="url(#arrow-red-ms)" />

    <rect x="400" y="55" width="180" height="50" rx="6" fill="#18181B" stroke="#EF4444" stroke-width="1.2" />
    <text x="412" y="75" font-family="monospace" font-size="11" font-weight="700" fill="#FCA5A5">海外 CDN 节点 (Cloudflare)</text>
    <text x="412" y="92" font-family="-apple-system, sans-serif" font-size="10" fill="#F87171">频遭 DNS 污染 / TCP 重置</text>

    <path d="M580,80 H615" stroke="#EF4444" stroke-width="1.8" marker-end="url(#arrow-red-ms)" />

    <rect x="625" y="55" width="115" height="50" rx="6" fill="#18181B" stroke="#52525B" stroke-width="1" />
    <text x="637" y="76" font-family="monospace" font-size="11" font-weight="700" fill="#CBD5E1">HF S3 存储桶</text>
    <text x="637" y="93" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">大文件分片中断</text>

    <!-- Stat block -->
    <rect x="755" y="45" width="120" height="115" rx="6" fill="#450A0A" stroke="#DC2626" stroke-width="1" />
    <text x="768" y="70" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">实测下载指标</text>
    <text x="768" y="92" font-family="monospace" font-size="11" fill="#FEE2E2">速度: 0.8 MB/s</text>
    <text x="768" y="112" font-family="monospace" font-size="11" fill="#FEE2E2">15GB: 5.2 小时</text>
    <text x="768" y="138" font-family="monospace" font-size="12" font-weight="800" fill="#EF4444">失败率 74%</text>

    <text x="20" y="132" font-family="-apple-system, sans-serif" font-size="11" fill="#FCA5A5">
      致命影响：长时间占用宝贵的 GPU 挂钟时间下载权重，容易在第 90% 进度时直接抛出 ReadTimeout 导致前功尽弃。
    </text>
    <text x="20" y="152" font-family="monospace" font-size="10" fill="#9CA3AF">
      Code: AutoModel.from_pretrained("Qwen/Qwen2.5-7B-Instruct") # 极易超时崩溃
    </text>
  </g>

  <!-- Section 2: ModelScope OSS (Optimized) -->
  <g transform="translate(35, 255)">
    <rect width="890" height="195" rx="10" fill="url(#gradModelScope)" stroke="#0D9488" stroke-width="1.5" />
    <!-- Tag -->
    <rect x="20" y="15" width="260" height="22" rx="4" fill="#0F766E" />
    <text x="28" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#CCFBF1">极致加速：阿里魔搭内网 OSS 极速直连</text>

    <!-- Pipeline nodes -->
    <rect x="20" y="55" width="180" height="55" rx="6" fill="#134E4A" stroke="#14B8A6" stroke-width="1" />
    <text x="32" y="76" font-family="monospace" font-size="11" font-weight="700" fill="#5EEAD4">ModelScope SDK 客户端</text>
    <text x="32" y="94" font-family="-apple-system, sans-serif" font-size="10" fill="#99F6E4">多线程分片并发流</text>

    <path d="M200,82 H235" stroke="#14B8A6" stroke-width="1.8" marker-end="url(#arrow-teal-ms)" />

    <rect x="245" y="55" width="235" height="55" rx="6" fill="#134E4A" stroke="#14B8A6" stroke-width="1.2" />
    <text x="257" y="75" font-family="monospace" font-size="11" font-weight="700" fill="#5EEAD4">阿里云专属骨干内网 / BGP 高速通道</text>
    <text x="257" y="93" font-family="-apple-system, sans-serif" font-size="10" fill="#CCFBF1">零丢包 · 毫秒级寻址 · 延迟 &lt; 15ms</text>

    <path d="M480,82 H515" stroke="#14B8A6" stroke-width="1.8" marker-end="url(#arrow-teal-ms)" />

    <rect x="525" y="55" width="215" height="55" rx="6" fill="#134E4A" stroke="#14B8A6" stroke-width="1" />
    <text x="537" y="76" font-family="monospace" font-size="11" font-weight="700" fill="#5EEAD4">ModelScope 官方 OSS 仓库</text>
    <text x="537" y="94" font-family="-apple-system, sans-serif" font-size="10" fill="#99F6E4">国内原厂官方镜像同步源</text>

    <!-- Stat block -->
    <rect x="755" y="45" width="120" height="135" rx="6" fill="#115E59" stroke="#14B8A6" stroke-width="1" />
    <text x="768" y="70" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#A7F3D0">实测提速指标</text>
    <text x="768" y="92" font-family="monospace" font-size="11" fill="#CCFBF1">速度: 195 MB/s</text>
    <text x="768" y="112" font-family="monospace" font-size="11" fill="#CCFBF1">15GB: 1 分 17 秒</text>
    <text x="768" y="137" font-family="monospace" font-size="12" font-weight="800" fill="#2DD4BF">提速 240x ↑</text>
    <text x="768" y="160" font-family="monospace" font-size="10" fill="#E6FFFA">稳定率 100%</text>

    <text x="20" y="135" font-family="-apple-system, sans-serif" font-size="11" fill="#A7F3D0">
      实战建议：使用 `modelscope.hub.snapshot_download` 或配置镜像环境变量，在 Notebook 启动前 2 分钟内搞定模型入盘。
    </text>
    <text x="20" y="155" font-family="monospace" font-size="10" fill="#2DD4BF">
      Code: from modelscope import snapshot_download; path = snapshot_download('Qwen/Qwen2.5-7B-Instruct')
    </text>
  </g>

  <!-- Bottom Guidance -->
  <g transform="translate(35, 465)">
    <rect width="890" height="45" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="27" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">
      无缝平替技巧：在任意现有 Python 脚本顶部注入环境变量 <tspan fill="#38BDF8" font-family="monospace">os.environ['HF_ENDPOINT'] = 'https://hf-mirror.com'</tspan>，无需重构任何代码即可享受国内百兆加速。
    </text>
  </g>
</svg>