<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGradEventOH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGradEventOH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="warningGradOH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="successGradOH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadowBoxEvent" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGradEventOH)" rx="12" />

  <!-- Title Area -->
  <g transform="translate(50, 40)">
    <rect width="8" height="28" rx="4" fill="#A855F7" />
    <text x="24" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
      EventStream 状态总线与上下文记忆修剪机制 (Compaction)
    </text>
    <text x="24" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      长任务持续推演 · Action/Observation 异步循环 · 告别 120k Token 爆炸与上下文漂移
    </text>
  </g>

  <!-- Left: Event Loop (Action & Observation Cycle) -->
  <g transform="translate(50, 110)">
    <rect width="360" height="435" rx="14" fill="url(#cardGradEventOH)" stroke="#6366F1" stroke-width="1.5" filter="url(#shadowBoxEvent)" />

    <rect x="20" y="20" width="130" height="26" rx="6" fill="#4F46E5" fill-opacity="0.25" stroke="#6366F1" stroke-width="1" />
    <text x="85" y="38" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">EVENT LOOP</text>
    <text x="165" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">状态驱动事件循环</text>

    <!-- Node 1: Agent LLM Reasoning -->
    <g transform="translate(25, 65)">
      <rect width="310" height="60" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1" />
      <text x="16" y="24" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">1. LLM 核心思考 (Think / Plan)</text>
      <text x="16" y="45" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">基于当前记忆上下文推导下一步行动</text>
    </g>

    <!-- Arrow Down -->
    <path d="M 180 130 L 180 155" stroke="#818CF8" stroke-width="2" />
    <polygon points="180,158 176,150 184,150" fill="#818CF8" />

    <!-- Node 2: Action Emitted -->
    <g transform="translate(25, 160)">
      <rect width="310" height="85" rx="8" fill="#0B132B" stroke="#A855F7" stroke-width="1" />
      <text x="16" y="24" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">2. 发布动作 (Action Emitter)</text>
      <text x="16" y="44" fill="#E2E8F0" font-family="monospace" font-size="11">• CmdRunAction ("pytest tests/test_api.py")</text>
      <text x="16" y="62" fill="#E2E8F0" font-family="monospace" font-size="11">• FileWriteAction ("src/auth.py", diff)</text>
      <text x="16" y="78" fill="#E2E8F0" font-family="monospace" font-size="11">• BrowseURLAction / AgentFinishAction</text>
    </g>

    <!-- Arrow Down -->
    <path d="M 180 250 L 180 275" stroke="#818CF8" stroke-width="2" />
    <polygon points="180,278 176,270 184,270" fill="#818CF8" />

    <!-- Node 3: Observation Captured -->
    <g transform="translate(25, 280)">
      <rect width="310" height="85" rx="8" fill="#0B132B" stroke="#10B981" stroke-width="1" />
      <text x="16" y="24" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">3. 收集环境观测 (Observation Listener)</text>
      <text x="16" y="44" fill="#CBD5E1" font-family="monospace" font-size="11">• CmdOutputObservation (exit_code=1, logs)</text>
      <text x="16" y="62" fill="#CBD5E1" font-family="monospace" font-size="11">• FileReadObservation (line 1-120)</text>
      <text x="16" y="78" fill="#CBD5E1" font-family="monospace" font-size="11">• BrowserOutputObservation (DOM/Error)</text>
    </g>

    <!-- Loop Back Arrow -->
    <path d="M 25 322 L 10 322 L 10 95 L 20 95" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="23,95 16,91 16,99" fill="#6366F1" />
    <text x="16" y="200" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" transform="rotate(-90 16 200)" text-anchor="middle">循环步进 Step++</text>

    <!-- Bottom summary -->
    <g transform="translate(25, 375)">
      <rect width="310" height="45" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="155" y="27" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 危机：步数 &gt; 25 轮时，原始日志膨胀至 120k+</text>
    </g>
  </g>

  <!-- Right: EventStream Compaction Strategy (The Secret Sauce) -->
  <g transform="translate(440, 110)">
    <rect width="510" height="435" rx="14" fill="url(#cardGradEventOH)" stroke="#10B981" stroke-width="1.5" filter="url(#shadowBoxEvent)" />

    <rect x="25" y="20" width="160" height="26" rx="6" fill="#059669" fill-opacity="0.25" stroke="#10B981" stroke-width="1" />
    <text x="105" y="38" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MEMORY COMPACTION</text>
    <text x="195" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">记忆修剪与滑动窗口压缩</text>

    <!-- Section 1: System & Initial Goal (Locked Anchor) -->
    <g transform="translate(25, 65)">
      <rect width="460" height="65" rx="8" fill="#071E1C" stroke="#059669" stroke-width="1" />
      <circle cx="20" cy="22" r="5" fill="#10B981" />
      <text x="32" y="26" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">锚点层 (Root Anchor) · 永不遗忘</text>
      <text x="32" y="48" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">系统底规 (SOUL/Prompt) + 用户初始 Issue/PRD + 目标验收标准 (100% 固化，0 截断)</text>
    </g>

    <!-- Section 2: Middle Steps Compression (The Big Savings) -->
    <g transform="translate(25, 142)">
      <rect width="460" height="145" rx="8" fill="#16192E" stroke="#6366F1" stroke-width="1" />
      <circle cx="20" cy="22" r="5" fill="#818CF8" />
      <text x="32" y="26" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">历史步骤智能折叠 (Middle Steps Compression)</text>

      <g transform="translate(20, 40)">
        <rect width="420" height="28" rx="4" fill="#0F172A" />
        <text x="12" y="19" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
          • <tspan fill="#F43F5E">海量 stdout 截断</tspan>：5000 行 pytest 输出 $\rightarrow$ 仅保留首尾 20 行 + 关键错误回溯
        </text>
      </g>
      <g transform="translate(20, 72)">
        <rect width="420" height="28" rx="4" fill="#0F172A" />
        <text x="12" y="19" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
          • <tspan fill="#FBBF24">失败重试折叠</tspan>：连续 3 次语法微调重试合并为单一压缩摘要事件
        </text>
      </g>
      <g transform="translate(20, 104)">
        <rect width="420" height="28" rx="4" fill="#0F172A" />
        <text x="12" y="19" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
          • <tspan fill="#38BDF8">文件读取去重</tspan>：反复读取同一文件时，旧快照丢弃，仅保留最后一次哈希
        </text>
      </g>
    </g>

    <!-- Section 3: Active High-Fidelity Window -->
    <g transform="translate(25, 298)">
      <rect width="460" height="70" rx="8" fill="#1A1830" stroke="#A855F7" stroke-width="1" />
      <circle cx="20" cy="22" r="5" fill="#C084FC" />
      <text x="32" y="26" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">高保真活跃滑动窗口 (Active Window: N = 5~8 步)</text>
      <text x="32" y="48" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">最近 5 步的原始命令、diff 修改与即时反馈保持完全保真，支撑敏捷推演与即时修正</text>
    </g>

    <!-- Section 4: Budget Stats -->
    <g transform="translate(25, 378)">
      <rect width="460" height="42" rx="6" fill="#052E16" stroke="#10B981" />
      <text x="230" y="26" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        🚀 优化成效：Token 占用从 128,000 压降至 16,500（压缩比 87.1%），单步成本骤降
      </text>
    </g>
  </g>

  <!-- Bottom Indicator -->
  <g transform="translate(50, 560)">
    <text x="0" y="16" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">图 2：OpenHands EventStream 异步事件流与上下文记忆动态修剪架构</text>
  </g>
</svg>