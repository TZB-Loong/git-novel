<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 21px; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #f1f5f9; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="540" rx="14" fill="url(#bg2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="10" y="16" fill="#34d399" class="badge-text">AST PRIVACY FIREWALL</text>
    <text x="175" y="18" class="title">Tree-sitter AST 语法脱敏与双向机密回填工作流</text>
    <text x="0" y="42" class="subtitle">单纯正则规则的致命漏洞 vs 语法树语义提取、熵值计算与无感反向补丁装配</text>
  </g>

  <!-- Flow 1: Outbound Interception & Sanitization (Top Half) -->
  <g transform="translate(40, 85)" filter="url(#shadow2)">
    <rect width="880" height="205" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="30" rx="10" fill="#1e293b"/>
    <text x="16" y="20" fill="#f8fafc" class="box-title">上行脱敏链路（Outbound Traffic: 本地 $\rightarrow$ 云端模型）</text>

    <!-- Node 1: Raw File / Diff -->
    <g transform="translate(18, 42)">
      <rect width="200" height="145" rx="8" fill="#020617" stroke="#dc2626" stroke-width="1.2"/>
      <text x="14" y="24" fill="#f87171" class="code-mono" font-weight="700">原始源码 / .env 差异</text>
      <text x="14" y="48" fill="#94a3b8" class="code-mono">const cfg = {</text>
      <text x="24" y="66" fill="#fca5a5" class="code-mono">key: "sk-live-89x9a..",</text>
      <text x="24" y="84" fill="#fca5a5" class="code-mono">db: "postgres://pwd..",</text>
      <text x="24" y="102" fill="#cbd5e1" class="code-mono">retries: 3</text>
      <text x="14" y="120" fill="#94a3b8" class="code-mono">};</text>
      <text x="14" y="136" fill="#ef4444" class="badge-text">高危数据直接裸奔</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <g stroke="#38bdf8" stroke-width="2" fill="none">
      <path d="M 228 115 L 268 115"/>
      <polygon points="268,111 276,115 268,119" fill="#38bdf8"/>
    </g>

    <!-- Node 2: Tree-sitter & Entropy Engine -->
    <g transform="translate(280, 42)">
      <rect width="280" height="145" rx="8" fill="#090e1a" stroke="#0284c7" stroke-width="1.5"/>
      <text x="14" y="24" fill="#38bdf8" class="code-mono" font-weight="700">AST 解析 + Shannon 熵值检测</text>
      <text x="14" y="46" fill="#94a3b8" class="box-desc">• Tree-sitter 遍历 AST 树节点：</text>
      <text x="24" y="64" fill="#cbd5e1" class="code-mono">Node: string_fragment (值)</text>
      <text x="14" y="82" fill="#94a3b8" class="box-desc">• 计算字元信息熵 $H(X) > 4.6$ bits/char</text>
      <text x="14" y="100" fill="#94a3b8" class="box-desc">• 命中凭证规则（API Token/私钥/密码）</text>
      <rect x="14" y="112" width="250" height="24" rx="4" fill="#082f49"/>
      <text x="22" y="128" fill="#38bdf8" class="code-mono">隔离写入本地内存 Vault 密室</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <g stroke="#10b981" stroke-width="2" fill="none">
      <path d="M 570 115 L 610 115"/>
      <polygon points="610,111 618,115 610,119" fill="#10b981"/>
    </g>

    <!-- Node 3: Sanitized Payload Outbound -->
    <g transform="translate(620, 42)">
      <rect width="240" height="145" rx="8" fill="#020617" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="24" fill="#34d399" class="code-mono" font-weight="700">脱敏后安全负载 (Safe Payload)</text>
      <text x="14" y="48" fill="#94a3b8" class="code-mono">const cfg = {</text>
      <text x="24" y="66" fill="#6ee7b7" class="code-mono">key: "&lt;MAGPIE_SECRET_#1&gt;",</text>
      <text x="24" y="84" fill="#6ee7b7" class="code-mono">db: "&lt;MAGPIE_SECRET_#2&gt;",</text>
      <text x="24" y="102" fill="#cbd5e1" class="code-mono">retries: 3</text>
      <text x="14" y="120" fill="#94a3b8" class="code-mono">};</text>
      <text x="14" y="136" fill="#10b981" class="badge-text">公网模型只能看到抽象占位符</text>
    </g>
  </g>

  <!-- Flow 2: Inbound De-redaction & Patch Recovery (Bottom Half) -->
  <g transform="translate(40, 310)" filter="url(#shadow2)">
    <rect width="880" height="205" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="30" rx="10" fill="#1e293b"/>
    <text x="16" y="20" fill="#f8fafc" class="box-title">下行还原链路（Inbound Traffic: 云端返回补丁 $\rightarrow$ 本地磁盘）</text>

    <!-- Node 4: Model Generated Patch -->
    <g transform="translate(18, 42)">
      <rect width="240" height="145" rx="8" fill="#020617" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="14" y="24" fill="#60a5fa" class="code-mono" font-weight="700">云端模型生成 Git Patch</text>
      <text x="14" y="48" fill="#94a3b8" class="code-mono">@@ -2,3 +2,4 @@</text>
      <text x="14" y="66" fill="#94a3b8" class="code-mono"> const cfg = {</text>
      <text x="24" y="84" fill="#93c5fd" class="code-mono">+ timeout: 5000,</text>
      <text x="24" y="102" fill="#6ee7b7" class="code-mono">  key: "&lt;MAGPIE_SECRET_#1&gt;"</text>
      <text x="14" y="120" fill="#94a3b8" class="code-mono"> };</text>
      <text x="14" y="136" fill="#38bdf8" class="badge-text">补丁中保留了占位符</text>
    </g>

    <!-- Arrow 4 to 5 -->
    <g stroke="#f59e0b" stroke-width="2" fill="none">
      <path d="M 268 115 L 308 115"/>
      <polygon points="308,111 316,115 308,119" fill="#f59e0b"/>
    </g>

    <!-- Node 5: Patch Interceptor & De-redaction -->
    <g transform="translate(320, 42)">
      <rect width="240" height="145" rx="8" fill="#090e1a" stroke="#d97706" stroke-width="1.5"/>
      <text x="14" y="24" fill="#fbbf24" class="code-mono" font-weight="700">逆向回填引擎 (De-redactor)</text>
      <text x="14" y="46" fill="#94a3b8" class="box-desc">• 流式/全量解析 Patch 块</text>
      <text x="14" y="64" fill="#94a3b8" class="box-desc">• 查阅当前会话 Local Vault：</text>
      <text x="24" y="84" fill="#fde68a" class="code-mono">&lt;SECRET_#1&gt; $\rightarrow$ sk-live-89x9a..</text>
      <text x="14" y="104" fill="#94a3b8" class="box-desc">• 保证代码上下文精确对齐，</text>
      <text x="14" y="122" fill="#94a3b8" class="box-desc">  不破坏缩进与字符 Offset</text>
    </g>

    <!-- Arrow 5 to 6 -->
    <g stroke="#10b981" stroke-width="2" fill="none">
      <path d="M 570 115 L 610 115"/>
      <polygon points="610,111 618,115 610,119" fill="#10b981"/>
    </g>

    <!-- Node 6: Local Disk / Git Commit -->
    <g transform="translate(620, 42)">
      <rect width="240" height="145" rx="8" fill="#020617" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="24" fill="#34d399" class="code-mono" font-weight="700">最终安全落盘 (Clean Apply)</text>
      <text x="14" y="48" fill="#94a3b8" class="code-mono">const cfg = {</text>
      <text x="24" y="66" fill="#93c5fd" class="code-mono">  timeout: 5000,</text>
      <text x="24" y="84" fill="#fca5a5" class="code-mono">  key: "sk-live-89x9a..",</text>
      <text x="24" y="102" fill="#cbd5e1" class="code-mono">  retries: 3</text>
      <text x="14" y="120" fill="#94a3b8" class="code-mono">};</text>
      <text x="14" y="136" fill="#10b981" class="badge-text">真实代码完整可用，零泄露</text>
    </g>
  </g>
</svg>