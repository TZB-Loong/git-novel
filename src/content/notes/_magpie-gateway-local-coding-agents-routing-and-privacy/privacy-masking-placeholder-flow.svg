<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <linearGradient id="bgm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060910"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="arm" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="armv" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="url(#bgm)" stroke="#1e293b" stroke-width="1.5"/>

  <g transform="translate(36, 30)">
    <rect x="0" y="0" width="218" height="24" rx="4" fill="#0b2a33" stroke="#0e7490" stroke-width="1"/>
    <text x="10" y="16" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" fill="#67e8f9">PRIVACY MASKING · redact</text>
    <text x="234" y="18" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="800" fill="#f8fafc">脱敏的真实工作流：占位符替换与回填</text>
    <text x="0" y="46" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#94a3b8">默认关闭；打开后是字符串替换，不是语义理解，也不是语法树分析</text>
  </g>

  <!-- row 1: outbound -->
  <g transform="translate(36, 96)">
    <rect x="0" y="0" width="200" height="94" rx="10" fill="#0f1a2c" stroke="#2e4260" stroke-width="1.4"/>
    <text x="16" y="24" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1">① 本地请求</text>
    <text x="16" y="48" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8fa3bd">api_key = "sk-live-…"</text>
    <text x="16" y="66" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8fa3bd">email = "me@corp.com"</text>
    <text x="16" y="84" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#6b8299">值只在内存，不落盘</text>

    <path d="M 204 47 L 240 47" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arm)"/>

    <rect x="244" y="0" width="180" height="94" rx="10" fill="#0b1a2b" stroke="#38bdf8" stroke-width="2"/>
    <text x="334" y="26" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="800" fill="#7dd3fc">② redact 插件</text>
    <text x="334" y="48" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#8fa3bd">密钥 / 个人数据分类替换</text>
    <text x="334" y="66" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#8fa3bd">同一值 → 同一占位符</text>
    <text x="334" y="84" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#67e8f9">Mask / Warn / Block</text>

    <path d="M 428 47 L 464 47" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arm)"/>

    <rect x="468" y="0" width="210" height="94" rx="10" fill="#0a1520" stroke="#1d5c6b" stroke-width="1.4"/>
    <text x="484" y="24" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" fill="#67e8f9">③ 供应商收到</text>
    <text x="484" y="48" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8fa3bd">api_key = "{{API_KEY_…}}"</text>
    <text x="484" y="66" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8fa3bd">email = "{{EMAIL_…}}"</text>
    <text x="484" y="84" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#6b8299">模型看不到原值</text>

    <rect x="700" y="0" width="188" height="94" rx="10" fill="#0a1220" stroke="#3d5068" stroke-width="1.2"/>
    <text x="716" y="24" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="700" fill="#cbd5e1">如果脱敏该跑却跑不了</text>
    <text x="716" y="50" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="800" fill="#fb7185">503</text>
    <text x="716" y="72" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#8fa3bd">请求被拦下，绝不原样发出</text>
  </g>

  <!-- row 2: inbound -->
  <g transform="translate(36, 212)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#0a1520" stroke="#1d5c6b" stroke-width="1.4"/>
    <text x="16" y="24" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" fill="#67e8f9">④ 模型回复</text>
    <text x="16" y="46" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8fa3bd">patch 里含 {{API_KEY_…}}</text>
    <text x="16" y="64" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#6b8299">流式文本也会被扫描</text>

    <path d="M 204 40 L 240 40" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#armv)"/>

    <rect x="244" y="0" width="180" height="80" rx="10" fill="#160f24" stroke="#a78bfa" stroke-width="1.8"/>
    <text x="334" y="26" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="800" fill="#c4b5fd">⑤ 回填</text>
    <text x="334" y="48" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#8fa3bd">占位符换回真值</text>
    <text x="334" y="66" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#c4b5fd">含工具调用参数</text>

    <path d="M 428 40 L 464 40" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#armv)"/>

    <rect x="468" y="0" width="210" height="80" rx="10" fill="#0f1a2c" stroke="#2e4260" stroke-width="1.4"/>
    <text x="484" y="24" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1">⑥ Agent 执行</text>
    <text x="484" y="46" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8fa3bd">api_key = "sk-live-…"</text>
    <text x="484" y="64" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#6b8299">落盘与执行不受影响</text>

    <rect x="700" y="0" width="188" height="80" rx="10" fill="#0a1220" stroke="#3d5068" stroke-width="1.2"/>
    <text x="716" y="24" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="700" fill="#cbd5e1">可核查</text>
    <text x="716" y="46" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#8fa3bd">Insights › Masking</text>
    <text x="716" y="64" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#8fa3bd">逐条对照实际发出内容</text>
  </g>

  <!-- rules -->
  <rect x="36" y="310" width="888" height="88" rx="12" fill="#0d1728" stroke="#2e4260" stroke-width="1.2"/>
  <text x="56" y="336" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" fill="#e2e8f0">规则粒度（官方文档）</text>
  <text x="56" y="360" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b8c9bf">密钥与个人数据各自独立开关；更细类型可单独控制：护照、IBAN、MAC 地址、公网 IP 等。</text>
  <text x="56" y="380" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b8c9bf">支持自定义词与模式；example.com / .test / .invalid 下的示例邮箱保持原样。</text>

  <!-- cost -->
  <rect x="36" y="410" width="888" height="82" rx="12" fill="#1a1408" stroke="#7a5a2f" stroke-width="1.5"/>
  <text x="56" y="436" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" fill="#fbbf24">代价：这是取舍，不是「开了就安全」</text>
  <text x="56" y="460" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#c9b08a">模型看到的是占位符而不是密钥，所以「关于这个值本身」的任务做不了（如排查为什么某个 token 被拒）。</text>
  <text x="56" y="480" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#c9b08a">这类值要放进 Never mask。规则偶尔也会出错，Masking 页面是检查处。</text>
</svg>
