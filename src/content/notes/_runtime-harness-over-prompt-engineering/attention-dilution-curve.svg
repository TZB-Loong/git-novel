<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <style>
      .bg { fill: #030712; rx: 12; }
      .axis { stroke: #334155; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: bold; font-size: 15px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .curve-decay { fill: none; stroke: #38bdf8; stroke-width: 3; }
      .curve-violation { fill: none; stroke: #f43f5e; stroke-width: 3; }
    </style>
    <linearGradient id="glow-rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" class="bg"/>

  <!-- Title & Header -->
  <text x="40" y="42" class="text-title">图 1-1：Softmax 注意力稀释与负向约束失控曲线（实测推导）</text>
  <text x="40" y="65" class="text-sub">随着上下文 $N$ 线性扩张，System Prompt 负向约束（“切勿修改某文件”）的归一化权重呈指数级稀释</text>

  <!-- Coordinate Grid -->
  <g transform="translate(70, 90)">
    <!-- Grid Lines -->
    <line x1="0" y1="40" x2="520" y2="40" class="grid"/>
    <line x1="0" y1="100" x2="520" y2="100" class="grid"/>
    <line x1="0" y1="160" x2="520" y2="160" class="grid"/>
    <line x1="0" y1="220" x2="520" y2="220" class="grid"/>

    <line x1="130" y1="0" x2="130" y2="240" class="grid"/>
    <line x1="260" y1="0" x2="260" y2="240" class="grid"/>
    <line x1="390" y1="0" x2="390" y2="240" class="grid"/>
    <line x1="520" y1="0" x2="520" y2="240" class="grid"/>

    <!-- Axes -->
    <line x1="0" y1="240" x2="540" y2="240" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="240" class="axis"/>

    <!-- Y labels -->
    <text x="-15" y="10" text-anchor="end" class="text-label">100%</text>
    <text x="-15" y="70" text-anchor="end" class="text-label">75%</text>
    <text x="-15" y="130" text-anchor="end" class="text-label">50%</text>
    <text x="-15" y="190" text-anchor="end" class="text-label">25%</text>
    <text x="-15" y="245" text-anchor="end" class="text-label">0%</text>

    <!-- X labels -->
    <text x="0" y="260" text-anchor="middle" class="text-label">4k</text>
    <text x="130" y="260" text-anchor="middle" class="text-label">32k</text>
    <text x="260" y="260" text-anchor="middle" class="text-label">64k (失控临界点)</text>
    <text x="390" y="260" text-anchor="middle" class="text-label">128k</text>
    <text x="520" y="260" text-anchor="middle" class="text-label">256k</text>
    <text x="260" y="285" text-anchor="middle" class="text-label" fill="#94a3b8">上下文窗口大小 (Tokens)</text>

    <!-- Curves -->
    <!-- Curve 1: Attention Decay (Sky blue) -->
    <path d="M 0,20 Q 90,140 260,205 T 520,232" class="curve-decay"/>
    
    <!-- Curve 2: Violation Rate (Rose red) -->
    <path d="M 0,230 Q 150,225 260,170 T 520,30" class="curve-violation"/>
    <path d="M 0,230 Q 150,225 260,170 T 520,30 L 520,240 L 0,240 Z" fill="url(#glow-rose)"/>

    <!-- Annotations on Chart -->
    <circle cx="260" cy="170" r="5" fill="#f43f5e"/>
    <circle cx="260" cy="205" r="5" fill="#38bdf8"/>
    <line x1="260" y1="0" x2="260" y2="240" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="265" y="150" class="text-mono" fill="#f43f5e" font-weight="bold">违规率陡增 41.8%</text>
  </g>

  <!-- Side Explain Card -->
  <g transform="translate(630, 90)">
    <rect width="230" height="250" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="18" y="32" class="text-title" font-size="13px" fill="#38bdf8">数学失效机理拆解</text>
    
    <text x="18" y="65" class="text-mono" fill="#e2e8f0">Softmax 分母极度膨胀：</text>
    <rect x="18" y="78" width="194" height="42" rx="4" fill="#1e293b"/>
    <text x="26" y="104" class="text-mono" fill="#38bdf8" font-size="10.5px">α_i = e^(q·k_i) / Σ e^(q·k_j)</text>

    <text x="18" y="145" class="text-sub" font-size="11.5px">
      <tspan x="18" dy="0">• 当上下文 $N$ 冲破 64k：</tspan>
      <tspan x="26" dy="18" fill="#f43f5e">分母包含数万背景 Token</tspan>
      <tspan x="18" dy="22">• 负向约束权重跌破阈值：</tspan>
      <tspan x="26" dy="18" fill="#94a3b8">模型即使在 System Prompt</tspan>
      <tspan x="26" dy="16" fill="#94a3b8">读到指令，在采样时仍被淹没</tspan>
      <tspan x="18" dy="24" fill="#10b981">结论：必须靠 AST 硬网关拦截</tspan>
    </text>
  </g>
</svg>
