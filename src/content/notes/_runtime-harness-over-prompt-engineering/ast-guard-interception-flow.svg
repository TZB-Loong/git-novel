<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <style>
      .bg { fill: #030712; rx: 12; }
      .box { rx: 8; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: bold; font-size: 14px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #94a3b8; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow-gray); }
      .arrow-green { stroke: #10b981; stroke-width: 2; fill: none; marker-end: url(#arrow-emerald); }
      .arrow-red { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-rose); }
    </style>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-rose" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="900" height="420" class="bg"/>

  <text x="40" y="38" class="text-title" font-size="15px">图 1-2：AST Guard 运行时语法守卫与沙盒四步闭环拦截流</text>
  <text x="40" y="60" class="text-sub">在文件系统 I/O 前置拦截不可靠代码变更，将 AST 解析错误转化为行列精确上下文回注给模型</text>

  <!-- Step 1: Agent Write Request -->
  <g transform="translate(40, 95)">
    <rect width="180" height="140" fill="#1e1b4b" stroke="#6366f1" class="box"/>
    <text x="20" y="30" class="text-title" fill="#a5b4fc">1. Agent 发起写入</text>
    <text x="20" y="55" class="text-sub">ToolCall: write_file</text>
    <rect x="15" y="70" width="150" height="52" rx="4" fill="#312e81"/>
    <text x="24" y="90" class="text-mono" fill="#c7d2fe">target: auth.ts</text>
    <text x="24" y="108" class="text-mono" fill="#e0e7ff">patch: 45 行改动</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 220,165 L 265,165" class="arrow"/>

  <!-- Step 2: AST Guard Sandbox -->
  <g transform="translate(270, 80)">
    <rect width="250" height="170" fill="#064e3b" stroke="#10b981" class="box"/>
    <text x="20" y="30" class="text-title" fill="#6ee7b7">2. AST 语法守卫网关</text>
    <text x="20" y="52" class="text-sub">内存级解析与依赖拓扑检验</text>
    
    <rect x="16" y="66" width="218" height="32" rx="4" fill="#022c22"/>
    <text x="24" y="87" class="text-mono" fill="#34d399">@babel/parser 语法树构建</text>

    <rect x="16" y="106" width="218" height="52" rx="4" fill="#022c22"/>
    <text x="24" y="125" class="text-mono" fill="#a7f3d0">• 关键 Export 破坏检测</text>
    <text x="24" y="143" class="text-mono" fill="#a7f3d0">• lockfile/配置只读锁校验</text>
  </g>

  <!-- Decision Fork -->
  <!-- Branch A: Passed -> Disk Write -->
  <path d="M 520,140 L 590,140" class="arrow-green"/>
  <g transform="translate(595, 95)">
    <rect width="265" height="100" fill="#0f172a" stroke="#10b981" class="box"/>
    <text x="20" y="28" class="text-title" fill="#34d399">✓ 校验通过：原子落盘</text>
    <text x="20" y="50" class="text-sub">写入磁盘真实文件系统并触发 lint 缓存</text>
    <text x="20" y="75" class="text-mono" fill="#94a3b8">fs.writeFileSync(path, code)</text>
  </g>

  <!-- Branch B: Blocked -> Context Feedback -->
  <path d="M 395,250 L 395,300 L 460,300" class="arrow-red"/>
  <g transform="translate(465, 235)">
    <rect width="395" height="135" fill="#4c0519" stroke="#f43f5e" class="box"/>
    <text x="20" y="28" class="text-title" fill="#fecdd3">✗ 触发熔断：结构化错误栈回注</text>
    <text x="20" y="50" class="text-sub">阻止磁盘写入，将行列号与损坏签名返回给模型对话</text>
    <rect x="16" y="65" width="363" height="56" rx="4" fill="#881337"/>
    <text x="24" y="85" class="text-mono" fill="#fda4af">Error: Breaking change in export "verifyToken"</text>
    <text x="24" y="103" class="text-mono" fill="#fecdd3">Line 42: Signature mismatch: expected (req) => boolean</text>
  </g>
</svg>
