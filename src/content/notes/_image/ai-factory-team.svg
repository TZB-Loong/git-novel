<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="800" viewBox="0 0 1920 800">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#e94560"/>
    </marker>
  </defs>

  <rect width="1920" height="800" fill="#1a1a2e"/>
  <rect x="60" y="60" width="1800" height="680" rx="16" fill="none" stroke="#e94560" stroke-width="2" stroke-dasharray="10,5" opacity="0.4"/>

  <text x="960" y="115" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e94560" text-anchor="middle" font-weight="bold">AI Software Factory — 团队架构</text>

  <!-- ===== Comet (Project Manager) - Top center ===== -->
  <rect x="680" y="160" width="560" height="90" rx="10" fill="#16213e" stroke="#e94560" stroke-width="2.5"/>
  <text x="960" y="195" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#e94560" text-anchor="middle" font-weight="bold">Comet（项目经理）</text>
  <text x="960" y="220" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#888" text-anchor="middle">职责: 决定流程控制（WHEN）· 自动化调度 · 状态流转</text>

  <!-- Subtitle: Comet orchestrates -->
  <text x="960" y="290" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560" text-anchor="middle">Comet 协调双星，驱动 5 站式流水线</text>

  <!-- Down arrows from Comet -->
  <line x1="620" y1="310" x2="620" y2="360" stroke="#e94560" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="960" y1="310" x2="960" y2="360" stroke="#e94560" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="1300" y1="310" x2="1300" y2="360" stroke="#e94560" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- Labels on arrows -->
  <text x="570" y="342" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#e94560">决定 WHAT</text>
  <text x="980" y="342" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#e94560">提供 HOW</text>
  <text x="1310" y="342" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#e94560">保障质量</text>

  <!-- ===== Bottom row: three components ===== -->
  <!-- OpenSpec -->
  <rect x="400" y="370" width="440" height="140" rx="10" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
  <rect x="420" y="390" width="400" height="40" rx="6" fill="#e94560" opacity="0.2"/>
  <text x="620" y="417" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#e94560" text-anchor="middle" font-weight="bold">OpenSpec — 需求与规范</text>
  <text x="620" y="448" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">决定"做什么"（WHAT）</text>
  <text x="620" y="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">需求提议 · 系统规范 · 增量规范变更记录</text>
  <text x="620" y="490" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">产出: proposal.md / design.md / tasks.md</text>

  <!-- Superpowers -->
  <rect x="900" y="370" width="440" height="140" rx="10" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
  <rect x="920" y="390" width="400" height="40" rx="6" fill="#e94560" opacity="0.2"/>
  <text x="1120" y="417" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#e94560" text-anchor="middle" font-weight="bold">Superpowers — 执行引擎</text>
  <text x="1120" y="448" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">决定"怎么做"（HOW）</text>
  <text x="1120" y="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">深度架构设计 · 独立沙盒 · TDD 强制</text>
  <text x="1120" y="490" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">Skill 技能库 · 领域专用 Agent</text>

  <!-- Phase Guard -->
  <rect x="1400" y="370" width="440" height="140" rx="10" fill="#16213e" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="1420" y="390" width="400" height="40" rx="6" fill="#ffffff" opacity="0.1"/>
  <text x="1620" y="417" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Phase Guard — 阶段守卫</text>
  <text x="1620" y="448" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">防止空跳 · 防止漂移</text>
  <text x="1620" y="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">扫描 .comet.yaml 状态文件</text>
  <text x="1620" y="490" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">校验产物完整性 · 拒绝违规通行</text>

  <!-- Bottom: key principle banner -->
  <rect x="300" y="560" width="1320" height="70" rx="35" fill="none" stroke="#e94560" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="960" y="592" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e94560" text-anchor="middle">告别"许愿式编程" ｜ 从纯对话升级为工业化三剑客结构 ｜ 让 AI 输出可预测、可重复、可审计</text>
  <text x="960" y="615" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#888" text-anchor="middle">测试先行 · 代码隔离 · 错误可排查 · 知识可沉淀</text>

  <!-- Decorations -->
  <path d="M80,80 Q90,75 100,82" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M1840,80 Q1850,75 1860,82" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M80,720 Q90,715 100,722" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M1840,720 Q1850,715 1860,722" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
</svg>
