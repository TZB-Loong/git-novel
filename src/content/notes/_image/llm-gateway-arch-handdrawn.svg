<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#e94560"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="8" refX="5" refY="0" orient="auto">
      <path d="M0,8 L5,0 L10,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="arrowRight" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#e94560"/>
    </marker>
    <marker id="arrowDownW" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="960" y="80" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e94560" text-anchor="middle" font-weight="bold">LLM 网关 + Claude CLI 权限拦截架构</text>

  <!-- ===== Layer 1: 用户前端 ===== -->
  <rect x="560" y="130" width="800" height="120" rx="8" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="960" y="175" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">用户前端</text>
  <text x="960" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#888" text-anchor="middle">发送任务 · 接收实时输出 · 处理权限提示</text>
  <text x="960" y="220" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560" text-anchor="middle">WebSocket / SSE 实时通信</text>

  <!-- Arrow: Frontend → LLM Gateway -->
  <line x1="800" y1="250" x2="800" y2="320" stroke="#e94560" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="810" y="290" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e94560">任务请求</text>

  <!-- Arrow: LLM Gateway → Frontend (streaming) -->
  <line x1="1120" y1="320" x2="1120" y2="250" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowUp)" stroke-dasharray="5,3"/>
  <text x="1130" y="290" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffffff">流式响应</text>

  <!-- ===== Layer 2: LLM 网关 ===== -->
  <rect x="400" y="330" width="1120" height="200" rx="8" fill="#16213e" stroke="#ffffff" stroke-width="2"/>
  <text x="960" y="365" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">LLM 网关（自定义 Agent）</text>

  <!-- Sub-boxes -->
  <rect x="440" y="390" width="320" height="55" rx="6" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <text x="600" y="412" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e94560" text-anchor="middle">主控 LLM</text>
  <text x="600" y="432" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">意图理解 · 任务拆解 · 决策调度</text>

  <rect x="800" y="390" width="320" height="55" rx="6" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <text x="960" y="412" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e94560" text-anchor="middle">会话管理</text>
  <text x="960" y="432" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">上下文 · 记忆 · 工具调用</text>

  <rect x="1160" y="390" width="320" height="55" rx="6" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <text x="1320" y="412" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e94560" text-anchor="middle">权限路由</text>
  <text x="1320" y="432" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">自动放行 · 转发用户 · 缓存</text>

  <!-- Sub: 智能体委托 -->
  <rect x="570" y="460" width="780" height="40" rx="6" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="960" y="486" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e94560" text-anchor="middle">委托 Claude CLI 执行 → 拦截权限 → 汇总结果 → 解释输出</text>

  <!-- Arrow: LLM Gateway → ACP Proxy -->
  <line x1="960" y1="530" x2="960" y2="590" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowDown)"/>
  <text x="970" y="565" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560">启动/停止子进程 · 发送 prompt · 接收流式 update</text>

  <!-- ===== Layer 3: ACP Proxy ===== -->
  <rect x="400" y="600" width="1120" height="190" rx="8" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="960" y="635" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#e94560" text-anchor="middle" font-weight="bold">ACP Proxy 层（权限拦截桥）</text>
  <text x="960" y="655" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#888" text-anchor="middle">纯自建 · 零 Hermes 依赖 · Python / Node.js</text>

  <!-- ACP Proxy items -->
  <rect x="440" y="675" width="240" height="45" rx="6" fill="#0f3460" stroke="#ffffff" stroke-width="1"/>
  <text x="560" y="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">① 启动 ACP 子进程</text>

  <rect x="700" y="675" width="240" height="45" rx="6" fill="#e94560" stroke="#e94560" stroke-width="1"/>
  <text x="820" y="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">② 拦截权限请求</text>

  <rect x="960" y="675" width="240" height="45" rx="6" fill="#0f3460" stroke="#ffffff" stroke-width="1"/>
  <text x="1080" y="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">③ 注入用户决策</text>

  <rect x="1220" y="675" width="240" height="45" rx="6" fill="#0f3460" stroke="#ffffff" stroke-width="1"/>
  <text x="1340" y="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">④ 权限缓存兜底</text>

  <!-- Arrows between ACP items -->
  <line x1="680" y1="697" x2="695" y2="697" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <line x1="940" y1="697" x2="955" y2="697" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <line x1="1200" y1="697" x2="1215" y2="697" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- Permission flow annotation -->
  <text x="960" y="745" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">session/request_permission → 转发 LLM 网关 → 构建 ACP response → 注入回 Claude</text>

  <!-- Arrow: ACP Proxy → Claude CLI -->
  <line x1="960" y1="790" x2="960" y2="840" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowDown)"/>
  <text x="970" y="820" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e94560">stdin/stdout · JSON-RPC · ACP 协议 v1</text>

  <!-- Arrow: Claude CLI → ACP Proxy (permission request) -->
  <path d="M1220,850 L1220,830 L1060,830 L1060,790" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowUp)" stroke-dasharray="5,3"/>
  <text x="1150" y="818" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ffffff">session/request_permission</text>

  <!-- ===== Layer 4: Claude CLI ===== -->
  <rect x="560" y="850" width="800" height="130" rx="8" fill="#16213e" stroke="#ffffff" stroke-width="2" stroke-dasharray="8,4" opacity="0.9"/>
  <text x="960" y="885" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">Claude CLI（实际任务执行层）</text>
  <text x="960" y="910" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#888" text-anchor="middle">claude --acp --stdio</text>
  <text x="960" y="935" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#888" text-anchor="middle">执行编码 · Shell · 文件操作 · 实时流式输出</text>
  <text x="960" y="955" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560" text-anchor="middle">需权限时 → session/request_permission → 等待决策</text>

  <!-- Flow label on right side -->
  <rect x="1720" y="340" width="140" height="24" rx="4" fill="#e94560" opacity="0.15"/>
  <text x="1790" y="357" font-family="sans-serif" font-size="11" fill="#e94560" text-anchor="middle">核心数据流</text>
  <line x1="1790" y1="370" x2="1790" y2="500" stroke="#e94560" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <circle cx="1790" cy="390" r="4" fill="#e94560" opacity="0.6"/>
  <text x="1800" y="394" font-family="sans-serif" font-size="10" fill="#e94560" opacity="0.6">任务</text>
  <circle cx="1790" cy="430" r="4" fill="#e94560" opacity="0.6"/>
  <text x="1800" y="434" font-family="sans-serif" font-size="10" fill="#e94560" opacity="0.6">权限请求</text>
  <circle cx="1790" cy="470" r="4" fill="#e94560" opacity="0.6"/>
  <text x="1800" y="474" font-family="sans-serif" font-size="10" fill="#e94560" opacity="0.6">决策注入</text>
</svg>
