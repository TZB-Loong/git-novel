<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="700" viewBox="0 0 1920 700">
  <defs>
    <marker id="arrowRight" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L14,5 L0,10 Z" fill="#e94560"/>
    </marker>
  </defs>

  <rect width="1920" height="700" fill="#1a1a2e"/>
  <rect x="60" y="60" width="1800" height="580" rx="16" fill="none" stroke="#e94560" stroke-width="2" stroke-dasharray="10,5" opacity="0.4"/>

  <text x="960" y="115" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e94560" text-anchor="middle" font-weight="bold">AI Software Factory — 5 站式地铁图</text>

  <!-- Metro line (rail) -->
  <line x1="120" y1="430" x2="1800" y2="430" stroke="#e94560" stroke-width="6" opacity="0.6"/>
  <line x1="120" y1="430" x2="1800" y2="430" stroke="#e94560" stroke-width="2" opacity="0.9"/>

  <!-- ===== Station 1: Open ===== -->
  <g>
    <text x="230" y="180" font-family="sans-serif" font-size="28" fill="#e94560" text-anchor="middle" font-weight="bold">①</text>
    <rect x="130" y="200" width="200" height="50" rx="25" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="2"/>
    <text x="230" y="232" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e94560" text-anchor="middle" font-weight="bold">Open · 立项</text>
    <rect x="140" y="270" width="180" height="100" rx="6" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
    <text x="230" y="295" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">明确需求边界</text>
    <text x="230" y="315" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">产出: proposal.md</text>
    <text x="230" y="335" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">In/Out of Scope</text>
    <text x="230" y="355" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">需求 · 设计 · 任务</text>
    <!-- Rail dot -->
    <circle cx="230" cy="430" r="14" fill="#1a1a2e" stroke="#e94560" stroke-width="4"/>
    <circle cx="230" cy="430" r="6" fill="#e94560"/>
    <text x="230" y="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560" text-anchor="middle">/comet-open</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="330" y1="430" x2="420" y2="430" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- ===== Station 2: Design ===== -->
  <g>
    <text x="510" y="180" font-family="sans-serif" font-size="28" fill="#e94560" text-anchor="middle" font-weight="bold">②</text>
    <rect x="410" y="200" width="200" height="50" rx="25" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="2"/>
    <text x="510" y="232" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e94560" text-anchor="middle" font-weight="bold">Design · 深度设计</text>
    <rect x="420" y="270" width="180" height="100" rx="6" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
    <text x="510" y="295" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">苏格拉底式设计</text>
    <text x="510" y="315" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">产出: Design Doc</text>
    <text x="510" y="335" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">Delta Spec</text>
    <text x="510" y="355" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">设计方案评审</text>
    <circle cx="510" cy="430" r="14" fill="#1a1a2e" stroke="#e94560" stroke-width="4"/>
    <circle cx="510" cy="430" r="6" fill="#e94560"/>
    <text x="510" y="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560" text-anchor="middle">/comet-design</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="610" y1="430" x2="700" y2="430" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- ===== Station 3: Build ===== -->
  <g>
    <text x="810" y="180" font-family="sans-serif" font-size="28" fill="#e94560" text-anchor="middle" font-weight="bold">③</text>
    <rect x="710" y="200" width="200" height="50" rx="25" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="2"/>
    <text x="810" y="232" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e94560" text-anchor="middle" font-weight="bold">Build · 构建</text>
    <rect x="720" y="270" width="180" height="100" rx="6" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
    <text x="810" y="295" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">沙盒隔离 + TDD</text>
    <text x="810" y="315" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">2-5 分钟微任务</text>
    <text x="810" y="335" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">Git Worktree 隔离</text>
    <text x="810" y="355" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">TDD 原子提交</text>
    <circle cx="810" cy="430" r="14" fill="#1a1a2e" stroke="#e94560" stroke-width="4"/>
    <circle cx="810" cy="430" r="6" fill="#e94560"/>
    <text x="810" y="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560" text-anchor="middle">/comet-build</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="910" y1="430" x2="1000" y2="430" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- ===== Station 4: Verify ===== -->
  <g>
    <text x="1110" y="180" font-family="sans-serif" font-size="28" fill="#e94560" text-anchor="middle" font-weight="bold">④</text>
    <rect x="1010" y="200" width="200" height="50" rx="25" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="2"/>
    <text x="1110" y="232" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e94560" text-anchor="middle" font-weight="bold">Verify · 验证</text>
    <rect x="1020" y="270" width="180" height="100" rx="6" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
    <text x="1110" y="295" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">物理验收报告</text>
    <text x="1110" y="315" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">双重 Code Review</text>
    <text x="1110" y="335" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">Spec Compliance 检查</text>
    <text x="1110" y="355" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">防止过度设计</text>
    <circle cx="1110" cy="430" r="14" fill="#1a1a2e" stroke="#e94560" stroke-width="4"/>
    <circle cx="1110" cy="430" r="6" fill="#e94560"/>
    <text x="1110" y="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560" text-anchor="middle">/comet-verify</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="1210" y1="430" x2="1300" y2="430" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- ===== Station 5: Archive ===== -->
  <g>
    <text x="1410" y="180" font-family="sans-serif" font-size="28" fill="#e94560" text-anchor="middle" font-weight="bold">⑤</text>
    <rect x="1310" y="200" width="200" height="50" rx="25" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="2"/>
    <text x="1410" y="232" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e94560" text-anchor="middle" font-weight="bold">Archive · 归档</text>
    <rect x="1320" y="270" width="180" height="100" rx="6" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
    <text x="1410" y="295" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">增量规范合并</text>
    <text x="1410" y="315" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">Delta → 主 Spec</text>
    <text x="1410" y="335" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">变更永久可追溯</text>
    <text x="1410" y="355" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">知识沉淀</text>
    <circle cx="1410" cy="430" r="14" fill="#1a1a2e" stroke="#e94560" stroke-width="4"/>
    <circle cx="1410" cy="430" r="6" fill="#e94560"/>
    <text x="1410" y="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560" text-anchor="middle">/comet-archive</text>
  </g>

  <!-- Loop indicator -->
  <path d="M1520,430 Q1600,350 1680,430" fill="none" stroke="#e94560" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5" marker-end="url(#arrowRight)"/>
  <text x="1600" y="390" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#e94560" opacity="0.7" text-anchor="middle">持续迭代</text>

  <!-- Bottom subtitle -->
  <text x="960" y="540" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#888" text-anchor="middle">驱动: OpenSpec → Superpowers → Superpowers → 双星协作 → Delta Spec 合并</text>

  <!-- Decorations -->
  <path d="M80,80 Q90,75 100,82" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M1840,80 Q1850,75 1860,82" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M80,620 Q90,615 100,622" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M1840,620 Q1850,615 1860,622" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
</svg>
