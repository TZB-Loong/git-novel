<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrowRight" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#e94560"/>
    </marker>
    <marker id="arrowLeft" markerWidth="12" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M12,0 L0,4 L12,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="arrowRightW" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="#1a1a2e"/>
  <rect x="60" y="60" width="1800" height="960" rx="16" fill="none" stroke="#e94560" stroke-width="2" stroke-dasharray="10,5" opacity="0.4"/>

  <!-- Title -->
  <text x="960" y="130" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" fill="#e94560" text-anchor="middle" font-weight="bold">PTY 权限透传交互流程</text>

  <!-- Column backgrounds -->
  <rect x="120" y="200" width="420" height="760" rx="12" fill="#16213e" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>
  <rect x="750" y="200" width="420" height="760" rx="12" fill="#16213e" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>
  <rect x="1380" y="200" width="420" height="760" rx="12" fill="#16213e" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>

  <!-- Column headers -->
  <text x="330" y="260" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">前端</text>
  <text x="330" y="285" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#888" text-anchor="middle">Web/CLI</text>

  <text x="960" y="260" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">中间调度层</text>
  <text x="960" y="285" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#888" text-anchor="middle">Hermes / Node</text>

  <text x="1590" y="260" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">Claude CLI</text>
  <text x="1590" y="285" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#888" text-anchor="middle">PTY 子进程</text>

  <!-- Connection nodes (small dots at arrow endpoints) -->
  <circle cx="535" cy="330" r="5" fill="#e94560"/>
  <circle cx="735" cy="330" r="5" fill="#e94560"/>
  <circle cx="1175" cy="410" r="5" fill="#e94560"/>
  <circle cx="1375" cy="410" r="5" fill="#e94560"/>
  <circle cx="1375" cy="490" r="5" fill="#e94560"/>
  <circle cx="1175" cy="490" r="5" fill="#e94560"/>
  <circle cx="735" cy="570" r="5" fill="#e94560"/>
  <circle cx="535" cy="570" r="5" fill="#e94560"/>
  <circle cx="535" cy="650" r="5" fill="#e94560"/>
  <circle cx="735" cy="650" r="5" fill="#e94560"/>
  <circle cx="1175" cy="730" r="5" fill="#e94560"/>
  <circle cx="1375" cy="730" r="5" fill="#e94560"/>
  <circle cx="1375" cy="810" r="5" fill="#e94560"/>
  <circle cx="1175" cy="810" r="5" fill="#e94560"/>

  <!-- Step 1: Send task -->
  <line x1="545" y1="330" x2="725" y2="330" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowRight)"/>
  <text x="635" y="320" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e94560" text-anchor="middle">发送任务</text>

  <!-- Step 2: Spawn PTY -->
  <line x1="1185" y1="410" x2="1365" y2="410" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowRight)"/>
  <text x="1275" y="400" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e94560" text-anchor="middle">spawn PTY 进程</text>

  <!-- Step 3: Permission prompt (reverse, dashed white) -->
  <line x1="1365" y1="490" x2="1185" y2="490" stroke="#ffffff" stroke-width="2.5" marker-end="url(#arrowLeft)" stroke-dasharray="6,3"/>
  <text x="1275" y="480" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">Allow command?</text>

  <!-- Step 4: Forward prompt (reverse, dashed white) -->
  <line x1="725" y1="570" x2="545" y2="570" stroke="#ffffff" stroke-width="2.5" marker-end="url(#arrowLeft)" stroke-dasharray="6,3"/>
  <text x="635" y="560" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">转发权限提示</text>

  <!-- Step 5: User allows -->
  <line x1="545" y1="650" x2="725" y2="650" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowRight)"/>
  <text x="635" y="640" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e94560" text-anchor="middle">用户点击允许</text>

  <!-- Step 6: Inject decision -->
  <line x1="1185" y1="730" x2="1365" y2="730" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowRight)"/>
  <text x="1275" y="720" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e94560" text-anchor="middle">注入 Y/n</text>

  <!-- Step 7: Continue (reverse, solid white) -->
  <line x1="1365" y1="810" x2="1185" y2="810" stroke="#ffffff" stroke-width="2.5" marker-end="url(#arrowLeft)"/>
  <text x="1275" y="800" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">继续执行</text>

  <!-- Step numbers -->
  <g>
    <circle cx="180" cy="330" r="16" fill="#e94560" opacity="0.85"/>
    <text x="180" y="336" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  </g>
  <g>
    <circle cx="180" cy="410" r="16" fill="#e94560" opacity="0.85"/>
    <text x="180" y="416" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
  </g>
  <g>
    <circle cx="180" cy="490" r="16" fill="#e94560" opacity="0.85"/>
    <text x="180" y="496" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
  </g>
  <g>
    <circle cx="180" cy="570" r="16" fill="#e94560" opacity="0.85"/>
    <text x="180" y="576" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
  </g>
  <g>
    <circle cx="180" cy="650" r="16" fill="#e94560" opacity="0.85"/>
    <text x="180" y="656" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
  </g>
  <g>
    <circle cx="180" cy="730" r="16" fill="#e94560" opacity="0.85"/>
    <text x="180" y="736" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">6</text>
  </g>
  <g>
    <circle cx="180" cy="810" r="16" fill="#e94560" opacity="0.85"/>
    <text x="180" y="816" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">7</text>
  </g>

  <!-- Hand-drawn style decorative marks -->
  <path d="M80,80 Q90,75 100,82" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M1840,80 Q1850,75 1860,82" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M80,1000 Q90,995 100,1002" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M1840,1000 Q1850,995 1860,1002" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
</svg>
