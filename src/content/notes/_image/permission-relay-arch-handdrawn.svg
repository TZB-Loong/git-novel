<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#e94560"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="8" refX="5" refY="0" orient="auto">
      <path d="M0,8 L5,0 L10,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="arrowRight" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#e94560"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#1a1a2e"/>
  <rect x="60" y="60" width="1800" height="960" rx="16" fill="none" stroke="#e94560" stroke-width="2" stroke-dasharray="10,5" opacity="0.4"/>

  <!-- Title -->
  <text x="960" y="110" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e94560" text-anchor="middle" font-weight="bold">前端调度器架构</text>

  <!-- ===== Layer 1: Frontend Web UI ===== -->
  <rect x="200" y="160" width="1520" height="220" rx="10" fill="#16213e" stroke="#e94560" stroke-width="1.5" opacity="0.7"/>
  <text x="960" y="195" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e94560" text-anchor="middle" font-weight="bold">前端 Web UI</text>

  <!-- Frontend sub-components -->
  <rect x="280" y="225" width="360" height="80" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <text x="460" y="265" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">任务输入</text>
  <text x="460" y="285" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">发送目标描述</text>

  <rect x="720" y="225" width="480" height="80" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <text x="960" y="265" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">权限审批面板</text>
  <text x="960" y="285" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">展示允许/拒绝/始终允许选项</text>

  <rect x="1280" y="225" width="360" height="80" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <text x="1460" y="265" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">执行日志</text>
  <text x="1460" y="285" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">实时 stdout 输出流</text>

  <!-- Arrow: frontend → middleware -->
  <line x1="960" y1="380" x2="960" y2="430" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowDown)"/>
  <text x="1010" y="410" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560">WebSocket / SSE</text>

  <!-- ===== Layer 2: Middleware ===== -->
  <rect x="200" y="440" width="1520" height="260" rx="10" fill="#16213e" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <text x="960" y="475" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">中间调度层</text>

  <!-- Middleware steps -->
  <rect x="250" y="505" width="240" height="60" rx="6" fill="#0f3460" stroke="#ffffff" stroke-width="1"/>
  <text x="370" y="542" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">1. spawn PTY 子进程</text>

  <line x1="490" y1="535" x2="540" y2="535" stroke="#e94560" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="550" y="505" width="240" height="60" rx="6" fill="#0f3460" stroke="#ffffff" stroke-width="1"/>
  <text x="670" y="542" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">2. 解析 stdout 输出</text>

  <line x1="790" y1="535" x2="840" y2="535" stroke="#e94560" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="850" y="505" width="240" height="60" rx="6" fill="#e94560" stroke="#e94560" stroke-width="1"/>
  <text x="970" y="542" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">3. 检测权限模式</text>

  <line x1="1090" y1="535" x2="1140" y2="535" stroke="#e94560" stroke-width="2" marker-end="url(#arrowRight)"/>

  <rect x="1150" y="505" width="240" height="60" rx="6" fill="#0f3460" stroke="#ffffff" stroke-width="1"/>
  <text x="1270" y="535" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">4. 挂起进程</text>
  <text x="1270" y="552" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">推送审批到前端</text>

  <!-- Arrow up to frontend -->
  <line x1="970" y1="505" x2="970" y2="420" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowUp)" stroke-dasharray="6,3"/>
  <text x="880" y="468" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffffff">推送权限审批</text>

  <!-- Arrow down from middleware -->
  <line x1="960" y1="700" x2="960" y2="750" stroke="#e94560" stroke-width="2.5" marker-end="url(#arrowDown)"/>
  <text x="1010" y="730" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e94560">PTY 输入注入</text>

  <!-- ===== Layer 3: Claude CLI ===== -->
  <rect x="200" y="760" width="1520" height="200" rx="10" fill="#16213e" stroke="#e94560" stroke-width="1.5" opacity="0.7"/>
  <text x="960" y="795" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e94560" text-anchor="middle" font-weight="bold">Claude CLI（PTY 子进程）</text>

  <rect x="400" y="825" width="400" height="60" rx="6" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <text x="600" y="855" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">执行任务输出 stdout</text>
  <text x="600" y="873" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">产生权限提示时阻塞</text>

  <rect x="1120" y="825" width="400" height="60" rx="6" fill="#0f3460" stroke="#ffffff" stroke-width="1"/>
  <text x="1320" y="855" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">接收注入继续执行</text>
  <text x="1320" y="873" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#888" text-anchor="middle">等待 stdin 输入</text>

  <!-- Completion indicator -->
  <rect x="660" y="940" width="600" height="50" rx="25" fill="none" stroke="#e94560" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="960" y="970" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e94560" text-anchor="middle">循环直至任务完成或终止</text>

  <!-- Hand-drawn decorative marks -->
  <path d="M80,80 Q90,75 100,82" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M1840,80 Q1850,75 1860,82" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M80,1000 Q90,995 100,1002" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <path d="M1840,1000 Q1850,995 1860,1002" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
</svg>
