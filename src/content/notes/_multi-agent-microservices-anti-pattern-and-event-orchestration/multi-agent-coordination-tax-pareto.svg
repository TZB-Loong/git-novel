<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580">
  <defs>
    <style>
      .bg { fill: #040813; rx: 14; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 16px; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-h2 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #e2e8f0; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .card-bg { fill: #0b1329; stroke: #1e293b; stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <rect width="960" height="580" class="bg"/>

  <!-- Header -->
  <text x="35" y="36" class="text-title">图 3-1：Agent 节点规模 vs 协调税、Token 浪费与端到端成功率相图</text>
  <text x="35" y="56" class="text-sub">揭秘多 Agent 系统的“微服务式债务”：0.95^N 级联误差倍增律、通信协调税（Coordination Tax）与 3 节点崩塌临界墙</text>

  <!-- Main Chart Canvas -->
  <g transform="translate(35, 75)">
    <rect width="890" height="470" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>

    <!-- Left Chart: Curve Area (width: 540) -->
    <g transform="translate(35, 30)">
      <rect width="520" height="310" rx="6" fill="#070c1e" stroke="#1e293b" stroke-width="0.8"/>

      <!-- Grid lines -->
      <line x1="50" y1="40" x2="490" y2="40" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="50" y1="100" x2="490" y2="100" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="50" y1="160" x2="490" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="50" y1="220" x2="490" y2="220" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="50" y1="270" x2="490" y2="270" stroke="#334155" stroke-width="1.5"/>

      <!-- Y1 Labels (Left: Success Rate) -->
      <text x="42" y="44" text-anchor="end" class="text-mono" font-size="10" fill="#10b981">100%</text>
      <text x="42" y="104" text-anchor="end" class="text-mono" font-size="10" fill="#10b981">80%</text>
      <text x="42" y="164" text-anchor="end" class="text-mono" font-size="10" fill="#10b981">60%</text>
      <text x="42" y="224" text-anchor="end" class="text-mono" font-size="10" fill="#10b981">40%</text>
      <text x="42" y="274" text-anchor="end" class="text-mono" font-size="10" fill="#10b981">20%</text>
      <text x="15" y="25" class="text-mono" font-weight="700" font-size="10" fill="#34d399">← 端到端成功率</text>

      <!-- Y2 Labels (Right: Coordination Token % ) -->
      <text x="498" y="44" class="text-mono" font-size="10" fill="#f87171">80%</text>
      <text x="498" y="104" class="text-mono" font-size="10" fill="#f87171">60%</text>
      <text x="498" y="164" class="text-mono" font-size="10" fill="#f87171">40%</text>
      <text x="498" y="224" class="text-mono" font-size="10" fill="#f87171">20%</text>
      <text x="498" y="274" class="text-mono" font-size="10" fill="#f87171">0%</text>
      <text x="440" y="25" class="text-mono" font-weight="700" font-size="10" fill="#f87171">协调税占比 →</text>

      <!-- X-axis Labels (Number of Agents) -->
      <text x="75" y="292" text-anchor="middle" class="text-mono" font-size="10" fill="#94a3b8">N=1</text>
      <text x="155" y="292" text-anchor="middle" class="text-mono" font-size="10" fill="#94a3b8">N=2</text>
      <text x="235" y="292" text-anchor="middle" class="text-mono" font-weight="700" font-size="10" fill="#f59e0b">N=3 (临界)</text>
      <text x="315" y="292" text-anchor="middle" class="text-mono" font-size="10" fill="#94a3b8">N=5</text>
      <text x="395" y="292" text-anchor="middle" class="text-mono" font-size="10" fill="#94a3b8">N=8</text>
      <text x="465" y="292" text-anchor="middle" class="text-mono" font-size="10" fill="#94a3b8">N=12</text>

      <!-- Critical Zone: N=3 Wall -->
      <rect x="210" y="35" width="50" height="235" fill="#f59e0b" opacity="0.12" rx="4"/>
      <line x1="235" y1="35" x2="235" y2="270" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
      <rect x="185" y="15" width="100" height="18" rx="3" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
      <text x="235" y="28" text-anchor="middle" class="text-mono" font-weight="700" font-size="9" fill="#fde68a">3-Bot 物理临界墙</text>

      <!-- Curve 1: Success Rate (Green dropping curve) -->
      <!-- Formula ~ 0.95^N: 1:95%, 2:90%, 3:85.7%, 5:77.3%, 8:66.3%, 12:54% -->
      <!-- Mapping to y: 100% -> 40, 80% -> 100, 60% -> 160, 40% -> 220, 20% -> 270 -->
      <path d="M 75,55 Q 155,70 235,83 T 315,108 T 395,141 T 465,178" fill="none" stroke="#10b981" stroke-width="3"/>

      <!-- Curve 2: P2P Coordination Tax (Red exploding curve) -->
      <!-- N=1: 0%, N=2: 5%, N=3: 18%, N=5: 42%, N=8: 68%, N=12: 88% -->
      <path d="M 75,270 Q 155,255 235,216 T 315,144 T 395,76 T 465,40" fill="none" stroke="#ef4444" stroke-width="3"/>

      <!-- Data Dots -->
      <circle cx="75" cy="55" r="4" fill="#10b981"/>
      <circle cx="155" cy="70" r="4" fill="#10b981"/>
      <circle cx="235" cy="83" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
      <circle cx="315" cy="108" r="4" fill="#10b981"/>
      <circle cx="395" cy="141" r="4" fill="#10b981"/>
      <circle cx="465" cy="178" r="4" fill="#10b981"/>

      <circle cx="75" cy="270" r="4" fill="#ef4444"/>
      <circle cx="155" cy="255" r="4" fill="#ef4444"/>
      <circle cx="235" cy="216" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
      <circle cx="315" cy="144" r="4" fill="#ef4444"/>
      <circle cx="395" cy="76" r="4" fill="#ef4444"/>
      <circle cx="465" cy="40" r="4" fill="#ef4444"/>
    </g>

    <!-- Legend below curve -->
    <g transform="translate(35, 360)">
      <rect width="520" height="85" rx="6" fill="#070c1e" stroke="#1e293b" stroke-width="0.8"/>
      
      <circle cx="25" cy="25" r="5" fill="#10b981"/>
      <text x="38" y="29" class="text-mono" font-weight="700" fill="#a7f3d0">端到端任务成功率（0.95^N 级联递减）</text>
      <text x="38" y="45" class="text-body" fill="#94a3b8">单节点 95% 准确率，连串 5 个后整体仅剩 77%，连串 12 个跌至 54% 接近抛硬币。</text>

      <circle cx="25" cy="62" r="5" fill="#ef4444"/>
      <text x="38" y="66" class="text-mono" font-weight="700" fill="#fca5a5">协调税（无界私聊下消耗在“对齐与问答”的无意义 Token 占比）</text>
    </g>

    <!-- Right Side: Architectural Takeaways (width: 290) -->
    <g transform="translate(575, 30)">
      <rect width="280" height="415" rx="8" fill="#071026" stroke="#2563eb" stroke-width="1"/>
      
      <text x="18" y="30" class="text-h2" fill="#93c5fd">生产级“避坑军规”</text>
      <line x1="18" y1="42" x2="262" y2="42" stroke="#1e3a8a" stroke-width="1"/>

      <!-- Rule 1 -->
      <g transform="translate(18, 55)">
        <rect width="244" height="65" rx="4" fill="#0b1b38"/>
        <text x="10" y="18" class="text-mono" font-weight="700" fill="#38bdf8">1. 两两协作走私信 (N=2)</text>
        <text x="10" y="36" class="text-body" fill="#bfdbfe">A 与 B 点对点直连，协调税 &lt;5%，</text>
        <text x="10" y="52" class="text-body" fill="#bfdbfe">交互链路短，即时响应最快。</text>
      </g>

      <!-- Rule 2 -->
      <g transform="translate(18, 130)">
        <rect width="244" height="75" rx="4" fill="#2d1506" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="10" y="18" class="text-mono" font-weight="700" fill="#fde68a">2. 跨过 3 个 Bot 强制入群 (N≥3)</text>
        <text x="10" y="36" class="text-body" fill="#fed7aa">超过 2 个 Bot 接力严禁私发消息！</text>
        <text x="10" y="52" class="text-body" fill="#fed7aa">必须纳入 Room 事件总线，引入</text>
        <text x="10" y="68" class="text-body" fill="#fed7aa">状态仲裁与人类（loong）拍板。</text>
      </g>

      <!-- Rule 3 -->
      <g transform="translate(18, 215)">
        <rect width="244" height="85" rx="4" fill="#0b1b38"/>
        <text x="10" y="18" class="text-mono" font-weight="700" fill="#38bdf8">3. 纯产物交接 (Zero History)</text>
        <text x="10" y="36" class="text-body" fill="#bfdbfe">下游 Bot 绝不继承上游会话历史，</text>
        <text x="10" y="52" class="text-body" fill="#bfdbfe">只消费磁盘落盘文件与标准化 JSON，</text>
        <text x="10" y="68" class="text-body" fill="#bfdbfe">彻底阻断错误级联与上下文污染。</text>
      </g>

      <!-- Rule 4 -->
      <g transform="translate(18, 310)">
        <rect width="244" height="85" rx="4" fill="#0b1b38"/>
        <text x="10" y="18" class="text-mono" font-weight="700" fill="#38bdf8">4. 确定性测试门禁 (Evaluator)</text>
        <text x="10" y="36" class="text-body" fill="#bfdbfe">不靠 LLM 自我反思评判好坏；</text>
        <text x="10" y="52" class="text-body" fill="#bfdbfe">依靠 npm test、编译器报错与沙盒</text>
        <text x="10" y="68" class="text-body" fill="#bfdbfe">状态码构建确定性校验闭环。</text>
      </g>
    </g>
  </g>
</svg>