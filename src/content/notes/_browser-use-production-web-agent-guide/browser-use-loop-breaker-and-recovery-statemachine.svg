<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGradBu2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#0E1726" />
    </linearGradient>
    <linearGradient id="boxNormalLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#042F24" />
    </linearGradient>
    <linearGradient id="boxLoopBreaker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="boxAlertRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#A855F7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="12" fill="url(#bgGradBu2)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(35, 25)">
    <rect width="180" height="24" rx="4" fill="#2E1065" stroke="#A855F7" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#E9D5FF">STATE-MACHINE &amp; LOOP</text>
    <text x="195" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Browser-Use 决策循环、状态指纹比对与 Loop Breaker 熔断状态机</text>
  </g>

  <!-- Left: Normal Agent Execution Loop -->
  <g transform="translate(35, 65)">
    <rect width="430" height="315" rx="10" fill="url(#boxNormalLoop)" stroke="#10B981" stroke-width="1.5" />
    <!-- Tag -->
    <rect x="20" y="15" width="220" height="22" rx="4" fill="#047857" />
    <text x="28" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E1FBF1">常规执行环路（Observe-Act Loop）</text>

    <!-- Node 1: Observe & Hash -->
    <g transform="translate(20, 50)">
      <rect width="390" height="58" rx="6" fill="#062820" stroke="#059669" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#34D399">1. 状态感知与指纹生成 (Observe &amp; Fingerprint)</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#A7F3D0">Ht = MD5(PageURL + Hash(AccessibilityTree[:top50]))</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 215 110 L 215 125" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)" />

    <!-- Node 2: Reason & Act -->
    <g transform="translate(20, 128)">
      <rect width="390" height="58" rx="6" fill="#062820" stroke="#059669" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#34D399">2. 动作推演与底层派发 (Reason &amp; Dispatch)</text>
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#A7F3D0">LLM 生成: click(@e4) / type(@e2, val) -&gt; CDP 执行</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 215 188 L 215 203" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)" />

    <!-- Node 3: Post-Action State Check -->
    <g transform="translate(20, 206)">
      <rect width="390" height="88" rx="6" fill="#062820" stroke="#059669" stroke-width="1" />
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#34D399">3. 动作后置校验 (Post-Act Evaluation)</text>
      <text x="15" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0">· 滑动窗口比对：对比队列中最近 3 次指纹 [Ht-2, Ht-1, Ht]</text>
      <text x="15" y="60" font-family="monospace" font-size="10" fill="#6EE7B7">· 若 Ht != Ht-1: 页面状态迁移成功，重置计数器 loop_count=0</text>
      <text x="15" y="78" font-family="monospace" font-size="10" fill="#F87171">· 若 Ht == Ht-1: 状态静止，递增 loop_count += 1</text>
    </g>
  </g>

  <!-- Middle Connector & Alert Condition -->
  <g transform="translate(475, 175)">
    <rect width="80" height="80" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" />
    <text x="12" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#F59E0B">判定阈值</text>
    <text x="10" y="46" font-family="monospace" font-size="12" font-weight="700" fill="#EF4444">loop_cnt</text>
    <text x="24" y="66" font-family="monospace" font-size="13" font-weight="700" fill="#FFFFFF">&gt;= 3 ?</text>
  </g>

  <!-- Arrow from Check to Condition -->
  <path d="M 450 250 L 475 225" stroke="#F59E0B" stroke-width="2" />
  <!-- Normal Loop Return Arrow -->
  <path d="M 515 175 L 515 90 L 440 90" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-green)" />
  <text x="490" y="80" font-family="monospace" font-size="10" fill="#10B981">正常推进 (No)</text>

  <!-- Arrow to Loop Breaker (Yes) -->
  <path d="M 555 215 L 585 215" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="545" y="235" font-family="monospace" font-size="10" font-weight="700" fill="#EF4444">死循环 (Yes)</text>

  <!-- Right: Loop Breaker Interventions -->
  <g transform="translate(585, 65)">
    <rect width="340" height="315" rx="10" fill="url(#boxLoopBreaker)" stroke="#A855F7" stroke-width="1.5" />
    <!-- Tag -->
    <rect x="20" y="15" width="220" height="22" rx="4" fill="#6B21A8" />
    <text x="28" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F3E8FF">Loop Breaker 阶梯熔断干预</text>

    <!-- Tier 1 -->
    <g transform="translate(20, 50)">
      <rect width="300" height="68" rx="6" fill="#1E1338" stroke="#9333EA" stroke-width="1" />
      <text x="12" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#C084FC">Tier 1: 穿透式 DOM 缓存强制失效</text>
      <text x="12" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0">· 立即注销 @eN 映射，重新获取真实 DOM</text>
      <text x="12" y="54" font-family="-apple-system, sans-serif" font-size="10" fill="#DDD6FE">· 派发 page.mouse.wheel 扰动触发动态懒加载</text>
    </g>

    <!-- Tier 2 -->
    <g transform="translate(20, 128)">
      <rect width="300" height="78" rx="6" fill="#1E1338" stroke="#9333EA" stroke-width="1" />
      <text x="12" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#E879F9">Tier 2: 瞬态视觉回退 (Vision Fallback)</text>
      <text x="12" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0">· 截取当前 Viewport 注入多模态视觉模型</text>
      <text x="12" y="54" font-family="-apple-system, sans-serif" font-size="10" fill="#F0ABFC">· 识别无文本弹窗、透明阴影遮罩或 Cookie Banner</text>
      <text x="12" y="70" font-family="monospace" font-size="10" fill="#34D399">✔ 强制优先关闭 Blocking Modal 弹窗</text>
    </g>

    <!-- Tier 3 -->
    <g transform="translate(20, 216)">
      <rect width="300" height="68" rx="6" fill="url(#boxAlertRed)" stroke="#EF4444" stroke-width="1" />
      <text x="12" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#FECACA">Tier 3: 动作回滚或人工守护接管</text>
      <text x="12" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#FEE2E2">· 回滚至上一个稳定 Checkpoint 状态快照</text>
      <text x="12" y="54" font-family="-apple-system, sans-serif" font-size="10" fill="#FCA5A5">· 抛出 Structured Error，转交人类审批/验证码</text>
    </g>
  </g>

  <!-- Bottom: Sliding Fingerprint Buffer Visualization -->
  <g transform="translate(35, 395)">
    <rect width="890" height="120" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />

    <text x="20" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">状态指纹滑动窗口（Sliding State Buffer）与死循环熔断判定原理：</text>

    <!-- Slot t-2 -->
    <g transform="translate(20, 40)">
      <rect width="180" height="65" rx="6" fill="#1E293B" stroke="#475569" />
      <text x="12" y="20" font-family="monospace" font-size="11" fill="#94A3B8">Step t-2</text>
      <text x="12" y="38" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Hash: 8a4f91b2</text>
      <text x="12" y="54" font-family="monospace" font-size="10" fill="#64748B">Action: click(@e4)</text>
    </g>

    <!-- Equal Sign 1 -->
    <text x="215" y="78" font-family="monospace" font-size="18" font-weight="700" fill="#F59E0B">==</text>

    <!-- Slot t-1 -->
    <g transform="translate(245, 40)">
      <rect width="180" height="65" rx="6" fill="#1E293B" stroke="#F59E0B" />
      <text x="12" y="20" font-family="monospace" font-size="11" fill="#F59E0B">Step t-1 (静止)</text>
      <text x="12" y="38" font-family="monospace" font-size="11" font-weight="700" fill="#FCD34D">Hash: 8a4f91b2</text>
      <text x="12" y="54" font-family="monospace" font-size="10" fill="#F59E0B">Action: click(@e4) 重复</text>
    </g>

    <!-- Equal Sign 2 -->
    <text x="440" y="78" font-family="monospace" font-size="18" font-weight="700" fill="#EF4444">==</text>

    <!-- Slot t -->
    <g transform="translate(470, 40)">
      <rect width="180" height="65" rx="6" fill="#450A0A" stroke="#EF4444" />
      <text x="12" y="20" font-family="monospace" font-size="11" fill="#FCA5A5">Step t (死锁)</text>
      <text x="12" y="38" font-family="monospace" font-size="11" font-weight="700" fill="#FECACA">Hash: 8a4f91b2</text>
      <text x="12" y="54" font-family="monospace" font-size="10" fill="#F87171">Action: click(@e4) 连续3次</text>
    </g>

    <!-- Result Banner -->
    <g transform="translate(670, 40)">
      <rect width="200" height="65" rx="6" fill="#2E1065" stroke="#A855F7" stroke-width="1.2" />
      <text x="15" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#F0ABFC">⚡ 熔断条件触发</text>
      <text x="15" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E8F0">拦截无意义重试与 Token 浪费</text>
      <text x="15" y="56" font-family="-apple-system, sans-serif" font-size="10" fill="#34D399">进入 Tier 2 视觉探针分析遮罩</text>
    </g>
  </g>
</svg>