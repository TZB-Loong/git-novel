<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640">
  <defs>
    <linearGradient id="bgGradSeq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="headerGradSeq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="640" fill="url(#bgGradSeq)" rx="12" />

  <!-- Header -->
  <g transform="translate(40, 32)">
    <text x="0" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
      端到端自主回归测试与自愈修复时序流 (E2E Autonomous Self-Healing)
    </text>
    <text x="0" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      从自然语言需求、代码生成、DevServer 热重载，到独立 Space 语义交互与真实异常嗅探自愈
    </text>
  </g>

  <!-- 5 Actor Lifeline Headers -->
  <!-- Actor 1: Developer -->
  <g transform="translate(70, 90)">
    <rect width="130" height="38" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1.2" />
    <text x="65" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">开发者 (Human)</text>
    <line x1="65" y1="38" x2="65" y2="475" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4" />
  </g>

  <!-- Actor 2: Claude Code -->
  <g transform="translate(265, 90)">
    <rect width="145" height="38" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.4" />
    <text x="72" y="24" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Claude Code CLI</text>
    <line x1="72" y1="38" x2="72" y2="475" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6" />
  </g>

  <!-- Actor 3: Local DevServer -->
  <g transform="translate(475, 90)">
    <rect width="145" height="38" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
    <text x="72" y="24" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Vite DevServer</text>
    <line x1="72" y1="38" x2="72" y2="475" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6" />
  </g>

  <!-- Actor 4: ego-lite Space -->
  <g transform="translate(685, 90)">
    <rect width="155" height="38" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-width="1.4" />
    <text x="77" y="24" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">ego-lite (Space)</text>
    <line x1="77" y1="38" x2="77" y2="475" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6" />
  </g>

  <!-- Actor 5: Telemetry Sniffer -->
  <g transform="translate(900, 90)">
    <rect width="145" height="38" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.4" />
    <text x="72" y="24" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">遥测探针 (Telemetry)</text>
    <line x1="72" y1="38" x2="72" y2="475" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6" />
  </g>

  <!-- Sequence Messages -->
  <!-- Seq 1: Human -> Claude -->
  <g transform="translate(0, 150)">
    <line x1="135" y1="0" x2="337" y2="0" stroke="#F8FAFC" stroke-width="1.5" />
    <polygon points="337,0 327,-4 327,4" fill="#F8FAFC" />
    <text x="236" y="-8" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">1. "添加个人资料头像上传功能并验证无报错"</text>
  </g>

  <!-- Seq 2: Claude -> DevServer -->
  <g transform="translate(0, 185)">
    <line x1="337" y1="0" x2="547" y2="0" stroke="#F59E0B" stroke-width="1.5" />
    <polygon points="547,0 537,-4 537,4" fill="#F59E0B" />
    <text x="442" y="-8" fill="#FBBF24" font-family="monospace" font-size="10.5" text-anchor="middle">2. 写入 src/components/AvatarUpload.tsx</text>
  </g>

  <!-- Seq 3: DevServer self loop HMR -->
  <g transform="translate(547, 215)">
    <path d="M0,0 H40 V20 H5" fill="none" stroke="#10B981" stroke-width="1.3" />
    <polygon points="5,20 15,16 15,24" fill="#10B981" />
    <text x="50" y="14" fill="#34D399" font-family="monospace" font-size="10">3. Vite HMR (热重载耗时 38ms)</text>
  </g>

  <!-- Seq 4: Claude -> ego-lite -->
  <g transform="translate(0, 260)">
    <line x1="337" y1="0" x2="762" y2="0" stroke="#06B6D4" stroke-width="1.5" />
    <polygon points="762,0 752,-4 752,4" fill="#06B6D4" />
    <text x="549" y="-8" fill="#38BDF8" font-family="monospace" font-size="10.5" text-anchor="middle">4. ego-browser: open('http://localhost:5173/profile')</text>
  </g>

  <!-- Seq 5: ego-lite -> Telemetry -> Claude (A11y snapshot) -->
  <g transform="translate(0, 295)">
    <line x1="762" y1="0" x2="972" y2="0" stroke="#06B6D4" stroke-width="1.2" />
    <polygon points="972,0 962,-4 962,4" fill="#06B6D4" />
    <text x="867" y="-8" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">5. 继承 Cookies，静默完成页面渲染</text>
  </g>

  <g transform="translate(0, 325)">
    <line x1="972" y1="0" x2="337" y2="0" stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="3 3" />
    <polygon points="337,0 347,-4 347,4" fill="#8B5CF6" />
    <text x="654" y="-8" fill="#A78BFA" font-family="monospace" font-size="10.5" text-anchor="middle">6. 回传紧凑 A11y 树快照（识别上传按钮 @e21）</text>
  </g>

  <!-- Seq 6: Claude -> ego-lite (trigger click/upload) -->
  <g transform="translate(0, 360)">
    <line x1="337" y1="0" x2="762" y2="0" stroke="#06B6D4" stroke-width="1.5" />
    <polygon points="762,0 752,-4 752,4" fill="#06B6D4" />
    <text x="549" y="-8" fill="#38BDF8" font-family="monospace" font-size="10.5" text-anchor="middle">7. ego-browser: upload("@e21", "avatar.png") &amp; click("@e22")</text>
  </g>

  <!-- Seq 7: Error Trapped by Telemetry & Pushed to Claude -->
  <g transform="translate(0, 400)">
    <line x1="762" y1="0" x2="972" y2="0" stroke="#EF4444" stroke-width="1.5" />
    <polygon points="972,0 962,-4 962,4" fill="#EF4444" />
    <text x="867" y="-8" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">8. 运行时抛出 500 / 堆栈错误</text>
  </g>

  <g transform="translate(0, 430)">
    <line x1="972" y1="0" x2="337" y2="0" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 2" />
    <polygon points="337,0 347,-4 347,4" fill="#EF4444" />
    <text x="654" y="-8" fill="#FCA5A5" font-family="monospace" font-size="10.5" text-anchor="middle">9. 实时推送错误：TypeError: fetch failed (CORS missing headers at line 32)</text>
  </g>

  <!-- Seq 8: Claude Self-Heals -> DevServer -> Verified Pass -> Human -->
  <g transform="translate(0, 465)">
    <line x1="337" y1="0" x2="547" y2="0" stroke="#10B981" stroke-width="1.5" />
    <polygon points="547,0 537,-4 537,4" fill="#10B981" />
    <text x="442" y="-8" fill="#34D399" font-family="monospace" font-size="10.5" text-anchor="middle">10. 修复 Headers 补丁，Vite HMR 重热载</text>
  </g>

  <g transform="translate(0, 500)">
    <line x1="337" y1="0" x2="762" y2="0" stroke="#10B981" stroke-width="1.5" />
    <polygon points="762,0 752,-4 752,4" fill="#10B981" />
    <text x="549" y="-8" fill="#34D399" font-family="monospace" font-size="10.5" text-anchor="middle">11. 二次复验：UI 显示 "Upload Success!"，遥测 0 Error</text>
  </g>

  <g transform="translate(0, 535)">
    <line x1="337" y1="0" x2="135" y2="0" stroke="#10B981" stroke-width="1.8" />
    <polygon points="135,0 145,-4 145,4" fill="#10B981" />
    <text x="236" y="-8" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">12. 交付结论：端到端真机验证通过，Commit 已就绪</text>
  </g>

  <!-- Bottom Flow Status -->
  <g transform="translate(40, 580)">
    <rect width="1020" height="42" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#10B981" />
    <text x="35" y="25" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      全链路无需人类手动切换标签页复制粘贴报错日志 · 真正实现“需求输入 $\rightarrow$ 终端自编写 $\rightarrow$ 浏览器自验证 $\rightarrow$ 异常自修复”闭环
    </text>
  </g>
</svg>
