<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <defs>
    <linearGradient id="bgGradComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="redOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="emeraldTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="panelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="600" fill="url(#bgGradComp)" rx="12" />

  <!-- Header -->
  <g transform="translate(40, 35)">
    <text x="0" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
      传统单测 Mock 盲区 vs ego-lite 真实运行时遥测自愈对比
    </text>
    <text x="0" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      为什么纯终端 Coding Agent 即使跑绿所有单元测试，交付的前端页面依然可能瞬间白屏崩溃？
    </text>
  </g>

  <!-- Left Column: Traditional Blind Unit Testing (Flawed) -->
  <g transform="translate(40, 90)">
    <rect width="495" height="420" rx="10" fill="url(#panelDark)" stroke="#EF4444" stroke-width="1.3" stroke-opacity="0.6" />
    <path d="M0,0 H495 V38 H0 Z" fill="#EF4444" fill-opacity="0.12" rx="10" />
    <circle cx="20" cy="19" r="6" fill="#EF4444" />
    <text x="36" y="24" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
      传统模式：CLI 终端“虚假绿灯”与单测盲区
    </text>

    <!-- Step 1: Mock Test Run -->
    <g transform="translate(18, 55)">
      <rect width="459" height="78" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="14" y="22" fill="#A1A1AA" font-family="monospace" font-size="11">&gt; vitest run cart.test.tsx</text>
      <text x="14" y="42" fill="#10B981" font-family="monospace" font-size="12" font-weight="700">✓ renderCartComponent (12ms)</text>
      <text x="14" y="60" fill="#10B981" font-family="monospace" font-size="12" font-weight="700">✓ fireEvent.click(submitBtn) (8ms) [100% PASS]</text>
      <rect x="360" y="32" width="85" height="26" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <text x="402" y="49" fill="#34D399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">FAKE PASS</text>
    </g>

    <!-- Step 2: The Mock Trap Explanations -->
    <g transform="translate(18, 145)">
      <rect width="459" height="150" rx="6" fill="#2A1215" stroke="#7F1D1D" stroke-width="1" />
      <text x="14" y="24" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
        为什么测试通过但真实运行必崩？（Mock 盲区）
      </text>
      
      <text x="14" y="48" fill="#FECACA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        1. 虚拟 DOM 掩盖渲染崩溃：JSDOM 无法模拟真实的 CSS 重绘与 CSSOM 计算
      </text>
      <text x="14" y="70" fill="#FECACA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        2. 遮罩层 z-index 穿透失效：实际运行中透明 Modal 遮挡了按钮，用户根本无法点中
      </text>
      <text x="14" y="92" fill="#FECACA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        3. 真实 API 响应类型漂移：后端真实返回了 undefined，但 Mock 假数据返回了数组
      </text>
      <text x="14" y="114" fill="#FECACA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        4. Storage 鉴权丢失：生产环境未登录被路由守卫强制 302 重定向到 Login
      </text>
      <text x="14" y="136" fill="#F87171" font-family="monospace" font-size="11" font-weight="700">
        ! 结果：Agent 盲目提交代码，人类上线刷新直接遇到白屏死机
      </text>
    </g>

    <!-- Step 3: Bad Outcome Banner -->
    <g transform="translate(18, 310)">
      <rect width="459" height="88" rx="6" fill="#1C1917" stroke="#44403C" stroke-width="1" />
      <text x="14" y="26" fill="#EF4444" font-family="monospace" font-size="12" font-weight="700">Browser Console (Human Opened):</text>
      <text x="14" y="48" fill="#F87171" font-family="monospace" font-size="11">Uncaught TypeError: Cannot read properties of undefined (reading 'map')</text>
      <text x="14" y="66" fill="#A8A29E" font-family="monospace" font-size="10.5">at CheckoutList (Checkout.tsx:48) -&gt; 导致整页 React ErrorBoundary 崩溃</text>
    </g>
  </g>

  <!-- Right Column: Claude Code + ego-lite Runtime Telemetry (Winner) -->
  <g transform="translate(565, 90)">
    <rect width="495" height="420" rx="10" fill="url(#panelDark)" stroke="#10B981" stroke-width="1.3" stroke-opacity="0.6" />
    <path d="M0,0 H495 V38 H0 Z" fill="#10B981" fill-opacity="0.12" rx="10" />
    <circle cx="20" cy="19" r="6" fill="#10B981" />
    <text x="36" y="24" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
      增强模式：Claude Code + ego-lite 真机端到端自愈
    </text>

    <!-- Step 1: Real Action Trigger in Space -->
    <g transform="translate(18, 55)">
      <rect width="459" height="78" rx="6" fill="#082F49" stroke="#0284C7" stroke-width="1" />
      <text x="14" y="22" fill="#38BDF8" font-family="monospace" font-size="11">&gt; ego-browser: open('http://localhost:3000/cart')</text>
      <text x="14" y="42" fill="#BAE6FD" font-family="monospace" font-size="11.5">&gt; ego-browser: click("@e14") [提交结算按钮]</text>
      <text x="14" y="62" fill="#38BDF8" font-family="monospace" font-size="11">&gt; 真实 Blink 渲染管线加载 · 会话凭证自动携带</text>
      <rect x="355" y="32" width="90" height="26" rx="4" fill="#0369A1" />
      <text x="400" y="49" fill="#F0F9FF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">REAL SPACE</text>
    </g>

    <!-- Step 2: Runtime Telemetry Capture -->
    <g transform="translate(18, 145)">
      <rect width="459" height="150" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" />
      <text x="14" y="24" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
        真机异常毫秒级上报与精确定位
      </text>

      <text x="14" y="48" fill="#E0E7FF" font-family="monospace" font-size="11">
        [Console Error Trapped]:
      </text>
      <text x="14" y="68" fill="#F87171" font-family="monospace" font-size="11">
        TypeError: res.data.items is undefined
      </text>
      <text x="14" y="88" fill="#A5B4FC" font-family="monospace" font-size="11">
        SourceMap: src/components/CartList.tsx:54:18 (已逆向还原)
      </text>
      <text x="14" y="110" fill="#E0E7FF" font-family="monospace" font-size="11">
        [Network Inspector]:
      </text>
      <text x="14" y="130" fill="#FCA5A5" font-family="monospace" font-size="10.5">
        POST /api/cart/checkout 422 (Body: {"items": []}) - 空数组校验失败
      </text>
    </g>

    <!-- Step 3: Closed-Loop Self-Healing -->
    <g transform="translate(18, 310)">
      <rect width="459" height="88" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <text x="14" y="26" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">Claude Code 自动化自愈修复：</text>
      <text x="14" y="48" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        1. 注入可选链安全访问：res.data?.items ?? []
      </text>
      <text x="14" y="68" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        2. 触发 Vite HMR 重新热编译，再次执行点击交互，遥测显示 0 Error，交付！
      </text>
    </g>
  </g>

  <!-- Bottom Metric Comparison -->
  <g transform="translate(40, 525)">
    <rect width="1020" height="55" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    
    <g transform="translate(40, 18)">
      <text x="0" y="16" fill="#EF4444" font-family="monospace" font-size="15" font-weight="700">26%</text>
      <text x="45" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">传统单测交付后前端无白屏率</text>
    </g>

    <g transform="translate(380, 18)">
      <text x="0" y="16" fill="#10B981" font-family="monospace" font-size="15" font-weight="700">96.8%</text>
      <text x="60" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Claude + ego-lite 真机端到端自愈后可用率</text>
    </g>

    <g transform="translate(740, 18)">
      <text x="0" y="16" fill="#38BDF8" font-family="monospace" font-size="15" font-weight="700">0 次</text>
      <text x="45" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">开发者鼠标光标与桌面窗口焦点抢占</text>
    </g>
  </g>
</svg>
